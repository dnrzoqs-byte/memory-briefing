name: Daily Memory & Market Briefing Updater

on:
  schedule:
    # 24시간 매시간 정각 자동 실행 (DRAMeXchange·국내/미국 장세·WTI·환율 상시 최신 동기화)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Market Data Updater
        run: |
          python scripts/update_market_data.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_briefing.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update daily DRAM & market data [skip ci]" && git push)
