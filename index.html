<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>반도체 기관 심층 리서치 터미널 (Claude Opus × TDS v14.0)</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <style>
    /* =====================================================================
       Toss Design System (TDS) × Claude Opus 정밀 조판 시스템 (v14.0)
       1. 글꼴 깨짐 완전 해결:
          - dynamic-subset 2종 중복 로드 제거 → 단일 정식 Pretendard Variable 풀 폰트 사용
          - 모든 유니코드 이모지(⚖️, 🛡️, 🚨, 🏢, 📊 등) 제거 → 순수 SVG 벡터 아이콘 및 CSS 뱃지로 대체
          - SVG 차트 8포인트 라벨 2단 스태거(-10px / -22px)로 글자 겹침 완전 해소
       2. 기업별 5대 심층 분석([특징·무기] / [매출·이익구조] / [오해와 진실] / [27년 상·하반기 전망] / [금리·환율·상호연결])
       ===================================================================== */
    :root {
      --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", Roboto, system-ui, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      --tracking-display: -0.025em;
      --tracking-title: -0.02em;
      --tracking-body: -0.01em;
      --tracking-caption: 0.005em;

      --bg-page: #F3F5F8;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --bg-elevated: #EEF2F6;
      --bg-accent: #EFF4FF;

      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;

      --border-color: #E2E8F0;
      --border-subtle: #F1F5F9;

      --up-red: #E11D48;
      --up-red-soft: rgba(225, 29, 72, 0.07);
      --down-blue: #2563EB;
      --down-blue-soft: rgba(37, 99, 235, 0.08);
      --safe-green: #0D9488;
      --safe-green-soft: rgba(13, 148, 136, 0.08);
      --warn-amber: #B45309;
      --warn-amber-soft: rgba(180, 83, 9, 0.08);
      --purple-accent: #4F46E5;
      --purple-soft: rgba(79, 70, 229, 0.08);
      --brand-ink: #1E293B;

      --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.03), 0 12px 32px -12px rgba(15, 23, 42, 0.06);
    }

    html.dark {
      --bg-page: #0B0F17;
      --bg-surface: #131A26;
      --bg-subtle: #1B2434;
      --bg-elevated: #243044;
      --bg-accent: #1B2C4E;

      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #8492A6;

      --border-color: #232E42;
      --border-subtle: #1A2333;

      --up-red: #FB7185;
      --up-red-soft: rgba(251, 113, 133, 0.14);
      --down-blue: #60A5FA;
      --down-blue-soft: rgba(96, 165, 250, 0.15);
      --safe-green: #2DD4BF;
      --safe-green-soft: rgba(45, 212, 191, 0.14);
      --warn-amber: #FBBF24;
      --warn-amber-soft: rgba(251, 191, 36, 0.14);
      --purple-accent: #818CF8;
      --purple-soft: rgba(129, 140, 248, 0.15);
      --brand-ink: #3B82F6;

      --shadow-card: 0 8px 28px rgba(0, 0, 0, 0.5);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      word-break: keep-all;
      overflow-wrap: break-word;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.6;
      letter-spacing: var(--tracking-body);
      font-weight: 400;
    }

    button {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: none;
      font-family: inherit;
      color: inherit;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .num {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      letter-spacing: -0.005em;
    }

    .nowrap {
      white-space: nowrap;
    }

    .app-shell {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 86px;
      overflow-x: hidden;
    }

    /* 상단 고정 헤더 */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
    }

    html.dark .app-header {
      background-color: rgba(19, 26, 38, 0.95);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 8px;
      gap: 10px;
    }

    .header-left {
      min-width: 0;
      flex: 1;
    }

    .header-eyebrow {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--safe-green);
      display: inline-block;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: var(--tracking-display);
      line-height: 1.28;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-refresh {
      height: 34px;
      padding: 0 13px;
      border-radius: 10px;
      background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    html.dark .btn-refresh {
      background: linear-gradient(180deg, #3B82F6 0%, #2563EB 100%);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    .btn-refresh:active {
      transform: scale(0.96);
      opacity: 0.88;
    }

    .btn-dark {
      height: 34px;
      padding: 0 10px;
      border-radius: 10px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }

    .btn-dark:active {
      transform: scale(0.96);
      background-color: var(--bg-elevated);
    }

    .sync-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 16px 8px;
      font-size: 11px;
      color: var(--text-muted);
      gap: 8px;
    }

    .sync-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
      overflow: hidden;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 10.5px;
      background-color: var(--bg-accent);
      color: var(--down-blue);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 상단 네비게이션 탭 */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      padding: 0 8px;
      background-color: var(--bg-surface);
    }

    .nav-tab {
      height: 42px;
      padding: 0 2px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 2.5px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
      letter-spacing: -0.015em;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .nav-tab.active {
      color: var(--text-primary);
      border-bottom-color: var(--text-primary);
      font-weight: 800;
    }

    /* 하단 고정 독 */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      background-color: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      z-index: 60;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    }

    html.dark .bottom-dock {
      background-color: rgba(19, 26, 38, 0.97);
    }

    .dock-btn {
      min-height: 46px;
      padding: 4px 2px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      white-space: nowrap;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }

    .dock-btn:active {
      transform: scale(0.95);
      background-color: var(--bg-subtle);
    }

    .dock-btn.active {
      color: var(--down-blue);
      font-weight: 800;
    }

    .dock-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .dock-icon svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .dock-label { font-size: 11px; font-weight: 700; letter-spacing: -0.01em; }

    /* 본문 영역 */
    .view-body {
      flex: 1;
      padding: 14px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 0;
      gap: 8px;
    }

    .section-head-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 21px;
      padding: 0 8px;
      border-radius: 6px;
      background-color: var(--brand-ink);
      color: #FFFFFF;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: var(--tracking-title);
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-source {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: var(--tracking-caption);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 카드 공통 */
    .tds-card {
      background-color: var(--bg-surface);
      border: 1px solid rgba(15, 23, 42, 0.04);
      border-radius: 20px;
      padding: 18px 16px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    html.dark .tds-card {
      border-color: rgba(255, 255, 255, 0.05);
    }

    .card-headline {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-headline-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: var(--tracking-title);
      line-height: 1.4;
    }

    .card-subtitle {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 23px;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 실시간 6대 지표 그리드 (2×3 배치) */
    .macro-grid-2x3 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .macro-tile {
      background-color: var(--bg-subtle);
      border-radius: 14px;
      padding: 12px 13px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .mt-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      min-width: 0;
    }

    .mt-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mt-chg {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .mt-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.22;
      margin-top: 2px;
    }

    .mt-fact {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =====================================================================
       정밀 정렬 컴포넌트 1: 번호형 들여쓰기 리스트 (.bullet-list & .bullet-item)
       - 2번째 줄 이후 텍스트가 번호 아래로 침범하지 않고 칼같이 수직 정렬됨
       ===================================================================== */
    .deep-block {
      background-color: var(--bg-subtle);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .deep-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .deep-block-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.38;
    }

    .deep-prose {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .deep-prose strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    .bullet-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bullet-item {
      background-color: var(--bg-surface);
      border-radius: 12px;
      padding: 12px 13px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .bullet-num {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background-color: var(--bg-accent);
      color: var(--down-blue);
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .bullet-num.red {
      background-color: var(--up-red-soft);
      color: var(--up-red);
    }

    .bullet-num.green {
      background-color: var(--safe-green-soft);
      color: var(--safe-green);
    }

    .bullet-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .bullet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .bullet-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .bullet-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--down-blue);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .bullet-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.56;
    }

    .bullet-desc strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    /* =====================================================================
       정밀 정렬 컴포넌트 2: 5대 기각 신호등 카드 (.redline-list & .redline-card)
       - 4열 테이블 대신 [상단 지표명+현재값] + [하단 좌(안전)/우(경보) 2열 박스]
       ===================================================================== */
    .redline-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .redline-card {
      background-color: var(--bg-surface);
      border-radius: 12px;
      padding: 12px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rl-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .rl-name {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .rl-curr {
      font-size: 12px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      background-color: var(--bg-subtle);
      color: var(--text-primary);
    }

    .rl-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .rl-box {
      border-radius: 9px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .rl-box.safe {
      background-color: var(--safe-green-soft);
    }

    .rl-box.danger {
      background-color: var(--up-red-soft);
    }

    .rl-box-lbl {
      font-size: 10.5px;
      font-weight: 700;
    }

    .rl-box.safe .rl-box-lbl { color: var(--safe-green); }
    .rl-box.danger .rl-box-lbl { color: var(--up-red); }

    .rl-box-val {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.4;
    }

    /* =====================================================================
       정밀 정렬 컴포넌트 3: 시나리오 매트릭스 카드 (.scenario-list & .scenario-card)
       - 5열 테이블 대신 시나리오별 독립 카드 + 하단 3열 종목 목표가 박스
       ===================================================================== */
    .scenario-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scenario-card {
      background-color: var(--bg-surface);
      border-radius: 12px;
      padding: 12px 13px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .sc-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sc-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .sc-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .sc-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .sc-cell {
      background-color: var(--bg-subtle);
      border-radius: 8px;
      padding: 7px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sc-cell-lbl {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .sc-cell-val {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .sc-cell-sub {
      font-size: 10.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* =====================================================================
       정밀 정렬 컴포넌트 4: 2줄 스택형 데이터 행 (.stack-row-list & .stack-row)
       - 분기 실적표·10년 밸류 밴드표를 깨짐 없는 2줄 정렬 리스트로 표시
       ===================================================================== */
    .stack-row-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .stack-row {
      background-color: var(--bg-surface);
      border-radius: 11px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sr-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .sr-left {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .sr-right {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--down-blue);
      text-align: right;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sr-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    /* 6종목 한눈 요약 카드 리스트 */
    .stock-summary-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stock-summary-item {
      background-color: var(--bg-subtle);
      border-radius: 16px;
      padding: 15px;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }

    .stock-summary-item:active {
      transform: scale(0.985);
      background-color: var(--bg-elevated);
    }

    .ssi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .ssi-name-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .ssi-name {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .ssi-percentile {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background-color: var(--bg-accent);
      color: var(--down-blue);
      white-space: nowrap;
    }

    .ssi-rr-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background-color: var(--safe-green-soft);
      color: var(--safe-green);
      white-space: nowrap;
    }

    .ssi-price-wrap {
      text-align: right;
      flex-shrink: 0;
    }

    .ssi-price {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .ssi-chg {
      font-size: 12px;
      font-weight: 700;
      margin-left: 4px;
    }

    /* 스펙트럼 게이지 바 */
    .spectrum-wrap {
      margin: 8px 0 10px;
    }

    .spectrum-track {
      position: relative;
      height: 7px;
      border-radius: 999px;
      background-color: var(--bg-elevated);
      margin: 6px 0;
    }

    .spectrum-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #0D9488 0%, #2563EB 100%);
    }

    .spectrum-dot {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: var(--down-blue);
      border: 3px solid var(--bg-surface);
      box-shadow: 0 1px 5px rgba(37, 99, 235, 0.45);
      transform: translate(-50%, -50%);
    }

    .spectrum-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* 2×2 서피스 박스 그리드 */
    .target-strip-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }

    .ts-box {
      background-color: var(--bg-surface);
      border-radius: 11px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .ts-box-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .ts-lbl {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .ts-sub {
      font-size: 10.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .ts-val {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 1px;
    }

    /* 서브 탭 세그먼트 버튼 */
    .seg-grid-3x2 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      background-color: var(--bg-subtle);
      padding: 6px;
      border-radius: 14px;
    }

    .seg-grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      background-color: var(--bg-subtle);
      padding: 6px;
      border-radius: 14px;
    }

    .seg-btn {
      min-height: 40px;
      padding: 6px 4px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
      min-width: 0;
      width: 100%;
      transition: transform 0.12s ease, background-color 0.12s ease, box-shadow 0.12s ease;
    }

    .seg-btn:active {
      transform: scale(0.96);
    }

    .seg-btn.active {
      background-color: var(--bg-surface);
      color: var(--down-blue);
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    /* 종목 상세 헤더 */
    .stock-detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .sd-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: var(--tracking-display);
      color: var(--text-primary);
    }

    .sd-code {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 5px;
    }

    .sd-price-box {
      text-align: right;
      flex-shrink: 0;
    }

    .sd-price {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    /* 차트 영역 */
    .chart-box {
      background-color: var(--bg-subtle);
      border-radius: 16px;
      padding: 13px 10px 8px;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      padding: 0 4px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .svg-chart {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 대칭형 캡슐 네비게이션 버튼 */
    .dual-nav-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 4px;
    }

    .nav-action-btn {
      min-height: 46px;
      padding: 0 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-width: 0;
      width: 100%;
      background-color: var(--bg-subtle);
      color: var(--text-primary);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .nav-action-btn:active {
      transform: scale(0.97);
    }

    .nav-action-btn.surface-card {
      background-color: var(--bg-surface);
      box-shadow: var(--shadow-card);
    }

    .nav-action-btn.primary {
      background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    html.dark .nav-action-btn.primary {
      background: linear-gradient(180deg, #3B82F6 0%, #2563EB 100%);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .nav-action-btn.accent-soft {
      background-color: var(--bg-accent);
      color: var(--down-blue);
    }

    .nav-btn-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-toast {
      position: fixed;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: rgba(15, 23, 42, 0.95);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

        const rr = Math.max(1.5, up2 / downFloor).toFixed(1);
        st.riskRewardRatio = `1 : ${rr}`;

        const minBand = st.floorRaw * 0.92;
        const maxBand = st.sell3Raw;
        const rawPos = ((st.rawCurr - minBand) / (maxBand - minBand)) * 100;
        st.bandPositionPct = Math.min(94, Math.max(6, Math.round(rawPos)));

        if (Array.isArray(st.recentClosesRaw) && st.recentClosesRaw.length >= 4) {
          const rc = st.recentClosesRaw;
          const rd = st.recentDates || [];
          const toUnit = (v) => isKrw ? +(v / 10000).toFixed(2) : +Number(v).toFixed(2);
          st.history = [
            toUnit(rc[0]),
            toUnit(rc[1]),
            toUnit(rc[2]),
            toUnit(rc[3]),
            st.curr,
            st.sell1Unit,
            st.sell2Unit,
            st.sell3Unit
          ];
          st.histLabels = [
            rd[0] || "11/16",
            rd[1] || "11/17",
            rd[2] || "11/18",
            rd[3] || "11/19",
            "현재",
            "1차매도",
            "2차매도",
            "3차매도"
          ];
        }
      });
    }

    // =========================================================================
    function renderLineSvg(pts, labels, forecastStartIdx, unitPrefix = "$", unitSuffix = "") {
      const w = 500, h = 166, padX = 38, topY = 36, botY = 126;
      const minV = Math.min(...pts) * 0.90;
      const maxV = Math.max(...pts) * 1.08;
      const range = maxV - minV || 1;
      const stepX = (w - padX * 2) / (pts.length - 1);

      const coords = pts.map((v, i) => ({
        x: padX + i * stepX,
        y: botY - ((v - minV) / range) * (botY - topY),
        v,
        label: labels[i] || ""
      }));

      const solidPts = coords.slice(0, forecastStartIdx + 1).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const dashPts = coords.slice(forecastStartIdx).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const areaPts = `${coords[0].x.toFixed(1)},${botY} ` + coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ") + ` ${coords[coords.length - 1].x.toFixed(1)},${botY}`;

      let nodesHtml = "";
      coords.forEach((c, idx) => {
        const isForecast = idx > forecastStartIdx;
        const isCurrent = idx === forecastStartIdx;
        const dotColor = isCurrent ? "var(--up-red)" : (isForecast ? "var(--safe-green)" : "var(--down-blue)");
        const r = isCurrent ? 5 : 3.6;
        const valStr = `${unitPrefix}${Number.isInteger(c.v) ? c.v : c.v.toFixed(1)}${unitSuffix}`;
        const yOffset = idx % 2 === 0 ? -9 : -21;

        nodesHtml += `
          <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${r}" fill="${dotColor}" stroke="var(--bg-surface)" stroke-width="1.6" />
          <text x="${c.x.toFixed(1)}" y="${(c.y + yOffset).toFixed(1)}" text-anchor="middle" font-size="${isCurrent ? '10.5' : '9.5'}" font-weight="800" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-primary)'}">${valStr}</text>
          <text x="${c.x.toFixed(1)}" y="${h - 10}" text-anchor="middle" font-size="9.5" font-weight="${isCurrent ? '800' : '600'}" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-muted)'}">${c.label}</text>
        `;
      });

      return `
        <svg viewBox="0 0 ${w} ${h}" class="svg-chart">
          <defs>
            <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--down-blue)" stop-opacity="0.14"/>
              <stop offset="100%" stop-color="var(--down-blue)" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <line x1="${padX}" y1="${topY}" x2="${w - padX}" y2="${topY}" stroke="var(--border-color)" stroke-dasharray="3 3" stroke-width="0.8" />
          <line x1="${padX}" y1="${(topY + botY) / 2}" x2="${w - padX}" y2="${(topY + botY) / 2}" stroke="var(--border-color)" stroke-dasharray="3 3" stroke-width="0.8" />
          <line x1="${padX}" y1="${botY}" x2="${w - padX}" y2="${botY}" stroke="var(--border-color)" stroke-width="1" />
          <polygon points="${areaPts}" fill="url(#chartGrad)" />
          <polyline fill="none" stroke="var(--down-blue)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="${solidPts}" />
          ${forecastStartIdx < coords.length - 1 ? `<polyline fill="none" stroke="var(--safe-green)" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" points="${dashPts}" />` : ""}
          ${nodesHtml}
        </svg>
      `;
    }

    function switchView(viewName, scrollTop = true) {
      currentView = viewName;
      ["dram", "overview5", "factcheck", "rates"].forEach(v => {
        const t = document.getElementById(`tab-${v}`);
        const d = document.getElementById(`dock-${v}`);
        if (t) t.classList.toggle("active", v === viewName);
        if (d) d.classList.toggle("active", v === viewName);
      });

      const container = document.getElementById("viewContainer");
      if (viewName === "dram") container.innerHTML = renderDramView();
      else if (viewName === "overview5") container.innerHTML = renderOverview5View();
      else if (viewName === "factcheck") container.innerHTML = renderFactCheckView();
      else if (viewName === "rates") container.innerHTML = renderRatesView();

      if (scrollTop) window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function selectDramKey(k) {
      currentDramKey = k;
      switchView("rates", false);
    }

    function selectStockKey(k) {
      currentStockKey = k;
      switchView("overview5", false);

    function showToast(msg) {
      const t = document.getElementById("liveToast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2600);
    }

    function applyRichStockDetail(sKey, detailObj, fallbackPrice, fallbackHigh52) {
      const target = stockData[sKey];
      if (!target) return;
      const isKrw = target.unit === "만";
      const rawP = (detailObj && Number(detailObj.price) > 0) ? Number(detailObj.price) : Number(fallbackPrice);
      if (rawP > 0) target.rawCurr = rawP;

      if (detailObj) {
        if (typeof detailObj.change_pct === "number") target.changePct = detailObj.change_pct;
        if (typeof detailObj.week_change_pct === "number") target.weekChangePct = detailObj.week_change_pct;
        if (Number(detailObj.high52w) > 0) {
          target.high52w = isKrw ? +(Number(detailObj.high52w) / 10000).toFixed(2) : +Number(detailObj.high52w).toFixed(2);
        }
        if (Array.isArray(detailObj.recent_closes) && detailObj.recent_closes.length >= 4) {
          target.recentClosesRaw = detailObj.recent_closes;
        }
        if (Array.isArray(detailObj.recent_dates) && detailObj.recent_dates.length >= 4) {
          target.recentDates = detailObj.recent_dates;
        }
      } else if (Number(fallbackHigh52) > 0) {
        target.high52w = isKrw ? +(Number(fallbackHigh52) / 10000).toFixed(2) : +Number(fallbackHigh52).toFixed(2);
      }
    }

    function applyLivePayload(data) {
      if (!data || typeof data !== "object") return;

      const dSpot = data.dram || data.dram_spot;
      if (dSpot) {
        const keyMap = {
          ddr5_16g: dSpot.ddr5_16g,
          ddr4_16g: dSpot.ddr4_16g,
          ddr4_8g: dSpot.ddr4_8g,
          ddr5_mod: dSpot.ddr5_mod || dSpot.ddr5_16g_mod
        };
        Object.entries(keyMap).forEach(([k, item]) => {
          if (item && item.price) {
            const p = Number(Number(item.price).toFixed(2));
            dramSeries[k].price = p;
            dramSeries[k].pts[4] = p;
            if (item.change) dramSeries[k].change = item.change;
          }
        });
      }

      const mc = data.macro || {};
      if (mc.kospi) liveMacro.kospi = Number(mc.kospi);
      if (mc.kospi_change_pct !== undefined) liveMacro.kospiChg = Number(mc.kospi_change_pct);
      if (mc.kosdaq) liveMacro.kosdaq = Number(mc.kosdaq);
      if (mc.sox) liveMacro.sox = Number(mc.sox);
      if (mc.sox_change_pct !== undefined) liveMacro.soxChg = Number(mc.sox_change_pct);
      if (mc.nasdaq) liveMacro.nasdaq = Number(mc.nasdaq);
      if (mc.nasdaq_change_pct !== undefined) liveMacro.nasdaqChg = Number(mc.nasdaq_change_pct);
      if (mc.vix) liveMacro.vix = Number(mc.vix);
      if (mc.vix_change_pct !== undefined) liveMacro.vixChg = Number(mc.vix_change_pct);
      if (mc.us10y || data.us10y) liveMacro.us10y = Number(mc.us10y || data.us10y);
      if (mc.us10y_change_pct !== undefined) liveMacro.us10yChg = Number(mc.us10y_change_pct);
      if (Array.isArray(mc.us10y_recent) && mc.us10y_recent.length >= 4) liveMacro.us10yRecent = mc.us10y_recent;
      if (Array.isArray(mc.us10y_dates) && mc.us10y_dates.length >= 4) liveMacro.us10yDates = mc.us10y_dates;
      if (mc.tlt_price || data.tlt_price) liveMacro.tlt = Number(mc.tlt_price || data.tlt_price);
      if (mc.tlt_price_change_pct !== undefined) liveMacro.tltChg = Number(mc.tlt_price_change_pct);
      if (mc.wti_oil || data.wti_oil) liveMacro.wtiOil = Number(mc.wti_oil || data.wti_oil);
      if (mc.wti_oil_change_pct !== undefined) liveMacro.wtiChg = Number(mc.wti_oil_change_pct);
      if (mc.usdkrw || data.usdkrw) liveMacro.usdkrw = Number(mc.usdkrw || data.usdkrw);
      if (mc.usdkrw_change_pct !== undefined) liveMacro.usdkrwChg = Number(mc.usdkrw_change_pct);

      const st = data.stocks || {};
      const h52 = data.high52w || {};
      const dt = data.stocks_detail || {};
      if (dt.NVDA && dt.NVDA.price) {
        liveMacro.nvda = Number(dt.NVDA.price);
        liveMacro.nvdaChg = Number(dt.NVDA.change_pct || 0);
      }

      const mapSym = {
        "005935.KS": "stock_005935",
        "005930.KS": "stock_005930",
        "353200.KS": "stock_353200",
        "240810.KQ": "stock_240810",
        "AMD": "stock_AMD",
        "CLS": "stock_CLS"
      };
      Object.entries(mapSym).forEach(([sym, sKey]) => {
        if (dt[sym] || st[sym]) {
          applyRichStockDetail(sKey, dt[sym], Number(st[sym]), Number(h52[sym]));
        }
      });

      if (data.live_news && typeof data.live_news === "object") {
        if (data.live_news.updated_at) liveNews.updatedAt = data.live_news.updated_at;
        if (Array.isArray(data.live_news.sector) && data.live_news.sector.length > 0) {
          liveNews.sector = data.live_news.sector;
        }
        if (data.live_news.stocks && typeof data.live_news.stocks === "object") {
          Object.entries(data.live_news.stocks).forEach(([sym, arr]) => {
            if (Array.isArray(arr) && arr.length > 0) {
              liveNews.stocks[sym] = arr;
            }
          });
        }
      }

      recomputeAllDynamicMetrics();
    }

    function getRealtimeMarketStatusText() {
      const now = new Date();
      const wd = now.getDay();
      const hm = now.getHours() * 60 + now.getMinutes();
      const daysKr = ["일", "월", "화", "수", "목", "금", "토"];
      const wdKr = daysKr[wd];
      if (wd === 0 || wd === 6) return `주말(${wdKr}) · 직전 종가 반영`;
      if (hm >= 9 * 60 && hm < 15 * 60 + 30) return `평일(${wdKr}) 정규장 실시간`;
      return `평일(${wdKr}) 글로벌 시세 연동`;
    }

    function formatNowKstShort() {
      const now = new Date();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      return `${m}/${d} ${hh}:${mm}:${ss}`;
    }

    function updateLiveClock() {
      const tEl = document.getElementById("liveTimeText");
      if (tEl) {
        tEl.innerHTML = `<span style="color:var(--safe-green); font-weight:700;">LIVE</span> <span class="num">${formatNowKstShort()}</span> · ${getRealtimeMarketStatusText()}`;
      }
      const cdEl = document.getElementById("nextRefreshCountdown");
      if (cdEl) {
        countdownSec = countdownSec > 1 ? countdownSec - 1 : 30;
        cdEl.textContent = `${countdownSec}초 후 갱신`;
      }
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 3500) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: ctrl.signal });
      } finally {
        clearTimeout(id);
      }
    }

    async function fetchDirectBrowserYahooQuotes() {
      const syms = [
        "005935.KS", "005930.KS", "353200.KS", "240810.KQ", "AMD", "CLS",
        "^KS11", "^SOX", "^VIX", "NVDA", "^TNX", "CL=F", "KRW=X", "TLT"
      ];
      const mapSym = {
        "005935.KS": "stock_005935",
        "005930.KS": "stock_005930",
        "353200.KS": "stock_353200",
        "240810.KQ": "stock_240810",
        "AMD": "stock_AMD",
        "CLS": "stock_CLS"
      };
      let updatedCount = 0;

      await Promise.all(syms.map(async (sym) => {
        const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=10d&_=${Date.now()}`;
        const proxyUrls = [
          `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
          `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
          `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
        ];
        for (const pUrl of proxyUrls) {
          try {
            const r = await fetchWithTimeout(pUrl, { cache: "no-store" }, 3500);
            if (!r.ok) continue;
            const j = await r.json();
            const res = j?.chart?.result?.[0];
            if (!res) continue;
            const meta = res.meta || {};
            const tsList = res.timestamp || [];
            const closesRaw = res.indicators?.quote?.[0]?.close || [];
            const isKrw = sym.endsWith(".KS") || sym.endsWith(".KQ");

            const pairs = [];
            for (let i = 0; i < tsList.length; i++) {
              const c = closesRaw[i];
              if (typeof c === "number" && c > 0) {
                const dt = new Date((tsList[i] + 9 * 3600) * 1000);
                pairs.push([`${dt.getUTCMonth() + 1}/${dt.getUTCDate()}`, isKrw ? Math.round(c) : Number(c.toFixed(2))]);
              }
            }
            const p = typeof meta.regularMarketPrice === "number"
              ? (isKrw ? Math.round(meta.regularMarketPrice) : Number(meta.regularMarketPrice.toFixed(2)))
              : (pairs.length ? pairs[pairs.length - 1][1] : null);
            if (!p) continue;

            if (pairs.length) pairs[pairs.length - 1][1] = p;
            const recent = pairs.slice(-5);
            const rDates = recent.map(x => x[0]);
            const rCloses = recent.map(x => x[1]);
            const prev = rCloses.length >= 2 ? rCloses[rCloses.length - 2] : (meta.chartPreviousClose || p);
            const chgPct = prev ? Number((((p - prev) / prev) * 100).toFixed(2)) : 0;
            const wkBase = rCloses.length ? rCloses[0] : prev;
            const wkPct = wkBase ? Number((((p - wkBase) / wkBase) * 100).toFixed(2)) : 0;

            if (mapSym[sym]) {
              applyRichStockDetail(mapSym[sym], {
                price: p,
                prev_close: prev,
                change_pct: chgPct,
                week_change_pct: wkPct,
                high52w: meta.fiftyTwoWeekHigh,
                low52w: meta.fiftyTwoWeekLow,
                recent_dates: rDates,
                recent_closes: rCloses
              });
              updatedCount++;
            } else if (sym === "^KS11") {
              liveMacro.kospi = Number(p.toFixed(2));
              liveMacro.kospiChg = chgPct;
              updatedCount++;
            } else if (sym === "^SOX") {
              liveMacro.sox = Number(p.toFixed(2));
              liveMacro.soxChg = chgPct;
              updatedCount++;
            } else if (sym === "^VIX") {
              liveMacro.vix = Number(p.toFixed(2));
              liveMacro.vixChg = chgPct;
              updatedCount++;
            } else if (sym === "NVDA") {
              liveMacro.nvda = Number(p.toFixed(2));
              liveMacro.nvdaChg = chgPct;
              updatedCount++;
            } else if (sym === "^TNX") {
              liveMacro.us10y = Number(p.toFixed(2));
              liveMacro.us10yChg = chgPct;
              if (rCloses.length >= 4) liveMacro.us10yRecent = rCloses;
              if (rDates.length >= 4) liveMacro.us10yDates = rDates;
              updatedCount++;
            } else if (sym === "CL=F") {
              liveMacro.wtiOil = Number(p.toFixed(2));
              liveMacro.wtiChg = chgPct;
              updatedCount++;
            } else if (sym === "KRW=X") {
              liveMacro.usdkrw = Number(p.toFixed(1));
              liveMacro.usdkrwChg = chgPct;
              updatedCount++;
            } else if (sym === "TLT") {
              liveMacro.tlt = Number(p.toFixed(2));
              liveMacro.tltChg = chgPct;
              updatedCount++;
            }
            break;
          } catch (_) {}
        }
      }));
      return updatedCount;
    }

    async function refreshLivePrices(manual = false) {
      const btn = document.getElementById("refreshBtn");
      const badgeEl = document.getElementById("syncSourceBadge");
      if (btn && manual) {
        btn.textContent = "갱신중";
        btn.disabled = true;
      }

      countdownSec = 30;
      let payload = null;

      const urlsToTry = [
        `data/latest_briefing.json?t=${Date.now()}`,
        `https://raw.githubusercontent.com/dnrzoqs-byte/memory-briefing/main/data/latest_briefing.json?t=${Date.now()}`,
        `https://cdn.jsdelivr.net/gh/dnrzoqs-byte/memory-briefing@main/data/latest_briefing.json?t=${Date.now()}`
      ];
      if (!location.hostname.endsWith("github.io")) {
        urlsToTry.unshift(`/api/briefing?t=${Date.now()}`);
      }

      for (const u of urlsToTry) {
        try {
          const r = await fetchWithTimeout(u, { cache: "no-store" }, 2800);
          if (r.ok) {
            const candidate = await r.json();
            if (candidate && (candidate.stocks || candidate.dram || candidate.dram_spot)) {
              payload = candidate;
              break;
            }
          }
        } catch (_) {}
      }

      if (payload) applyLivePayload(payload);

      let directCount = 0;
      if (manual) {
        try {
          directCount = await fetchDirectBrowserYahooQuotes();
        } catch (_) {}
      }

      recomputeAllDynamicMetrics();
      const container = document.getElementById("viewContainer");
      if (currentView === "dram") container.innerHTML = renderDramView();
      else if (currentView === "rates") container.innerHTML = renderRatesView();
      else if (currentView === "overview5") container.innerHTML = renderOverview5View();
      else if (currentView === "factcheck") container.innerHTML = renderFactCheckView();
      updateLiveClock();

      const stampEl = document.getElementById("lastDataStamp");
      const curTime = formatNowKstShort();
      if (stampEl) stampEl.textContent = `${curTime} 동기화`;

      if (badgeEl) {
        badgeEl.textContent = directCount > 0 ? `직결 (${directCount}개)` : "Claude Opus 심층분석";
      }

      if (manual) {
        showToast(`최신 데이터 동기화 완료 (${curTime})`);
      }

      if (btn && manual) {
        btn.textContent = "완료";
        btn.disabled = false;
        setTimeout(() => { btn.textContent = "시세 갱신"; }, 1200);
      }
    }

    (function initImmediate() {
      if (window.__INITIAL_BRIEFING_PAYLOAD__) {
        applyLivePayload(window.__INITIAL_BRIEFING_PAYLOAD__);
      }
      recomputeAllDynamicMetrics();
      const params = new URLSearchParams(window.location.search);
      switchView(params.get("view") || "dram", false);
      updateLiveClock();
      setInterval(updateLiveClock, 1000);
      setTimeout(() => { refreshLivePrices(false); }, 50);
      setInterval(() => {
        if (!document.hidden) refreshLivePrices(false);
      }, 30000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshLivePrices(false);
      });
    })();
  </script>
