<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>반도체 퀀트 승률 &amp; 사이클 판독기 v8.0</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <style>
    :root {
      --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      --bg-page: #F2F4F8;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --bg-elevated: #F1F5F9;
      --bg-accent: #EFF6FF;
      --text-primary: #111827;
      --text-secondary: #374151;
      --text-muted: #6B7280;
      --border-color: #E5E7EB;
      --border-subtle: #F1F5F9;
      --up-red: #E11D48;
      --up-red-soft: rgba(225, 29, 72, 0.10);
      --down-blue: #2563EB;
      --down-blue-soft: rgba(37, 99, 235, 0.10);
      --safe-green: #059669;
      --safe-green-soft: rgba(5, 150, 105, 0.11);
      --warn-amber: #D97706;
      --warn-amber-soft: rgba(217, 119, 6, 0.12);
      --purple-accent: #7C3AED;
      --purple-soft: rgba(124, 58, 237, 0.10);
      --shadow-bento: 0 2px 12px -2px rgba(17, 24, 39, 0.06), 0 1px 3px -1px rgba(17, 24, 39, 0.04);
    }

    html.dark {
      --bg-page: #0B0F17;
      --bg-surface: #131B2E;
      --bg-subtle: #1A243B;
      --bg-elevated: #222F4C;
      --bg-accent: #172554;
      --text-primary: #F9FAFB;
      --text-secondary: #D1D5DB;
      --text-muted: #9CA3AF;
      --border-color: #23304A;
      --border-subtle: #1C273E;
      --up-red: #FB7185;
      --up-red-soft: rgba(251, 113, 133, 0.16);
      --down-blue: #60A5FA;
      --down-blue-soft: rgba(96, 165, 250, 0.16);
      --safe-green: #34D399;
      --safe-green-soft: rgba(52, 211, 153, 0.16);
      --warn-amber: #FBBF24;
      --warn-amber-soft: rgba(251, 191, 36, 0.16);
      --purple-accent: #A78BFA;
      --purple-soft: rgba(167, 139, 250, 0.16);
      --shadow-bento: 0 4px 20px -2px rgba(0, 0, 0, 0.50);
    }

    *, *::before, *::after, html, body, button, input, select, textarea, table, th, td, svg, text {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans) !important;
      letter-spacing: -0.028em;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.38;
    }

    .tnum {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .app-shell {
      max-width: 580px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 76px;
    }

    /* 상단 헤더 */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
    }

    html.dark .app-header {
      background-color: rgba(19, 27, 46, 0.93);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 6px;
      gap: 8px;
    }

    .header-eyebrow {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--safe-green);
      box-shadow: 0 0 0 3px var(--safe-green-soft);
      display: inline-block;
    }

    .header-title {
      font-size: 16px;
      font-weight: 850;
      color: var(--text-primary);
      margin-top: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-refresh {
      appearance: none;
      border: 1px solid var(--down-blue);
      background-color: var(--down-blue);
      color: #FFFFFF;
      font-size: 11.5px;
      font-weight: 800;
      padding: 6px 11px;
      border-radius: 9px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }

    .btn-dark {
      appearance: none;
      border: 1px solid var(--border-color);
      background-color: var(--bg-subtle);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 9px;
      border-radius: 9px;
      cursor: pointer;
    }

    .sync-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 14px 5px;
      background-color: var(--bg-subtle);
      border-top: 1px solid var(--border-subtle);
      font-size: 10px;
      color: var(--text-secondary);
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      padding: 1.5px 6px;
      border-radius: 5px;
      font-weight: 800;
      font-size: 9.5px;
      background-color: var(--safe-green-soft);
      color: var(--safe-green);
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-surface);
    }

    .nav-tab {
      appearance: none;
      border: none;
      background: transparent;
      padding: 8px 2px 7px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2.5px solid transparent;
      text-align: center;
      white-space: nowrap;
    }

    .nav-tab.active {
      color: var(--down-blue);
      border-bottom-color: var(--down-blue);
      font-weight: 850;
      background-color: var(--bg-subtle);
    }

    /* 하단 고정 독 */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 580px;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1.5px solid var(--border-color);
      box-shadow: 0 -4px 18px rgba(15, 23, 42, 0.08);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 60;
      padding: 4px 8px calc(4px + env(safe-area-inset-bottom, 0px));
    }

    html.dark .bottom-dock {
      background-color: rgba(19, 27, 46, 0.95);
    }

    .dock-btn {
      appearance: none;
      border: none;
      background: transparent;
      padding: 5px 2px;
      border-radius: 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .dock-btn.active {
      color: var(--down-blue);
      background-color: var(--down-blue-soft);
      font-weight: 850;
    }

    .dock-icon { font-size: 15px; line-height: 1; }
    .dock-label { font-size: 10px; font-weight: 800; }

    .view-body {
      flex: 1;
      padding: 10px 11px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @keyframes tickFlash {
      0% { box-shadow: 0 0 0 2px var(--down-blue); }
      100% { box-shadow: var(--shadow-bento); }
    }

    .card-refreshed {
      animation: tickFlash 0.6s ease-out;
    }

    .bento-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 13px;
      box-shadow: var(--shadow-bento);
    }

    .regime-gate-bar {
      border-radius: 12px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 850;
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 850;
      padding: 2.5px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 14.5px;
      font-weight: 850;
      color: var(--text-primary);
      line-height: 1.3;
    }

    /* 2x3 벤토 모니터링 타일 (줄글 제로, 숫자 최우선) */
    .bento-monitor-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin: 8px 0;
    }

    .bm-tile {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 11px;
      padding: 8px 9px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .bm-tile.alert-red {
      background-color: var(--up-red-soft);
      border-color: rgba(225, 29, 72, 0.28);
    }

    .bm-tile.alert-green {
      background-color: var(--safe-green-soft);
      border-color: rgba(5, 150, 105, 0.28);
    }

    .bm-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      font-weight: 800;
      color: var(--text-muted);
    }

    .bm-val {
      font-size: 14.5px;
      font-weight: 900;
      color: var(--text-primary);
    }

    .bm-sub {
      font-size: 9.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 3줄 요약 필 (단문 칩) */
    .short-pill-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
    }

    .sp-row {
      display: flex;
      align-items: center;
      gap: 7px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 6.5px 9px;
      font-size: 11.5px;
      font-weight: 750;
    }

    .sp-tag {
      flex-shrink: 0;
      font-size: 9.5px;
      font-weight: 850;
      padding: 2px 6px;
      border-radius: 5px;
      min-width: 60px;
      text-align: center;
    }

    /* =========================================================
       NEW [Claude Code 설계 1]: 토스식 승률 바 & 분할매수 랭킹 테이블
       ========================================================= */
    .winrate-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .winrate-table th {
      text-align: left;
      padding: 6px 4px;
      font-size: 9.5px;
      font-weight: 800;
      color: var(--text-muted);
      border-bottom: 1.5px solid var(--border-color);
      background-color: var(--bg-subtle);
    }

    .winrate-table td {
      padding: 8px 4px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }

    .wr-row {
      cursor: pointer;
    }

    .wr-row:hover {
      background-color: var(--bg-accent);
    }

    .wr-bar-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .wr-track {
      width: 52px;
      height: 7px;
      background-color: var(--bg-elevated);
      border-radius: 99px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .wr-fill {
      height: 100%;
      border-radius: 99px;
    }

    .dots-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 850;
      padding: 2px 6px;
      border-radius: 5px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
    }

    /* =========================================================
       NEW [Claude Code 설계 2]: 3단계 분할매수 타임라인 스텝퍼
       ========================================================= */
    .split-stepper-box {
      background-color: var(--bg-subtle);
      border: 1.5px solid var(--border-color);
      border-radius: 13px;
      padding: 11px 12px;
      margin-bottom: 10px;
    }

    .ss-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
    }

    .ss-steps {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .ss-step-row {
      display: grid;
      grid-template-columns: 74px 86px 1fr;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-radius: 9px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      font-size: 11px;
    }

    .ss-step-row.active-step {
      border: 1.5px solid var(--safe-green);
      background-color: var(--safe-green-soft);
    }

    .ss-footer {
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px dashed var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 850;
    }

    /* =========================================================
       NEW: 슈퍼사이클·전고점 4대 질문 팩트 판독 카드 (줄글 제로·비교표)
       ========================================================= */
    .truth-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      box-shadow: var(--shadow-bento);
    }

    .truth-q {
      font-size: 13.5px;
      font-weight: 850;
      color: var(--text-primary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .truth-verdict-bar {
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 850;
      margin-bottom: 7px;
    }

    .truth-vs-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .truth-col {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 8px 9px;
      font-size: 10.5px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .truth-col-title {
      font-size: 10.5px;
      font-weight: 850;
      margin-bottom: 2px;
    }

    .truth-bullet {
      font-weight: 700;
      color: var(--text-secondary);
      line-height: 1.32;
    }

    /* 서브 탭 & 공통 요소 */
    .seg-grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
      background-color: var(--bg-subtle);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 9px;
    }

    .seg-grid-3x2 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      background-color: var(--bg-subtle);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 9px;
    }

    .seg-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      padding: 7px 4px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-align: center;
      cursor: pointer;
    }

    .seg-btn.active {
      background-color: var(--bg-surface);
      color: var(--down-blue);
      border-color: var(--down-blue);
      font-weight: 850;
    }

    .action-pill {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 850;
      padding: 2px 7px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .stock-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
    }

    .stock-name { font-size: 16px; font-weight: 850; }
    .stock-code { font-size: 10.5px; font-weight: 600; color: var(--text-muted); margin-left: 4px; }
    .stock-curr-wrap { text-align: right; }
    .stock-curr { font-size: 18.5px; font-weight: 900; line-height: 1.1; }
    .stock-chg-row { display: flex; justify-content: flex-end; gap: 4px; margin-top: 3px; }
    .chg-pill { padding: 1.5px 6px; border-radius: 4px; font-size: 9.5px; font-weight: 850; }
    .chg-up { background-color: var(--up-red-soft); color: var(--up-red); }
    .chg-down { background-color: var(--down-blue-soft); color: var(--down-blue); }

    .target-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 9px;
    }

    .target-cell {
      border-radius: 10px;
      padding: 7px 6px;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-subtle);
      text-align: center;
    }

    .target-cell.floor { background-color: var(--safe-green-soft); border-color: rgba(16, 185, 129, 0.3); }
    .target-cell.t1 { background-color: var(--down-blue-soft); border-color: rgba(37, 99, 235, 0.3); }
    .target-cell.t2 { background-color: var(--up-red-soft); border-color: rgba(225, 29, 72, 0.3); }
    .tc-label { font-size: 9.5px; font-weight: 800; margin-bottom: 2px; }
    .tc-val { font-size: 12.5px; font-weight: 900; }
    .tc-upside { font-size: 9px; font-weight: 800; margin-top: 2px; }

    .chart-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 11px;
      padding: 8px 6px 4px;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .svg-chart { width: 100%; height: auto; display: block; }

    .kpi-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 9px;
    }

    .kpi-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .kpi-label { font-size: 10px; font-weight: 700; color: var(--text-muted); margin-bottom: 2px; }
    .kpi-val { font-size: 14.5px; font-weight: 900; }
    .kpi-sub { font-size: 10px; font-weight: 700; margin-top: 2px; color: var(--text-secondary); }

    .tab-footer-nav {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 8px;
      margin-top: 4px;
    }

    .footer-nav-btn {
      appearance: none;
      border: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 850;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-bento);
    }

    .footer-nav-btn.primary {
      background-color: var(--down-blue);
      border-color: var(--down-blue);
      color: #FFFFFF;
    }

    .live-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: rgba(17, 24, 39, 0.95);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
      white-space: nowrap;
    }

    .live-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-top">
        <div>
          <div class="header-eyebrow">
            <span id="liveDot" class="live-dot"></span>
            <span id="liveTimeText" class="tnum">실시간 연결중...</span>
          </div>
          <h1 id="headerTitle" class="header-title">🧠 시황·고승률 분할매수 판독기</h1>
        </div>
        <div class="header-actions">
          <button id="refreshBtn" class="btn-refresh" onclick="refreshLivePrices(true)">🔄 실시간 갱신</button>
          <button id="darkBtn" class="btn-dark" onclick="toggleDark()">다크</button>
        </div>
      </div>

    function recomputeAllDynamicMetrics() {
      const sPref = stockData.stock_005935;

      const recCashWeight = 100 - recStockWeight;

      const discPct = ((1 - sPref.rawCurr / sMain.rawCurr) * 100).toFixed(1);
      const preTaxYield = ((18404 / sPref.rawCurr) * 100).toFixed(1);
      const clsFwdPer = (sCls.rawCurr / 21.5).toFixed(1);
      const ddPer = (sDaeduck.rawCurr / 10800).toFixed(1);

      // 시황 공통 계수 M (VIX > 30 과매도 + 미 금리 5% 하회 시 반등 편향 +0.25)
      const mFactor = (liveMacro.vix >= 28 && liveMacro.us10y < 5.0) ? 0.25 : 0.15;

      allStocks.forEach(st => {
        const isKrw = st.unit === "만";
        if (isKrw) {
          st.curr = +(st.rawCurr / 10000).toFixed(2);
          st.currLabel = Math.round(st.rawCurr).toLocaleString() + "원";
          st.high52wLabel = Math.round(st.high52w * 10000).toLocaleString() + "원";
        } else {
          st.curr = +st.rawCurr.toFixed(2);
          st.currLabel = "$" + st.rawCurr.toFixed(2);
          st.high52wLabel = "$" + st.high52w.toFixed(2);
        }

        const dd = ((st.curr - st.high52w) / st.high52w) * 100;
        st.drawdown = (dd >= 0 ? "+" : "") + dd.toFixed(1) + "%";

        const u1 = ((st.target1 - st.curr) / st.curr) * 100;
        const u2 = ((st.target2 - st.curr) / st.curr) * 100;
        st.upside1 = (u1 >= 0 ? "+" : "") + u1.toFixed(1) + "%";
        st.upside2 = (u2 >= 0 ? "+" : "") + u2.toFixed(1) + "%";

        // 기술적 과매도 계수 T (낙폭 및 일간 급락 기반)
        const tFactor = Math.min(0.55, Math.max(0.1, (Math.abs(dd) / 120) + (st.changePct <= -6 ? 0.15 : 0)));
        // 수급 계수 F
        const fFactor = isSidecarCrash ? -0.05 : 0.1;

        // Claude Code 공식: WinProb(%) = clamp(50 + 25*M + 20*S + 30*T + 15*V + 10*F, 5, 95)
        const rawWinProb = 50 + 25 * mFactor + 20 * st.sScore + 30 * tFactor + 15 * st.vScore + 10 * fFactor;
        st.winProb = Math.round(Math.min(94, Math.max(45, rawWinProb)));

        // 3단계 분할매수 타점 공식 (P1 = 현재가, P2 = P1*(1-β), P3 = P1*(1-2β))
        const beta = st.betaBand || 0.05;
        const p1Raw = st.rawCurr;
        const p2Raw = isKrw ? Math.round((p1Raw * (1 - beta)) / 100) * 100 : +(p1Raw * (1 - beta)).toFixed(2);
        const p3Raw = isKrw ? Math.round((p1Raw * (1 - 2 * beta)) / 100) * 100 : +(p1Raw * (1 - 2 * beta)).toFixed(2);
        const avgCostRaw = isKrw
          ? Math.round((0.3 * p1Raw + 0.4 * p2Raw + 0.3 * p3Raw) / 100) * 100
          : +(0.3 * p1Raw + 0.4 * p2Raw + 0.3 * p3Raw).toFixed(2);

        const fmtP = (v) => isKrw ? v.toLocaleString() + "원" : "$" + v.toFixed(2);
        const fmtShort = (v) => isKrw ? (v / 10000).toFixed(2) + "만" : "$" + v.toFixed(0);

        const avgCostUnit = isKrw ? (avgCostRaw / 10000) : avgCostRaw;
        const expectedReturnT1 = +(((st.target1 - avgCostUnit) / avgCostUnit) * 100).toFixed(1);

        st.splitPlan = {
          betaPct: Math.round(beta * 100),
          p1Label: fmtP(p1Raw),
          p2Label: fmtP(p2Raw),
          p3Label: fmtP(p3Raw),
          p1Short: fmtShort(p1Raw),
          p2Short: fmtShort(p2Raw),
          p3Short: fmtShort(p3Raw),
          avgCostLabel: fmtP(avgCostRaw),
          avgCostShort: fmtShort(avgCostRaw),
          expectedReturnT1: `+${expectedReturnT1}%`,
          stageDot: st.winProb >= 80 ? "●○○ 1차 30% 집행" : "●○○ 1차 정찰진입",
          badgeText: st.winProb >= 84 ? "🟢 강력추천" : (st.winProb >= 78 ? "🟢 분할적립" : "🟡 소액분할"),
          badgeTone: st.winProb >= 78 ? "green" : "amber"
        };

        // 차트 시계열 업데이트
        if (Array.isArray(st.recentClosesRaw) && st.recentClosesRaw.length >= 4) {
          const rc = st.recentClosesRaw;
          const rd = st.recentDates || [];
          const toUnit = (v) => isKrw ? +(v / 10000).toFixed(2) : +Number(v).toFixed(2);
          st.history = [
            st.high52w,
            toUnit(rc[0]),
            toUnit(rc[Math.floor(rc.length / 2)]),
            toUnit(rc[rc.length - 2]),
            st.curr,
            st.target1,
            st.target2
          ];
          st.histLabels = ["52주최고", rd[0] || "D-4", rd[Math.floor(rd.length / 2)] || "D-2", rd[rd.length - 2] || "전일", "현재", "1차적정", "2차익절"];
        }
      });

      // 종목별 1줄 핵심 태그 (줄글 제로!)
      sPref.oneLineMetric = `본주대비 ${discPct}% 할인 · 세전 배당 연 ${preTaxYield}% · PBR 바닥`;
      sMain.oneLineMetric = `10년 최저 PBR 1.00배(18만선) 도달 · 3Q 영업익 107.4조`;
      sWonik.oneLineMetric = `3Q 영업익 667억(+142%↑) vs 고점대비 ${sWonik.drawdown} 과매도`;

      sAmd.oneLineMetric = `빅테크 탈엔비디아(MI450·Helios) 수혜 · 단기 수출통제 노이즈`;

      quantRegime = {

        discPct,

      };

    // =========================================================================
    // 3. 차트 렌더러 & 하단 스텝퍼
    // =========================================================================
    function renderLineSvg(pts, labels, forecastStartIdx, unitPrefix = "$", unitSuffix = "") {
      const w = 440, h = 140, padX = 34, topY = 22, botY = 108;
      const minV = Math.min(...pts) * 0.91;
      const maxV = Math.max(...pts) * 1.07;
      const range = maxV - minV || 1;
      const stepX = (w - padX * 2) / (pts.length - 1);

      const coords = pts.map((v, i) => ({
        x: padX + i * stepX,
        y: botY - ((v - minV) / range) * (botY - topY),
        v,
        label: labels[i] || ""
      }));

      const solidPts = coords.slice(0, forecastStartIdx + 1).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const dashPts = coords.slice(forecastStartIdx).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const areaPts = `${coords[0].x.toFixed(1)},${botY} ` + coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ") + ` ${coords[coords.length - 1].x.toFixed(1)},${botY}`;

      let nodesHtml = "";
      coords.forEach((c, idx) => {
        const isForecast = idx > forecastStartIdx;
        const isCurrent = idx === forecastStartIdx;
        const dotColor = isCurrent ? "var(--up-red)" : (isForecast ? "var(--safe-green)" : "var(--down-blue)");
        const r = isCurrent ? 5 : 3.8;
        const valStr = `${unitPrefix}${Number.isInteger(c.v) ? c.v : c.v.toFixed(2)}${unitSuffix}`;
        const yOffset = idx % 2 === 0 ? -9 : -11;

        nodesHtml += `
          <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${r}" fill="${dotColor}" stroke="var(--bg-surface)" stroke-width="1.6" />
          <text x="${c.x.toFixed(1)}" y="${(c.y + yOffset).toFixed(1)}" text-anchor="middle" font-size="${isCurrent ? '10.5' : '9.5'}" font-weight="800" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-primary)'}">${valStr}</text>
          <text x="${c.x.toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="9.5" font-weight="${isCurrent ? '800' : '600'}" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-muted)'}">${c.label}</text>
        `;
      });

      return `
        <svg viewBox="0 0 ${w} ${h}" class="svg-chart">
          <defs>
            <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">

        if (typeof detail.change_pct === "number") item.changePct = detail.change_pct;
        if (typeof detail.week_change_pct === "number") item.weekChangePct = detail.week_change_pct;
        if (typeof detail.high52w === "number" && detail.high52w > 0) {
          item.high52w = item.unit === "만" ? +(detail.high52w / 10000).toFixed(2) : +detail.high52w.toFixed(2);
        }
        if (typeof detail.low52w === "number" && detail.low52w > 0) {
          item.low52w = item.unit === "만" ? +(detail.low52w / 10000).toFixed(2) : +detail.low52w.toFixed(2);
        }
        if (Array.isArray(detail.recent_closes) && detail.recent_closes.length >= 4) {
          item.recentClosesRaw = detail.recent_closes;
        }
        if (Array.isArray(detail.recent_dates) && detail.recent_dates.length >= 4) {
          item.recentDates = detail.recent_dates;
        }
      } else {
        if (typeof rawPriceFallback === "number" && rawPriceFallback > 0) {
          item.rawCurr = rawPriceFallback;
        }
        if (typeof rawHighFallback === "number" && rawHighFallback > 0) {
          item.high52w = item.unit === "만" ? +(rawHighFallback / 10000).toFixed(2) : +rawHighFallback.toFixed(2);
        }
      }
    }

    function applyLivePayload(data) {
      if (!data || typeof data !== "object") return;

      const sp = data.dram || data.dram_spot;
      if (sp) {
        const keyMap = {
          ddr5_16g: sp.ddr5_16g,
          ddr4_16g: sp.ddr4_16g,
          ddr4_8g: sp.ddr4_8g,
          ddr5_mod: sp.ddr5_mod || sp.ddr5_16gb_module
        };
        Object.entries(keyMap).forEach(([k, item]) => {
          if (item && item.price) {
            const p = Number(Number(item.price).toFixed(2));
            dramSeries[k].price = p;
            dramSeries[k].pts[4] = p;
            if (item.change) dramSeries[k].change = item.change;
          }
        });
      }

      const mc = data.macro || {};
      if (mc.kospi) liveMacro.kospi = Number(mc.kospi);
      if (mc.kospi_change_pct !== undefined) liveMacro.kospiChg = Number(mc.kospi_change_pct);
      if (mc.kosdaq) liveMacro.kosdaq = Number(mc.kosdaq);
      if (mc.sox) liveMacro.sox = Number(mc.sox);
      if (mc.sox_change_pct !== undefined) liveMacro.soxChg = Number(mc.sox_change_pct);
      if (mc.nasdaq) liveMacro.nasdaq = Number(mc.nasdaq);
      if (mc.nasdaq_change_pct !== undefined) liveMacro.nasdaqChg = Number(mc.nasdaq_change_pct);
      if (mc.vix) liveMacro.vix = Number(mc.vix);
      if (mc.vix_change_pct !== undefined) liveMacro.vixChg = Number(mc.vix_change_pct);
      if (mc.us10y || data.us10y) liveMacro.us10y = Number(mc.us10y || data.us10y);
      if (mc.us10y_change_pct !== undefined) liveMacro.us10yChg = Number(mc.us10y_change_pct);
      if (Array.isArray(mc.us10y_recent) && mc.us10y_recent.length >= 4) liveMacro.us10yRecent = mc.us10y_recent;
      if (Array.isArray(mc.us10y_dates) && mc.us10y_dates.length >= 4) liveMacro.us10yDates = mc.us10y_dates;
      if (mc.tlt_price || data.tlt_price) liveMacro.tlt = Number(mc.tlt_price || data.tlt_price);
      if (mc.wti_oil || data.wti_oil) liveMacro.wtiOil = Number(mc.wti_oil || data.wti_oil);
      if (mc.usdkrw || data.usdkrw) liveMacro.usdkrw = Number(mc.usdkrw || data.usdkrw);

      const st = data.stocks || {};
      const h52 = data.high52w || {};
      const dt = data.stocks_detail || {};
      if (dt.NVDA && dt.NVDA.price) {
        liveMacro.nvda = Number(dt.NVDA.price);
        liveMacro.nvdaChg = Number(dt.NVDA.change_pct || 0);
      }

      const mapSym = {
        "005935.KS": "stock_005935",
        "005930.KS": "stock_005930",
        "353200.KS": "stock_353200",
        "240810.KQ": "stock_240810",
        "AMD": "stock_AMD",
        "CLS": "stock_CLS"
      };
      Object.entries(mapSym).forEach(([sym, sKey]) => {
        if (dt[sym] || st[sym]) {
          applyRichStockDetail(sKey, dt[sym], Number(st[sym]), Number(h52[sym]));
        }
      });

      if (data.live_news && typeof data.live_news === "object") {
        if (data.live_news.updated_at) liveNews.updatedAt = data.live_news.updated_at;
        if (Array.isArray(data.live_news.sector) && data.live_news.sector.length > 0) {
          liveNews.sector = data.live_news.sector;
        }
        if (data.live_news.stocks && typeof data.live_news.stocks === "object") {
          Object.entries(data.live_news.stocks).forEach(([sym, arr]) => {
            if (Array.isArray(arr) && arr.length > 0) {
              liveNews.stocks[sym] = arr;
            }
          });
        }
      }

      recomputeAllDynamicMetrics();
    }

    function getRealtimeMarketStatusText() {
      const now = new Date();
      const wd = now.getDay();
      const hm = now.getHours() * 60 + now.getMinutes();
      const daysKr = ["일", "월", "화", "수", "목", "금", "토"];
      const wdKr = daysKr[wd];
      if (wd === 0 || wd === 6) return `주말(${wdKr}) · 직전장 종가 & 실시간 뉴스`;
      if (hm >= 9 * 60 && hm < 15 * 60 + 30) return `평일(${wdKr}) 국내 정규장 실시간`;
      return `평일(${wdKr}) 글로벌 시세 실시간 연동`;
    }

    function formatNowKstFull() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      return `${y}.${m}.${d} ${hh}:${mm}:${ss}`;
    }

    function formatNowKstShort() {
      const now = new Date();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      return `${m}/${d} ${hh}:${mm}:${ss}`;
    }

    function updateLiveClock() {
      const tEl = document.getElementById("liveTimeText");
      if (tEl) {
        tEl.innerHTML = `<span style="color:var(--safe-green); font-weight:800;">LIVE</span> ${formatNowKstFull()} · ${getRealtimeMarketStatusText()}`;
      }
      const cdEl = document.getElementById("nextRefreshCountdown");
      if (cdEl) {
        countdownSec = countdownSec > 1 ? countdownSec - 1 : 30;
        cdEl.textContent = `자동갱신 ${countdownSec}초`;
      }
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 3500) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: ctrl.signal });
      } finally {
        clearTimeout(id);
      }
    }

    async function fetchDirectBrowserYahooQuotes() {
      const syms = [
        "005935.KS", "005930.KS", "353200.KS", "240810.KQ", "AMD", "CLS",
        "^KS11", "^SOX", "^VIX", "NVDA", "^TNX", "CL=F", "KRW=X", "TLT"
      ];
      const mapSym = {
        "005935.KS": "stock_005935",
        "005930.KS": "stock_005930",
        "353200.KS": "stock_353200",
        "240810.KQ": "stock_240810",
        "AMD": "stock_AMD",
        "CLS": "stock_CLS"
      };
      let updatedCount = 0;

      await Promise.all(syms.map(async (sym) => {
        const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=10d&_=${Date.now()}`;
        const proxyUrls = [
          `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
          `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
          `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
        ];
        for (const pUrl of proxyUrls) {
          try {
            const r = await fetchWithTimeout(pUrl, { cache: "no-store" }, 3500);
            if (!r.ok) continue;
            const j = await r.json();
            const res = j?.chart?.result?.[0];
            if (!res) continue;
            const meta = res.meta || {};
            const tsList = res.timestamp || [];
            const closesRaw = res.indicators?.quote?.[0]?.close || [];
            const isKrw = sym.endsWith(".KS") || sym.endsWith(".KQ");

            const pairs = [];
            for (let i = 0; i < tsList.length; i++) {
              const c = closesRaw[i];
              if (typeof c === "number" && c > 0) {
                const dt = new Date((tsList[i] + 9 * 3600) * 1000);
                pairs.push([`${dt.getUTCMonth() + 1}/${dt.getUTCDate()}`, isKrw ? Math.round(c) : Number(c.toFixed(2))]);
              }
            }
            const p = typeof meta.regularMarketPrice === "number"
              ? (isKrw ? Math.round(meta.regularMarketPrice) : Number(meta.regularMarketPrice.toFixed(2)))
              : (pairs.length ? pairs[pairs.length - 1][1] : null);
            if (!p) continue;

            if (pairs.length) pairs[pairs.length - 1][1] = p;
            const recent = pairs.slice(-5);
            const rDates = recent.map(x => x[0]);
            const rCloses = recent.map(x => x[1]);
            const prev = rCloses.length >= 2 ? rCloses[rCloses.length - 2] : (meta.chartPreviousClose || p);
            const chgPct = prev ? Number((((p - prev) / prev) * 100).toFixed(2)) : 0;
            const wkBase = rCloses.length ? rCloses[0] : prev;
            const wkPct = wkBase ? Number((((p - wkBase) / wkBase) * 100).toFixed(2)) : 0;

            if (mapSym[sym]) {
              applyRichStockDetail(mapSym[sym], {
                price: p,
                prev_close: prev,
                change_pct: chgPct,
                week_change_pct: wkPct,
                high52w: meta.fiftyTwoWeekHigh,
                low52w: meta.fiftyTwoWeekLow,
                recent_dates: rDates,
                recent_closes: rCloses
              });
              updatedCount++;
            } else if (sym === "^KS11") {
              liveMacro.kospi = Number(p.toFixed(2));
              liveMacro.kospiChg = chgPct;
              updatedCount++;
            } else if (sym === "^SOX") {
              liveMacro.sox = Number(p.toFixed(2));
              liveMacro.soxChg = chgPct;
              updatedCount++;
            } else if (sym === "^VIX") {
              liveMacro.vix = Number(p.toFixed(2));
              liveMacro.vixChg = chgPct;
              updatedCount++;
            } else if (sym === "NVDA") {
              liveMacro.nvda = Number(p.toFixed(2));
              liveMacro.nvdaChg = chgPct;
              updatedCount++;
            } else if (sym === "^TNX") {
              liveMacro.us10y = Number(p.toFixed(2));
              liveMacro.us10yChg = chgPct;
              if (rCloses.length >= 4) liveMacro.us10yRecent = rCloses;
              if (rDates.length >= 4) liveMacro.us10yDates = rDates;
              updatedCount++;
            } else if (sym === "CL=F") {
              liveMacro.wtiOil = Number(p.toFixed(2));
              liveMacro.wtiChg = chgPct;
              updatedCount++;
            } else if (sym === "KRW=X") {
              liveMacro.usdkrw = Number(p.toFixed(1));
              liveMacro.usdkrwChg = chgPct;
              updatedCount++;
            } else if (sym === "TLT") {
              liveMacro.tlt = Number(p.toFixed(2));
              liveMacro.tltChg = chgPct;
              updatedCount++;
            }
            break;
          } catch (_) {}
        }
      }));
      return updatedCount;
    }

    async function refreshLivePrices(manual = false) {
      const btn = document.getElementById("refreshBtn");
      const badgeEl = document.getElementById("syncSourceBadge");
      if (btn && manual) {
        btn.textContent = "⏳ 판독중";
        btn.disabled = true;
      }

      countdownSec = 30;
      let payload = null;

      const urlsToTry = [
        `data/latest_briefing.json?t=${Date.now()}`,
        `https://raw.githubusercontent.com/dnrzoqs-byte/memory-briefing/main/data/latest_briefing.json?t=${Date.now()}`,
        `https://cdn.jsdelivr.net/gh/dnrzoqs-byte/memory-briefing@main/data/latest_briefing.json?t=${Date.now()}`
      ];
      if (!location.hostname.endsWith("github.io")) {
        urlsToTry.unshift(`/api/briefing?t=${Date.now()}`);
      }

      for (const u of urlsToTry) {
        try {
          const r = await fetchWithTimeout(u, { cache: "no-store" }, 2800);
          if (r.ok) {
            const candidate = await r.json();
            if (candidate && (candidate.stocks || candidate.dram || candidate.dram_spot)) {
              payload = candidate;
              break;
            }
          }
        } catch (_) {}
      }

      if (payload) applyLivePayload(payload);

      let directCount = 0;
      if (manual) {
        try {
          directCount = await fetchDirectBrowserYahooQuotes();
        } catch (_) {}
      }

      recomputeAllDynamicMetrics();
      const container = document.getElementById("viewContainer");
      if (currentView === "dram") container.innerHTML = renderDramView();
      else if (currentView === "rates") container.innerHTML = renderRatesView();
      else if (currentView === "overview5") container.innerHTML = renderOverview5View();
      else if (currentView === "factcheck") container.innerHTML = renderFactCheckView();
      updateLiveClock();

      const stampEl = document.getElementById("lastDataStamp");
      const curTime = formatNowKstShort();
      if (stampEl) stampEl.textContent = `${curTime} 최신 판독 완료`;

      if (badgeEl) {
        badgeEl.textContent = directCount > 0 ? `🟢 거래소 직결 (${directCount}개)` : "🟢 Antigravity × Claude 퀀트엔진";
      }

      if (manual) {
        document.querySelectorAll(".bento-card, .truth-card, .regime-gate-bar").forEach(c => {
          c.classList.remove("card-refreshed");
          void c.offsetWidth;
          c.classList.add("card-refreshed");
        });
        showToast(`✅ [${curTime}] 삼전우 승률 ${stockData.stock_005935.winProb}% · 삼전 ${stockData.stock_005930.winProb}% · 원익 ${stockData.stock_240810.winProb}%`);
      }

      if (btn && manual) {
        btn.textContent = "✅ 완료";
        btn.disabled = false;
        setTimeout(() => { btn.textContent = "🔄 실시간 갱신"; }, 1200);
      }
    }

    (function initImmediate() {
      if (window.__INITIAL_BRIEFING_PAYLOAD__) {
        applyLivePayload(window.__INITIAL_BRIEFING_PAYLOAD__);
      }
      recomputeAllDynamicMetrics();
      const params = new URLSearchParams(window.location.search);
      switchView(params.get("view") || "dram", false);
      updateLiveClock();
      setInterval(updateLiveClock, 1000);
      setTimeout(() => { refreshLivePrices(false); }, 50);
      setInterval(() => {
        if (!document.hidden) refreshLivePrices(false);
      }, 30000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshLivePrices(false);
      });
    })();
  </script>
