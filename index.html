<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>반도체·6종목 인사이트 판독기 v5.0</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg-page: #F1F5F9;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --bg-accent: #EFF6FF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --border-subtle: #F1F5F9;
      --up-red: #DC2626;
      --up-red-soft: rgba(220, 38, 38, 0.10);
      --down-blue: #2563EB;
      --down-blue-soft: rgba(37, 99, 235, 0.10);
      --safe-green: #059669;
      --safe-green-soft: rgba(5, 150, 105, 0.11);
      --warn-amber: #D97706;
      --warn-amber-soft: rgba(217, 119, 6, 0.12);
      --purple-accent: #7C3AED;
      --purple-soft: rgba(124, 58, 237, 0.10);
      --shadow-card: 0 2px 10px -2px rgba(15, 23, 42, 0.06), 0 1px 3px -1px rgba(15, 23, 42, 0.04);
    }

    html.dark {
      --bg-page: #090D16;
      --bg-surface: #111827;
      --bg-subtle: #1E293B;
      --bg-accent: #172554;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --border-color: #1F2937;
      --border-subtle: #1E293B;
      --up-red: #F87171;
      --up-red-soft: rgba(248, 113, 113, 0.15);
      --down-blue: #60A5FA;
      --down-blue-soft: rgba(96, 165, 250, 0.15);
      --safe-green: #34D399;
      --safe-green-soft: rgba(52, 211, 153, 0.15);
      --warn-amber: #FBBF24;
      --warn-amber-soft: rgba(251, 191, 36, 0.15);
      --purple-accent: #A78BFA;
      --purple-soft: rgba(167, 139, 250, 0.15);
      --shadow-card: 0 4px 14px -2px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.42;
      -webkit-font-smoothing: antialiased;
    }

    .tnum {
      font-variant-numeric: tabular-nums;
    }

    .app-shell {
      max-width: 540px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 고정 헤더 & 네비게이션 */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px 7px;
      gap: 8px;
    }

    .header-title-wrap {
      min-width: 0;
      flex: 1;
    }

    .header-eyebrow {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--safe-green);
      box-shadow: 0 0 0 3px var(--safe-green-soft);
      display: inline-block;
      transition: transform 0.25s ease;
    }

    .header-title {
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .btn-refresh {
      appearance: none;
      border: 1px solid var(--down-blue);
      background-color: var(--down-blue);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 800;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }

    .btn-refresh:active {
      transform: scale(0.96);
    }

    .btn-refresh:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .btn-dark {
      appearance: none;
      border: 1px solid var(--border-color);
      background-color: var(--bg-subtle);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 9px;
      border-radius: 8px;
      cursor: pointer;
    }

    .sync-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 14px 6px;
      background-color: var(--bg-subtle);
      border-top: 1px solid var(--border-subtle);
      font-size: 10.5px;
      color: var(--text-secondary);
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 5px;
      font-weight: 800;
      font-size: 10px;
      background-color: var(--safe-green-soft);
      color: var(--safe-green);
    }

    /* 4대 메인 탭 */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-surface);
    }

    .nav-tab {
      appearance: none;
      border: none;
      background: transparent;
      padding: 9px 2px 8px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2.5px solid transparent;
      transition: all 0.15s ease;
      text-align: center;
      white-space: nowrap;
    }

    .nav-tab.active {
      color: var(--down-blue);
      border-bottom-color: var(--down-blue);
      font-weight: 800;
      background-color: var(--bg-subtle);
    }

    .view-body {
      flex: 1;
      padding: 10px 11px 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @keyframes cardFlash {
      0% { box-shadow: 0 0 0 2px var(--down-blue); }
      100% { box-shadow: var(--shadow-card); }
    }

    .card-refreshed {
      animation: cardFlash 0.8s ease-out;
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 13px;
      box-shadow: var(--shadow-card);
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    /* =========================================================
       NEW v5.0: 종합 인사이트 판독 히어로 카드 (Executive Verdict)
       ========================================================= */
    .verdict-hero {
      background: linear-gradient(145deg, var(--bg-surface) 0%, var(--bg-accent) 100%);
      border: 1.5px solid rgba(37, 99, 235, 0.32);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow-card);
    }

    .verdict-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .score-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: conic-gradient(var(--safe-green) 0% 78%, var(--border-color) 78% 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(5, 150, 105, 0.2);
    }

    .score-inner {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background-color: var(--bg-surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.05;
    }

    .score-num {
      font-size: 19px;
      font-weight: 900;
      color: var(--safe-green);
    }

    .score-unit {
      font-size: 9.5px;
      font-weight: 800;
      color: var(--text-muted);
    }

    .verdict-headline-box {
      flex: 1;
      min-width: 0;
    }

    .verdict-main-badge {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 99px;
      background-color: var(--safe-green);
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    .verdict-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .verdict-sub {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* 5대 요소 미니 바 그리드 */
    .factor-bars {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 11px;
      margin-bottom: 10px;
    }

    .factor-row {
      display: grid;
      grid-template-columns: 92px 1fr 118px;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }

    .factor-name {
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .factor-track {
      height: 7px;
      border-radius: 99px;
      background-color: var(--bg-subtle);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    .factor-fill {
      height: 100%;
      border-radius: 99px;
    }

    .factor-status {
      text-align: right;
      font-weight: 800;
      font-size: 10.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 3줄 핵심 결론 칩 */
    .verdict-3chips {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .v-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11.5px;
      color: var(--text-primary);
    }

    .v-chip-tag {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
    }

    /* 핵심 요약 카드 (컴팩트 그리드) */
    .compact-issue-grid {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .compact-issue {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 9px 11px;
    }

    .ci-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }

    .ci-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .ci-bullets {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .ci-pill {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    /* 서브 탭 그리드 */
    .seg-grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
      background-color: var(--bg-subtle);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .seg-grid-3x2 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      background-color: var(--bg-subtle);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .seg-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      padding: 7px 4px;
      border-radius: 7px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      text-align: center;
      cursor: pointer;
      line-height: 1.2;
    }

    .seg-btn.active {
      background-color: var(--bg-surface);
      color: var(--down-blue);
      border-color: var(--down-blue);
      font-weight: 800;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .kpi-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 10px;
    }

    .kpi-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 11px;
      padding: 9px 10px;
      min-width: 0;
    }

    .kpi-label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .kpi-val {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .kpi-sub {
      font-size: 10.5px;
      font-weight: 700;
      margin-top: 2px;
      color: var(--text-secondary);
    }

    .chart-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 11px;
      padding: 8px 6px 4px;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 4px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .svg-chart {
      width: 100%;
      height: auto;
      display: block;
    }

    .action-pill {
      display: inline-flex;
      align-items: center;
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      white-space: nowrap;
    }

    /* 6종목 스코어보드 테이블 */
    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
    }

    .matrix-table th {
      text-align: left;
      padding: 6px 5px;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      border-bottom: 1.5px solid var(--border-color);
      background-color: var(--bg-subtle);
    }

    .matrix-table td {
      padding: 7px 5px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }

    .matrix-row {
      cursor: pointer;
    }

    .matrix-row.selected-row {
      background-color: var(--bg-accent);
    }

    /* 종목 상세 헤더 */
    .stock-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
    }

    .stock-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .stock-code {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .stock-curr-wrap {
      text-align: right;
    }

    .stock-curr {
      font-size: 18.5px;
      font-weight: 900;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .stock-chg-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 3px;
    }

    .chg-pill {
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
    }

    .chg-up {
      background-color: var(--up-red-soft);
      color: var(--up-red);
    }

    .chg-down {
      background-color: var(--down-blue-soft);
      color: var(--down-blue);
    }

    /* 3대 핵심 요약 칩 (종목별 3초 스캔) */
    .stock-key-chips {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
      margin-bottom: 10px;
    }

    .sk-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 7px 9px;
      font-size: 11.5px;
    }

    .sk-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      min-width: 58px;
      text-align: center;
    }

    .band-gauge-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 9px;
    }

    .band-gauge-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .band-bar-track {
      height: 7px;
      border-radius: 999px;
      background: linear-gradient(90deg, #10B981 0%, #3B82F6 55%, #EF4444 100%);
      position: relative;
      margin: 4px 0;
    }

    .band-bar-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background-color: #FFFFFF;
      border: 3px solid var(--text-primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .target-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }

    .target-cell {
      border-radius: 10px;
      padding: 8px 8px;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-subtle);
      text-align: center;
    }

    .target-cell.floor {
      background-color: var(--safe-green-soft);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .target-cell.t1 {
      background-color: var(--down-blue-soft);
      border-color: rgba(37, 99, 235, 0.3);
    }

    .target-cell.t2 {
      background-color: var(--up-red-soft);
      border-color: rgba(220, 38, 38, 0.3);
    }

    .tc-label {
      font-size: 10px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .tc-val {
      font-size: 13px;
      font-weight: 900;
    }

    .tc-upside {
      font-size: 9.5px;
      font-weight: 800;
      margin-top: 2px;
    }

    /* 접이식 상세 근거 (아코디언) */
    details.deep-dive {
      margin-top: 8px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 7px 10px;
    }

    details.deep-dive summary {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-secondary);
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    details.deep-dive summary::-webkit-details-marker {
      display: none;
    }

    .deep-dive-body {
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px dashed var(--border-color);
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.48;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* 3탭 신호등 그리드 (2열 컴팩트 카드) */
    .signal-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .sig-card {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* D-Day 캘린더 컴팩트 */
    .dday-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .dday-card {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 9px 11px;
    }

    .dday-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }

    .dday-badge {
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .dday-badge.urgent {

    // =========================================================================
    // 3. 반응형 SVG 차트 렌더러
    // =========================================================================
    function renderLineSvg(pts, labels, forecastStartIdx, unitPrefix = "$", unitSuffix = "") {
      const w = 440, h = 148, padX = 34, topY = 24, botY = 114;
      const minV = Math.min(...pts) * 0.91;
      const maxV = Math.max(...pts) * 1.07;
      const range = maxV - minV || 1;
      const stepX = (w - padX * 2) / (pts.length - 1);

      const coords = pts.map((v, i) => ({
        x: padX + i * stepX,
        y: botY - ((v - minV) / range) * (botY - topY),
        v,
        label: labels[i] || ""
      }));

      const solidPts = coords.slice(0, forecastStartIdx + 1).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const dashPts = coords.slice(forecastStartIdx).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const areaPts = `${coords[0].x.toFixed(1)},${botY} ` + coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ") + ` ${coords[coords.length - 1].x.toFixed(1)},${botY}`;

      let nodesHtml = "";
      coords.forEach((c, idx) => {
        const isForecast = idx > forecastStartIdx;
        const isCurrent = idx === forecastStartIdx;
        const dotColor = isCurrent ? "var(--up-red)" : (isForecast ? "var(--safe-green)" : "var(--down-blue)");
        const r = isCurrent ? 5 : 3.8;
        const valStr = `${unitPrefix}${Number.isInteger(c.v) ? c.v : c.v.toFixed(2)}${unitSuffix}`;
        const yOffset = idx % 2 === 0 ? -9 : -11;

        nodesHtml += `
          <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${r}" fill="${dotColor}" stroke="var(--bg-surface)" stroke-width="1.6" />
          <text x="${c.x.toFixed(1)}" y="${(c.y + yOffset).toFixed(1)}" text-anchor="middle" font-size="${isCurrent ? '10.5' : '9.5'}" font-weight="800" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-primary)'}">${valStr}</text>
          <text x="${c.x.toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="9.5" font-weight="${isCurrent ? '800' : '600'}" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-muted)'}">${c.label}</text>
        `;
      });

      return `
        <svg viewBox="0 0 ${w} ${h}" class="svg-chart">
          <defs>
            <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--down-blue)" stop-opacity="0.16"/>
              <stop offset="100%" stop-color="var(--down-blue)" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <line x1="${padX}" y1="${topY}" x2="${w - padX}" y2="${topY}" stroke="var(--border-color)" stroke-dasharray="3 3" stroke-width="0.8" />
          <line x1="${padX}" y1="${(topY + botY) / 2}" x2="${w - padX}" y2="${(topY + botY) / 2}" stroke="var(--border-color)" stroke-dasharray="3 3" stroke-width="0.8" />
          <line x1="${padX}" y1="${botY}" x2="${w - padX}" y2="${botY}" stroke="var(--border-color)" stroke-width="1" />
          <polygon points="${areaPts}" fill="url(#chartGrad)" />
          <polyline fill="none" stroke="var(--down-blue)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="${solidPts}" />
          ${forecastStartIdx < coords.length - 1 ? `<polyline fill="none" stroke="var(--safe-green)" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" points="${dashPts}" />` : ""}
          ${nodesHtml}
        </svg>
      `;
    }

    function calcDDay(targetDateStr) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const parts = targetDateStr.split("-");
      const target = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      const diffDays = Math.round((target.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
      if (diffDays === 0) return { label: "D-DAY", urgentClass: "urgent" };
      if (diffDays > 0) return { label: `D-${diffDays}`, urgentClass: diffDays <= 7 ? "urgent" : "near" };
      return { label: `D+${Math.abs(diffDays)}`, urgentClass: "normal" };
    }

      const ratePts = Array.isArray(liveMacro.us10yRecent) && liveMacro.us10yRecent.length >= 4

        : ["11/9", "11/11", "11/12", "11/13", "현재", "다음주", "연말"];

      const w = 440, h = 148, padX = 34, topY = 24, botY = 114;
      const minV = 4.40, maxV = 5.45;
      const range = maxV - minV;
      const stepX = (w - padX * 2) / (ratePts.length - 1);

      const coords = ratePts.map((v, i) => ({
        x: padX + i * stepX,
        y: botY - ((v - minV) / range) * (botY - topY),
        v,
        label: rateDates[i]

      const threshY = botY - ((5.00 - minV) / range) * (botY - topY);
      const solidPts = coords.slice(0, 5).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");

    function applyRichStockDetail(stockKey, detail, rawPriceFallback, rawHighFallback) {
      const item = stockData[stockKey];

      if (detail && typeof detail === "object") {
        if (typeof detail.price === "number" && detail.price > 0) item.rawCurr = detail.price;
        if (typeof detail.change_pct === "number") item.changePct = detail.change_pct;
        if (typeof detail.week_change_pct === "number") item.weekChangePct = detail.week_change_pct;
        if (typeof detail.high52w === "number" && detail.high52w > 0) {
          item.high52w = item.unit === "만" ? +(detail.high52w / 10000).toFixed(2) : +detail.high52w.toFixed(2);
        }
        if (typeof detail.low52w === "number" && detail.low52w > 0) {
          item.low52w = item.unit === "만" ? +(detail.low52w / 10000).toFixed(2) : +detail.low52w.toFixed(2);
        }
        if (Array.isArray(detail.recent_closes) && detail.recent_closes.length >= 4) {
          item.recentClosesRaw = detail.recent_closes;
        }
        if (Array.isArray(detail.recent_dates) && detail.recent_dates.length >= 4) {
          item.recentDates = detail.recent_dates;
        }
      } else {
        if (typeof rawPriceFallback === "number" && rawPriceFallback > 0) {
          item.rawCurr = rawPriceFallback;
          if (Array.isArray(item.recentClosesRaw) && item.recentClosesRaw.length > 0) {
            item.recentClosesRaw[item.recentClosesRaw.length - 1] = rawPriceFallback;

          item.high52w = item.unit === "만" ? +(rawHighFallback / 10000).toFixed(2) : +rawHighFallback.toFixed(2);

    async function fetchWithTimeout(url, options = {}, timeoutMs = 2800) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: ctrl.signal });
      } finally {
        clearTimeout(id);
      }
    }

    async function fetchDirectBrowserNewsRSS() {
      const queries = [
        { q: "엔비디아 젠슨황 사임 반도체", tag: "NVIDIA+1", target: "sector" },
        { q: "삼성전자 모딘 HBM 반도체", tag: "삼성 HBM", target: "005930.KS" },
        { q: "대덕전자 기판 반도체", tag: "기판 수급", target: "353200.KS" },
        { q: "원익IPS 영업이익 반도체", tag: "장비 실적", target: "240810.KQ" }
      ];
      let newsFetched = 0;
      const newSector = [];

      await Promise.all(queries.map(async (item) => {
        const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(item.q)}&hl=ko&gl=KR&ceid=KR:ko&_=${Date.now()}`;
        const proxyUrls = [
          `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`,
          `https://corsproxy.io/?${encodeURIComponent(rssUrl)}`
        ];
        for (const pUrl of proxyUrls) {
          try {
            const r = await fetchWithTimeout(pUrl, { cache: "no-store" }, 2800);
            if (!r.ok) continue;
            const xmlText = await r.text();
            const doc = new DOMParser().parseFromString(xmlText, "text/xml");
            const nodes = Array.from(doc.querySelectorAll("item")).slice(0, 3);
            if (!nodes.length) continue;

            const parsed = nodes.map(node => {
              let title = node.querySelector("title")?.textContent || "";
              const link = node.querySelector("link")?.textContent || "#";
              const source = node.querySelector("source")?.textContent || "뉴스";
              if (title.includes(" - ")) title = title.split(" - ").slice(0, -1).join(" - ").trim();
              return { tag: item.tag, title, source, link };
            });

            if (item.target === "sector") {
              newSector.push(...parsed);
            } else {
              liveNews.stocks[item.target] = parsed;
              if (item.target === "005930.KS") liveNews.stocks["005935.KS"] = parsed;
              newSector.push(parsed[0]);
            }
            newsFetched += parsed.length;
            break;
          } catch (_) {}
        }
      }));

      if (newSector.length >= 2) {
        liveNews.sector = newSector.slice(0, 4);
        liveNews.updatedAt = `${formatNowKstShort()} 실시간 뉴스`;
      }
      return newsFetched;
    }

        "005935.KS": "stock_005935",
        "005930.KS": "stock_005930",
        "353200.KS": "stock_353200",
        "240810.KQ": "stock_240810",
        "AMD": "stock_AMD",
        "CLS": "stock_CLS"
      };
      let updatedCount = 0;

      await Promise.all(syms.map(async (sym) => {
        const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=10d&_=${Date.now()}`;
        const proxyUrls = [
          `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
        ];
        for (const pUrl of proxyUrls) {
          try {
            const r = await fetchWithTimeout(pUrl, { cache: "no-store" }, 2600);
            if (!r.ok) continue;
            const j = await r.json();
            const res = j?.chart?.result?.[0];
            if (!res) continue;
            const meta = res.meta || {};
            const tsList = res.timestamp || [];
            const closesRaw = res.indicators?.quote?.[0]?.close || [];
            const isKrw = sym.endsWith(".KS") || sym.endsWith(".KQ");

            const pairs = [];
            for (let i = 0; i < tsList.length; i++) {
              const c = closesRaw[i];
              if (typeof c === "number" && c > 0) {
                const dt = new Date((tsList[i] + 9 * 3600) * 1000);
                pairs.push([`${dt.getUTCMonth() + 1}/${dt.getUTCDate()}`, isKrw ? Math.round(c) : Number(c.toFixed(2))]);
              }
            }
            const p = typeof meta.regularMarketPrice === "number"
              ? (isKrw ? Math.round(meta.regularMarketPrice) : Number(meta.regularMarketPrice.toFixed(2)))
              : (pairs.length ? pairs[pairs.length - 1][1] : null);
            if (!p) continue;

            if (pairs.length) pairs[pairs.length - 1][1] = p;
            const recent = pairs.slice(-5);
            const rDates = recent.map(x => x[0]);
            const rCloses = recent.map(x => x[1]);
            const prev = rCloses.length >= 2 ? rCloses[rCloses.length - 2] : (meta.chartPreviousClose || p);
            const chgPct = prev ? Number((((p - prev) / prev) * 100).toFixed(2)) : 0;
            const wkBase = rCloses.length ? rCloses[0] : prev;
            const wkPct = wkBase ? Number((((p - wkBase) / wkBase) * 100).toFixed(2)) : 0;

            if (mapSym[sym]) {
              applyRichStockDetail(mapSym[sym], {
                price: p,
                prev_close: prev,
                change_pct: chgPct,
                week_change_pct: wkPct,
                high52w: meta.fiftyTwoWeekHigh,
                low52w: meta.fiftyTwoWeekLow,
                recent_dates: rDates,
                recent_closes: rCloses
              });
              updatedCount++;
            } else if (sym === "^TNX") {
              liveMacro.us10y = Number(p.toFixed(2));
              liveMacro.us10yChg = chgPct;
              if (rCloses.length >= 4) liveMacro.us10yRecent = rCloses;
              if (rDates.length >= 4) liveMacro.us10yDates = rDates;
              updatedCount++;
            } else if (sym === "CL=F") {
              liveMacro.wtiOil = Number(p.toFixed(2));
              liveMacro.wtiChg = chgPct;
              updatedCount++;
            } else if (sym === "KRW=X") {
              liveMacro.usdkrw = Number(p.toFixed(1));
              liveMacro.usdkrwChg = chgPct;
              updatedCount++;
            } else if (sym === "TLT") {
              liveMacro.tlt = Number(p.toFixed(2));
              liveMacro.tltChg = chgPct;
              updatedCount++;
            }
            break;
          } catch (_) {}
        }
      }));
      return updatedCount;
    }

    async function refreshLivePrices(manual = false) {
      const btn = document.getElementById("refreshBtn");
      const badgeEl = document.getElementById("syncSourceBadge");
      if (btn && manual) {
        btn.textContent = "⏳ 동기화중";
        btn.disabled = true;
      }
      if (badgeEl && manual) {
        badgeEl.textContent = "🔄 실시간 시세·뉴스 조회중...";
      }

      countdownSec = 30;
      let payload = null;

      const urlsToTry = [
        `data/latest_briefing.json?t=${Date.now()}`,
        `https://raw.githubusercontent.com/dnrzoqs-byte/memory-briefing/main/data/latest_briefing.json?t=${Date.now()}`,
        `https://cdn.jsdelivr.net/gh/dnrzoqs-byte/memory-briefing@main/data/latest_briefing.json?t=${Date.now()}`
      ];
      if (!location.hostname.endsWith("github.io")) {
        urlsToTry.unshift(`/api/briefing?t=${Date.now()}`);
      }

      for (const u of urlsToTry) {
        try {
          const r = await fetchWithTimeout(u, { cache: "no-store" }, 2200);
          if (r.ok) {
            const candidate = await r.json();
            if (candidate && (candidate.stocks || candidate.dram || candidate.dram_spot)) {
              payload = candidate;
              break;
            }
          }
        } catch (_) {}
      }

      if (payload) applyLivePayload(payload);

      let directCount = 0;
      let newsCount = 0;
      if (manual) {
        try {
          const [qCnt, nCnt] = await Promise.all([
            fetchDirectBrowserYahooQuotes(),
            fetchDirectBrowserNewsRSS()
          ]);
          directCount = qCnt;
          newsCount = nCnt;
        } catch (_) {}
      }

      recomputeAllDynamicMetrics();
      switchView(currentView, false);
      updateLiveClock();

      if (badgeEl) {
        badgeEl.textContent = (directCount > 0 || newsCount > 0)
          ? "🟢 거래소·뉴스 직접 연동됨"
          : "🟢 시세·뉴스 실시간 연동";
      }
      const stampEl = document.getElementById("lastDataStamp");
      const curTime = formatNowKstShort();
      if (stampEl) stampEl.textContent = `${curTime} 최신 판독 완료`;

      if (manual) {
        document.querySelectorAll(".card, .verdict-hero").forEach(c => {
          c.classList.remove("card-refreshed");
          void c.offsetWidth;
          c.classList.add("card-refreshed");
        });
        showToast(`✅ [${curTime} 판독 완료] 종합 ${verdictModel.totalScore}점 · 삼전우 ${stockData.stock_005935.currLabel} · AMD ${stockData.stock_AMD.currLabel}`);
      }

      if (btn && manual) {
        btn.textContent = "✅ 완료";
        btn.disabled = false;
        setTimeout(() => { btn.textContent = "🔄 실시간 갱신"; }, 1200);
      }
    }

    (function initImmediate() {
      recomputeAllDynamicMetrics();
      const params = new URLSearchParams(window.location.search);
      switchView(params.get("view") || "dram", false);
      updateLiveClock();
      setInterval(updateLiveClock, 1000);
      setTimeout(() => { refreshLivePrices(false); }, 60);
      setInterval(() => {
        if (!document.hidden) refreshLivePrices(false);
      }, 30000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshLivePrices(false);
      });
    })();
  </script>
</body>
