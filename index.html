<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>반도체 객관적 리서치 &amp; 차등 분할매수 (Claude Opus × TDS)</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <style>
    /* =====================================================================
       Toss Design System (TDS) 토큰 (Claude Opus 공동 설계)
       - 색 절제: 무채색 그레이스케일 + 단일 Toss Blue (#3182F6)
       - 테두리(Border) 제거: 흰 카드(#FFFFFF)와 연회색(#F2F4F6 / #F7F8FA) 면 대비로만 분리
       - 위계: 숫자 800 / 제목 700~800 / 본문 400~500 뚜렷한 강약
       ===================================================================== */
    :root {
      --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      --bg-page: #F2F4F6;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F7F8FA;
      --bg-elevated: #ECEFF3;
      --bg-accent: #E8F3FF;
      --text-primary: #191F28;
      --text-secondary: #4E5968;
      --text-muted: #8B95A1;
      --border-color: #EDEFF2;
      --border-subtle: #F2F4F6;
      --up-red: #F04452;
      --up-red-soft: rgba(240, 68, 82, 0.08);
      --down-blue: #3182F6;
      --down-blue-soft: rgba(49, 130, 246, 0.09);
      --safe-green: #15B881;
      --safe-green-soft: rgba(21, 184, 129, 0.09);
      --warn-amber: #FF9500;
      --warn-amber-soft: rgba(255, 149, 0, 0.10);
      --purple-accent: #6B5CE7;
      --purple-soft: rgba(107, 92, 231, 0.09);
      --shadow-tds: 0 1px 2px rgba(25, 31, 40, 0.03), 0 8px 24px -8px rgba(25, 31, 40, 0.06);
    }

    html.dark {
      --bg-page: #101013;
      --bg-surface: #17171C;
      --bg-subtle: #202027;
      --bg-elevated: #2C2C35;
      --bg-accent: #1B2A4A;
      --text-primary: #F9FAFB;
      --text-secondary: #D1D6DB;
      --text-muted: #8B95A1;
      --border-color: #26262E;
      --border-subtle: #202027;
      --up-red: #FF5A67;
      --up-red-soft: rgba(255, 90, 103, 0.14);
      --down-blue: #4593FC;
      --down-blue-soft: rgba(69, 147, 252, 0.15);
      --safe-green: #20C997;
      --safe-green-soft: rgba(32, 201, 151, 0.14);
      --warn-amber: #FFB020;
      --warn-amber-soft: rgba(255, 176, 32, 0.15);
      --purple-accent: #978BFA;
      --purple-soft: rgba(151, 139, 250, 0.15);
      --shadow-tds: 0 4px 20px rgba(0, 0, 0, 0.45);
    }

    *, *::before, *::after, html, body, button, input, select, textarea, table, th, td, svg, text {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans) !important;
      letter-spacing: -0.022em;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.54;
      font-weight: 400;
    }

    .tnum {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .app-shell {
      max-width: 580px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 84px;
    }

    /* 상단 헤더 (토스 미니멀 스타일) */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
    }

    html.dark .app-header {
      background-color: rgba(23, 23, 28, 0.92);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px 8px;
      gap: 10px;
    }

    .header-eyebrow {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--safe-green);
      display: inline-block;
    }

    .header-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-refresh {
      appearance: none;
      border: none;
      background-color: var(--down-blue);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 13px;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .btn-refresh:active {
      opacity: 0.82;
    }

    .btn-dark {
      appearance: none;
      border: none;
      background-color: var(--bg-subtle);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 11px;
      border-radius: 12px;
      cursor: pointer;
    }

    .sync-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 18px 7px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 10.5px;
      background-color: var(--bg-accent);
      color: var(--down-blue);
    }

    /* 상단 탭 */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 0 10px;
      background-color: var(--bg-surface);
    }

    .nav-tab {
      appearance: none;
      border: none;
      background: transparent;
      padding: 10px 4px 9px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      text-align: center;
      white-space: nowrap;
    }

    .nav-tab.active {
      color: var(--text-primary);
      border-bottom-color: var(--text-primary);
      font-weight: 800;
    }

    /* 하단 고정 독 (TDS Tab Bar) */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 580px;
      background-color: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 60;
      padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px));
    }

    html.dark .bottom-dock {
      background-color: rgba(23, 23, 28, 0.96);
    }

    .dock-btn {
      appearance: none;
      border: none;
      background: transparent;
      padding: 5px 2px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .dock-btn.active {
      color: var(--down-blue);
      font-weight: 800;
    }

    .dock-icon { font-size: 15px; line-height: 1; }
    .dock-label { font-size: 10.5px; font-weight: 700; }

    .view-body {
      flex: 1;
      padding: 14px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* =========================================================
       STEP 1~4 논리적 읽기 흐름 헤더 (Claude Opus 설계)
       ========================================================= */
    .step-flow {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .step-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .step-head {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 2px 0;
    }

    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--down-blue);
      color: #FFFFFF;
      font-size: 12.5px;
      font-weight: 800;
    }

    .step-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .step-desc {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 33px;
      margin-top: -4px;
    }

    /* TDS 카드: 테두리 없음, 20px 라운드, 넉넉한 20px 패딩 */
    .bento-card, .truth-card {
      background-color: var(--bg-surface);
      border: none;
      border-radius: 20px;
      padding: 20px 18px;
      box-shadow: var(--shadow-tds);
    }

    .card-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      line-height: 1.38;
    }

    .card-prose {
      font-size: 13.5px;
      font-weight: 450;
      color: var(--text-secondary);
      line-height: 1.62;
      margin-top: 8px;
    }

    .card-prose strong {
      font-weight: 700;
      color: var(--text-primary);
    }

    /* 6지표 모니터 타일: 알록달록한 배경 제거, 면 대비 + 큰 숫자 */
    .bento-monitor-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 14px 0 4px;
    }

    .bm-tile {
      background-color: var(--bg-subtle);
      border: none;
      border-radius: 14px;
      padding: 12px 13px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .bm-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .bm-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.035em;
      margin-top: 1px;
    }

    .bm-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 차등 분할매수 랭킹 테이블 (토스 리스트 스타일) */
    .winrate-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      margin-top: 8px;
    }

    .winrate-table th {
      text-align: left;
      padding: 6px 4px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      background: transparent;
    }

    .winrate-table td {
      padding: 13px 4px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }

    .winrate-table tr:last-child td {
      border-bottom: none;
    }

    .wr-row {
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

    .wr-row:hover {
      background-color: var(--bg-subtle);
    }

    .stage-weight-bar {
      display: flex;
      height: 6px;
      width: 100%;
      max-width: 115px;
      border-radius: 99px;
      overflow: hidden;
      background-color: var(--bg-elevated);
      margin-top: 5px;
    }

    /* 종목 상세 분할매수 스텝퍼 (관망 0% -> 탐색 X% -> 주력 40% -> 확인 Y%) */
    .split-stepper-box {
      background-color: var(--bg-subtle);
      border: none;
      border-radius: 16px;
      padding: 16px;
      margin: 14px 0;
    }

    .ss-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .ss-steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ss-step-row {
      display: grid;
      grid-template-columns: 82px 92px 1fr;
      align-items: center;
      gap: 8px;
      padding: 11px 12px;
      border-radius: 12px;
      background-color: var(--bg-surface);
      font-size: 12px;
    }

    .ss-step-row.active-step {
      background-color: var(--bg-accent);
      box-shadow: inset 0 0 0 1.5px var(--down-blue);
    }

    .ss-footer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
    }

    /* 서브 탭 */
    .seg-grid-3x2 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      background-color: var(--bg-subtle);
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .seg-grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      background-color: var(--bg-subtle);
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    .seg-btn {
      appearance: none;
      border: none;
      background: transparent;
      padding: 9px 4px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .seg-btn.active {
      background-color: var(--bg-surface);
      color: var(--text-primary);
      font-weight: 800;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .stock-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stock-name { font-size: 19px; font-weight: 800; letter-spacing: -0.03em; }
    .stock-code { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-left: 5px; }
    .stock-curr-wrap { text-align: right; }
    .stock-curr { font-size: 22px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.15; }
    .stock-chg-row { display: flex; justify-content: flex-end; gap: 5px; margin-top: 4px; }

    .action-pill {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 7px;
      white-space: nowrap;
    }

    .target-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 14px 0;
    }

    .target-cell {
      border-radius: 14px;
      padding: 12px 10px;
      background-color: var(--bg-subtle);
      text-align: center;
    }

    .tc-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
    .tc-val { font-size: 14.5px; font-weight: 800; color: var(--text-primary); }
    .tc-upside { font-size: 11px; font-weight: 600; margin-top: 3px; }

    .chart-box {
      background-color: var(--bg-subtle);
      border-radius: 14px;
      padding: 12px 8px 6px;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6px 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .svg-chart { width: 100%; height: auto; display: block; }

    /* Q&A 리서치 항목 리스트 */
    .qa-bullet-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .qa-bullet-item {
      background-color: var(--bg-subtle);
      border-radius: 13px;
      padding: 13px 14px;
      font-size: 13px;
      font-weight: 450;
      color: var(--text-secondary);
      line-height: 1.58;
    }

    .qa-bullet-item strong {
      font-weight: 750;
      color: var(--text-primary);
    }

    .kpi-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .kpi-box {
      background-color: var(--bg-subtle);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .kpi-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 3px; }
    .kpi-val { font-size: 17px; font-weight: 800; color: var(--text-primary); }
    .kpi-sub { font-size: 11px; font-weight: 500; margin-top: 3px; color: var(--text-muted); }

    .tab-footer-nav {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 10px;
      margin-top: 6px;
    }

    .footer-nav-btn {
      appearance: none;
      border: none;
      background-color: var(--bg-surface);
      color: var(--text-primary);
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-tds);
    }

    .footer-nav-btn.primary {
      background-color: var(--down-blue);
      color: #FFFFFF;
    }

    .live-toast {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: rgba(25, 31, 40, 0.94);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
      white-space: nowrap;
    }

    .live-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-top">
        <div>
          <div class="header-eyebrow">
            <span id="liveDot" class="live-dot"></span>
            <span id="liveTimeText" class="tnum">실시간 연결중...</span>
          </div>
          <h1 id="headerTitle" class="header-title">반도체 시황 및 차등 분할매수 리포트</h1>
        </div>
        <div class="header-actions">
          <button id="refreshBtn" class="btn-refresh" onclick="refreshLivePrices(true)">실시간 갱신</button>
          <button id="darkBtn" class="btn-dark" onclick="toggleDark()">다크</button>
        </div>
      </div>

      <div class="sync-strip tnum">
        <div>
          <span id="syncSourceBadge" class="sync-badge">Claude Opus × TDS 리서치 엔진</span>
          <span id="lastDataStamp" style="margin-left:6px;">실시간 시세·뉴스 동기화됨</span>
        </div>
        <div id="nextRefreshCountdown" style="font-weight:700; color:var(--down-blue);">자동갱신 30초</div>
      </div>

      <nav class="nav-tabs">
        <button id="tab-dram" class="nav-tab active" onclick="switchView('dram')">1. 시황·매수설계</button>
        <button id="tab-overview5" class="nav-tab" onclick="switchView('overview5')">2. 종목별 타점</button>
        <button id="tab-factcheck" class="nav-tab" onclick="switchView('factcheck')">3. 사이클·LTA 진실</button>
        <button id="tab-rates" class="nav-tab" onclick="switchView('rates')">4. 거시·메모리</button>
      </nav>
    </header>

    <main id="viewContainer" class="view-body"></main>

    <nav class="bottom-dock">
      <button id="dock-dram" class="dock-btn active" onclick="switchView('dram')">
        <span class="dock-icon">📊</span>
        <span class="dock-label">1. 시황·매수설계</span>
      </button>
      <button id="dock-overview5" class="dock-btn" onclick="switchView('overview5')">
        <span class="dock-icon">🎯</span>
        <span class="dock-label">2. 종목별 타점</span>
      </button>
      <button id="dock-factcheck" class="dock-btn" onclick="switchView('factcheck')">
        <span class="dock-icon">⚖️</span>
        <span class="dock-label">3. 사이클·LTA</span>
      </button>
      <button id="dock-rates" class="dock-btn" onclick="switchView('rates')">
        <span class="dock-icon">🏦</span>
        <span class="dock-label">4. 거시·메모리</span>
      </button>

    // =========================================================================
    // 2. [Claude Opus 설계] 종목별 밸류·변동성·수급 3축 차등 분할매수 엔진
    //    - 일률적 30/40/30 완전 폐기!
    //    - frontShift = round((vScore - 0.40)*60 - (beta - 0.05)*400 - (사이드카 ? 6 : 0))
    //    - 탐색(1차) = clamp(30 + frontShift, 8, 45) / 주력(2차) = 40 / 확인(3차) = 60 - 탐색
    // =========================================================================
    function recomputeAllDynamicMetrics() {
      const sPref = stockData.stock_005935;
      const sMain = stockData.stock_005930;
      const sDaeduck = stockData.stock_353200;
      const sWonik = stockData.stock_240810;
      const sCls = stockData.stock_CLS;
      const sAmd = stockData.stock_AMD;

      const allStocks = Object.values(stockData);
      const isSidecarCrash = (liveMacro.kospiChg <= -4.5 || liveMacro.soxChg <= -7.0 || liveMacro.vix >= 30.0);

      const discPct = ((1 - sPref.rawCurr / sMain.rawCurr) * 100).toFixed(1);
      const preTaxYield = ((18404 / sPref.rawCurr) * 100).toFixed(1);
      const clsFwdPer = (sCls.rawCurr / 21.5).toFixed(1);
      const ddPer = (sDaeduck.rawCurr / 10800).toFixed(1);

      const mFactor = (liveMacro.vix >= 28 && liveMacro.us10y < 5.0) ? 0.25 : 0.15;

      allStocks.forEach(st => {
        const isKrw = st.unit === "만";
        if (isKrw) {
          st.curr = +(st.rawCurr / 10000).toFixed(2);
          st.currLabel = Math.round(st.rawCurr).toLocaleString() + "원";
          st.high52wLabel = Math.round(st.high52w * 10000).toLocaleString() + "원";
        } else {
          st.curr = +st.rawCurr.toFixed(2);
          st.currLabel = "$" + st.rawCurr.toFixed(2);
          st.high52wLabel = "$" + st.high52w.toFixed(2);
        }

        const dd = ((st.curr - st.high52w) / st.high52w) * 100;
        st.drawdown = (dd >= 0 ? "+" : "") + dd.toFixed(1) + "%";

        const u1 = ((st.target1 - st.curr) / st.curr) * 100;
        const u2 = ((st.target2 - st.curr) / st.curr) * 100;
        st.upside1 = (u1 >= 0 ? "+" : "") + u1.toFixed(1) + "%";
        st.upside2 = (u2 >= 0 ? "+" : "") + u2.toFixed(1) + "%";

        const tFactor = Math.min(0.55, Math.max(0.1, (Math.abs(dd) / 120) + (st.changePct <= -6 ? 0.15 : 0)));
        const fFactor = isSidecarCrash ? -0.05 : 0.1;

        const rawWinProb = 50 + 25 * mFactor + 20 * st.sScore + 30 * tFactor + 15 * st.vScore + 10 * fFactor;
        st.winProb = Math.round(Math.min(92, Math.max(45, rawWinProb)));

        // ★ Claude Opus 3축 차등 비중 공식
        const beta = st.betaBand || 0.05;
        const frontShift = Math.round((st.vScore - 0.40) * 60 - (beta - 0.05) * 400 - (isSidecarCrash ? 6 : 0));
        const wExplore = Math.min(45, Math.max(8, 30 + frontShift));
        const wCore = 40;
        const wConfirm = 100 - wCore - wExplore;

        const p1Raw = st.rawCurr;
        const p2Raw = isKrw ? Math.round((p1Raw * (1 - beta)) / 100) * 100 : +(p1Raw * (1 - beta)).toFixed(2);
        const p3Raw = isKrw ? Math.round((p1Raw * (1 - 2 * beta)) / 100) * 100 : +(p1Raw * (1 - 2 * beta)).toFixed(2);
        const avgCostRaw = isKrw
          ? Math.round(((wExplore * p1Raw + wCore * p2Raw + wConfirm * p3Raw) / 100) / 100) * 100
          : +((wExplore * p1Raw + wCore * p2Raw + wConfirm * p3Raw) / 100).toFixed(2);

        const fmtP = (v) => isKrw ? v.toLocaleString() + "원" : "$" + v.toFixed(2);
        const fmtShort = (v) => isKrw ? (v / 10000).toFixed(2) + "만" : "$" + v.toFixed(0);
        const avgCostUnit = isKrw ? (avgCostRaw / 10000) : avgCostRaw;
        const expectedReturnT1 = +(((st.target1 - avgCostUnit) / avgCostUnit) * 100).toFixed(1);

        // 현재 권장 집행 단계 및 이유
        let stageNow = "";
        let whyWeightText = "";
        if (wExplore >= 35) {
          stageNow = `탐색 ${wExplore}% 우선 집행`;
          whyWeightText = `본주 대비 ${discPct}% 할인 및 세전 연 ${preTaxYield}% 배당 안전판이 작동하고 변동성(β=${Math.round(beta*100)}%)이 가장 낮아, 추가 하락 폭이 제한적이므로 앞단계(탐색 ${wExplore}%)에서 비중 있게 담습니다.`;
        } else if (wExplore >= 22) {
          stageNow = `탐색 ${wExplore}% 분할 진입`;
          whyWeightText = `10년 역사적 저점인 PBR 1.00배(18만 원선) 바닥에 도달해 밸류 안전마진이 확보되었으므로 탐색 ${wExplore}%로 진입하고, 현금 73%를 주력(40%)·확인(33%) 단계에 남겨둡니다.`;
        } else if (wExplore >= 14) {
          stageNow = `탐색 ${wExplore}% 소액 · 주력 대기`;
          whyWeightText = `실적·밸류는 저평가이나 일간 변동성(β=${Math.round(beta*100)}%)이 큰 종목이므로 현재가에서는 ${wExplore}%만 탐색 매수하고, 실탄의 ${wCore + wConfirm}%를 추가 언더슈팅(주력 40%)과 VIX 30 하회 확인(${wConfirm}%)까지 비축합니다.`;
        } else {
          stageNow = `정찰 ${wExplore}% 최소 · 관망 우선`;
          whyWeightText = `변동성(β=${Math.round(beta*100)}%)이 가장 크고 단기 수급·규제 노이즈에 민감하므로, 지금은 ${wExplore}%만 최소 정찰하고 현금의 ${wCore + wConfirm}%를 끝까지 아껴두어야 평단가를 낮출 수 있습니다.`;
        }

        st.splitPlan = {
          betaPct: Math.round(beta * 100),
          wExplore,
          wCore,
          wConfirm,
          stageNow,
          whyWeightText,
          p1Label: fmtP(p1Raw),
          p2Label: fmtP(p2Raw),
          p3Label: fmtP(p3Raw),
          avgCostLabel: fmtP(avgCostRaw),
          avgCostShort: fmtShort(avgCostRaw),
          expectedReturnT1: `+${expectedReturnT1}%`,
          stageDot: `탐색 ${wExplore}% · 주력 ${wCore}% · 확인 ${wConfirm}%`
        };

        if (Array.isArray(st.recentClosesRaw) && st.recentClosesRaw.length >= 4) {
          const rc = st.recentClosesRaw;
          const rd = st.recentDates || [];
          const toUnit = (v) => isKrw ? +(v / 10000).toFixed(2) : +Number(v).toFixed(2);
          st.history = [
            st.high52w,
            toUnit(rc[0]),
            toUnit(rc[Math.floor(rc.length / 2)]),
            toUnit(rc[rc.length - 2]),
            st.curr,
            st.target1,
            st.target2
          ];
          st.histLabels = ["52주최고", rd[0] || "D-4", rd[Math.floor(rd.length / 2)] || "D-2", rd[rd.length - 2] || "전일", "현재", "1차적정", "2차익절"];
        }
      });

      sPref.oneLineMetric = `본주 대비 ${discPct}% 할인 · 세전 배당 연 ${preTaxYield}% · 최저 변동성(β=4%) 방어주`;
      sMain.oneLineMetric = `10년 역사적 바닥 PBR 1.00배(18만 원선) 도달 · 3Q 영업이익 107.4조`;
      sDaeduck.oneLineMetric = `3Q 영업이익 879억(연환산 PER ${ddPer}배) · LTA 선수금 914억 증가 공시`;
      sCls.oneLineMetric = `27년 공식 가이던스(EPS $21.5) 기준 선행 PER ${clsFwdPer}배 · 52주 최저($197.5) 근접`;
      sWonik.oneLineMetric = `3Q 영업이익 667억(+142% YoY) 호실적 vs 고변동(β=7%) 과매도 구간`;
      sAmd.oneLineMetric = `고변동(β=8%) 및 대중국 수출통제 조사 노이즈 → 실탄 92% 후순위 비축 필수`;

      quantRegime = {
        isSidecarCrash,
        discPct,
        preTaxYield,
        clsFwdPer,
        ddPer
      };
    }

    // =========================================================================
    // 3. 차트 렌더러 & 하단 스텝퍼
    // =========================================================================
    function renderLineSvg(pts, labels, forecastStartIdx, unitPrefix = "$", unitSuffix = "") {
      const w = 440, h = 144, padX = 36, topY = 24, botY = 110;
      const minV = Math.min(...pts) * 0.91;
      const maxV = Math.max(...pts) * 1.07;
      const range = maxV - minV || 1;
      const stepX = (w - padX * 2) / (pts.length - 1);

      const coords = pts.map((v, i) => ({
        x: padX + i * stepX,
        y: botY - ((v - minV) / range) * (botY - topY),
        v,
        label: labels[i] || ""
      }));

      const solidPts = coords.slice(0, forecastStartIdx + 1).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const dashPts = coords.slice(forecastStartIdx).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const areaPts = `${coords[0].x.toFixed(1)},${botY} ` + coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ") + ` ${coords[coords.length - 1].x.toFixed(1)},${botY}`;

      let nodesHtml = "";
      coords.forEach((c, idx) => {
        const isForecast = idx > forecastStartIdx;
        const isCurrent = idx === forecastStartIdx;
        const dotColor = isCurrent ? "var(--up-red)" : (isForecast ? "var(--safe-green)" : "var(--down-blue)");
        const r = isCurrent ? 5 : 3.8;
        const valStr = `${unitPrefix}${Number.isInteger(c.v) ? c.v : c.v.toFixed(2)}${unitSuffix}`;
        const yOffset = idx % 2 === 0 ? -9 : -11;

        nodesHtml += `
          <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${r}" fill="${dotColor}" stroke="var(--bg-surface)" stroke-width="1.6" />
          <text x="${c.x.toFixed(1)}" y="${(c.y + yOffset).toFixed(1)}" text-anchor="middle" font-size="${isCurrent ? '10.5' : '9.5'}" font-weight="800" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-primary)'}">${valStr}</text>
          <text x="${c.x.toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="9.5" font-weight="${isCurrent ? '800' : '600'}" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-muted)'}">${c.label}</text>
        `;
      });

      return `
        <svg viewBox="0 0 ${w} ${h}" class="svg-chart">
          <defs>
            <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--down-blue)" stop-opacity="0.14"/>
              <stop offset="100%" stop-color="var(--down-blue)" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <line x1="${padX}" y1="${topY}" x2="${w - padX}" y2="${topY}" stroke="var(--border-color)" stroke-dasharray="3 3" stroke-width="0.8" />
          <line x1="${padX}" y1="${(topY + botY) / 2}" x2="${w - padX}" y2="${(topY + botY) / 2}" stroke="var(--border-color)" stroke-dasharray="3 3" stroke-width="0.8" />
          <line x1="${padX}" y1="${botY}" x2="${w - padX}" y2="${botY}" stroke="var(--border-color)" stroke-width="1" />
          <polygon points="${areaPts}" fill="url(#chartGrad)" />
          <polyline fill="none" stroke="var(--down-blue)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="${solidPts}" />
          ${forecastStartIdx < coords.length - 1 ? `<polyline fill="none" stroke="var(--safe-green)" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" points="${dashPts}" />` : ""}
          ${nodesHtml}
        </svg>
      `;
    }

                <strong>2) 그럼 무엇을 진짜 걱정해야 하나 (환각 없는 리스크 팩트):</strong> 빅테크들은 위약금을 물며 계약을 파기하는 대신 <strong>① 올해 4분기에 인수할 물량을 내년 상반기로 늦추는 '납기 이연(Push-out)', ② 비싼 12단 HBM 대신 가성비 8단 비중 확대, ③ 매년 갱신하는 롤링(Rolling) 가격 협상에서 단가를 계약 밴드 하단(Floor)으로 깎는 '마이크로 재협상'</strong>을 요구합니다.

          <!-- Q2. 메모리 가격 하락 & 슈퍼사이클 종료 여부 -->
          <section class="truth-card">
            <h2 class="card-title">Q2. 메모리 가격이 이제 떨어지고 슈퍼사이클은 완전히 끝나는가?</h2>
            <div style="margin-top:8px; padding:10px 13px; border-radius:11px; background:var(--warn-amber-soft); color:var(--warn-amber); font-size:13px; font-weight:750;">
              객관적 최종 판정: '모든 메모리가 다 같이 오르던 슈퍼사이클'은 끝났으며, 범용(DDR4) 하락과 AI용(HBM4·DDR5) 강세의 양극화 국면입니다.
            </div>
            <div class="qa-bullet-list">
              <div class="qa-bullet-item">
                <strong>1) 범용(레거시) 메모리는 피크 통과가 맞습니다:</strong> 구형 DDR4 16Gb 현물가는 $78.62(-0.16%), 8Gb는 $43.75(-0.39%)로 이미 상승세가 멈췄습니다. PC·스마트폰 수요 둔화와 중국 CXMT의 구형 증설이 맞물려 <strong>2027년 하반기부터 범용 D램 단가 하락 압력은 실재</strong>합니다.
              </div>
              <div class="qa-bullet-item">
                <strong>2) 반면 AI 서버용 메모리(이익 비중 75%)는 공급 부족이 이어집니다:</strong> AI 서버 주력인 DDR5 16Gb($60.27)는 최고가권을 유지 중이며, HBM은 일반 D램 대비 웨이퍼를 3~4배 더 소모하기 때문에 2027년 상반기까지 타이트한 수급이 유지됩니다. 다만 2027년 하반기 이후에는 HBM 역시 증설 물량이 풀리며 평균단가(ASP) 상승률이 둔화될 수 있음을 염두에 두어야 합니다.
              </div>
            </div>
          </section>

          <!-- Q3. 전고점(52주 최고가) 탈환 가능 여부 -->
          <section class="truth-card">
            <h2 class="card-title">Q3. 앞으로 희망은 없나? 과거 52주 전고점을 다시 넘을 수 있나?</h2>
            <div style="margin-top:8px; padding:10px 13px; border-radius:11px; background:var(--safe-green-soft); color:var(--safe-green); font-size:13px; font-weight:750;">
              객관적 최종 판정: 52주 전고점 단기 탈환 확률은 20~35%로 낮지만, 현재 바닥에서 '10년 평균 밸류(1차 적정가, +40~75%)'로 반등할 확률은 78~85%입니다.
            </div>
            <div class="qa-bullet-list">
              <div class="qa-bullet-item">
                <strong>1) 왜 전고점(삼전 37.4만·대덕 19.8만·원익 18.7만·CLS $474)은 당장 넘기 힘든가:</strong> 전고점은 "AI 메모리가 영원히 고성장한다"는 최고 멀티플(PBR 2.1배·PER 25배)이 반영된 과열 가격이었습니다. 시장은 이제 2027년 하반기 성장 감속을 의식하기 시작했으므로, 이익이 잘 나와도 과거 고점 때의 높은 멀티플을 다시 부여하지 않습니다.
              </div>
              <div class="qa-bullet-item">
                <strong>2) 그럼에도 지금이 기회인 이유 (평균회귀의 법칙):</strong> 반대로 금요일 사이드카 투매로 인해 현재 주가는 <strong>삼성전자 PBR 1.00배(18.31만 원), 삼성전자우 세전 배당 12.8%(14.43만 원), 대덕전자 PER 6.8배(7.39만 원), 셀레스티카 선행 PER 9.4배($201.80)</strong>라는 '적자 위기 기업' 수준까지 과도하게 추락했습니다. 전고점을 바라보지 않고 <strong>10년 역사적 평균치(1차 목표가)로 되돌아오는 반등만 취해도 +40~+80%의 수익</strong>이 가능합니다.
              </div>
            </div>
          </section>

          <!-- Q4. 젠슨 황 사퇴 및 국내 금융당국(F4) 대책 -->
          <section class="truth-card">
            <h2 class="card-title">Q4. 젠슨 황 사퇴와 국내 증시 안정 대책(F4)은 실제로 도움이 되나?</h2>
            <div class="qa-bullet-list">
              <div class="qa-bullet-item">
                <strong>1) 젠슨 황 사퇴의 양면성:</strong> 단기적으로는 AI 대장주의 리더십 공백 우려로 기술주 투매를 자극(단기 악재)했으나, 중기적으로는 빅테크들이 엔비디아·하이닉스 단일 독점 리스크를 피하기 위해 <strong>AMD(MI450)·자체 칩(셀레스티카 스위치)·삼성전자 HBM으로 공급망을 이원화('NVIDIA+1')하는 구조적 계기</strong>가 됩니다.
              </div>
              <div class="qa-bullet-item">
                <strong>2) 금융당국 F4 긴급조치의 효과와 한계:</strong> 증권사 신용융자 담보비율(140%) 유지 의무를 3개월 면제해 <strong>개인 신용계좌의 기계적 강제 반대매매 폭탄을 막아준 것</strong>은 실질적인 하방 안전판입니다. 다만 외국인 매수가 본격 복귀하려면 <strong>VIX 공포지수가 35.89에서 30 아래로 내려오고 코스피 4,800선 지지가 확인</strong>되어야 합니다.
              </div>
            </div>
          </section>
        </div>

        ${renderBottomTabStepper('overview5', '2. 종목별 타점', 'rates', '4. 거시·메모리')}
      `;
    }

    // [화면 4] 🏦 거시(금리·환율·유가) & 💾 메모리 실물(DRAMeXchange) 모니터
    function renderRatesView() {
      const d = dramSeries[currentDramKey] || dramSeries.ddr5_16g;
      const tabKeys = Object.keys(dramSeries);

      const ratePts = Array.isArray(liveMacro.us10yRecent) && liveMacro.us10yRecent.length >= 4
        ? [...liveMacro.us10yRecent.slice(-4), liveMacro.us10y, 4.85, 4.70]
        : [5.10, 5.07, 5.05, 4.95, liveMacro.us10y, 4.85, 4.70];
      const rateDates = Array.isArray(liveMacro.us10yDates) && liveMacro.us10yDates.length >= 4
        ? [...liveMacro.us10yDates.slice(-4), "현재", "다음주", "연말"]
        : ["11/17", "11/18", "11/19", "11/20", "현재", "다음주", "연말"];

      const w = 440, h = 144, padX = 36, topY = 24, botY = 110;
      const minV = 4.40, maxV = 5.45;
      const range = maxV - minV;
      const stepX = (w - padX * 2) / (ratePts.length - 1);

      const coords = ratePts.map((v, i) => ({
        x: padX + i * stepX,
        y: botY - ((v - minV) / range) * (botY - topY),
        v,
        label: rateDates[i]
      }));

      const threshY = botY - ((5.00 - minV) / range) * (botY - topY);
      const solidPts = coords.slice(0, 5).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const dashPts = coords.slice(4).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");

      let nodesHtml = "";
      coords.forEach((c, idx) => {
        const isCurrent = idx === 4;
        const isForecast = idx > 4;
        const dotColor = isCurrent ? "var(--up-red)" : (isForecast ? "var(--safe-green)" : "var(--down-blue)");
        nodesHtml += `
          <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${isCurrent ? 5 : 3.8}" fill="${dotColor}" stroke="var(--bg-surface)" stroke-width="1.6" />
          <text x="${c.x.toFixed(1)}" y="${(c.y - 9).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-primary)'}">${c.v.toFixed(2)}%</text>
          <text x="${c.x.toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="9.5" font-weight="${isCurrent ? '800' : '600'}" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-muted)'}">${c.label}</text>
        `;
      });

      return `
        <div class="step-flow">
          <section class="bento-card">
            <h2 class="card-title" style="margin-bottom:12px;">DRAMeXchange 품목별 실물 현물가 &amp; 계약가 추이</h2>
            <div class="seg-grid-2x2">
              ${tabKeys.map(k => `
                <button onclick="selectDramKey('${k}')" class="seg-btn ${k === currentDramKey ? 'active' : ''}">
                  ${dramSeries[k].shortTab}
                </button>
              `).join("")}
            </div>

            <div class="kpi-grid-2 tnum">
              <div class="kpi-box">
                <div class="kpi-label">실시간 현물 평균가 (Spot)</div>
                <div class="kpi-val" style="color:var(--down-blue);">$${d.price.toFixed(2)}</div>
                <div class="kpi-sub">${d.changeText}</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">고정계약가 및 수급 구조</div>
                <div class="kpi-val" style="font-size:14px;">${d.contractFact}</div>
                <div class="kpi-sub">단기 전망: ${d.spotForecast}</div>
              </div>
            </div>

            <div class="chart-box tnum">
              <div class="chart-legend">
                <span>● 파란 실선: 최근 6개월 실거래</span>
                <span style="color:var(--safe-green);">● 초록 점선: 연말 궤적</span>
              </div>
              ${renderLineSvg(d.pts, d.labels, 4, "$", "")}
            </div>
          </section>

          <section class="bento-card">
            <h2 class="card-title" style="margin-bottom:12px;">한·미 국채금리 · 환율 · 유가 거시 안전판 모니터</h2>
            <div class="kpi-grid-2 tnum">
              <div class="kpi-box">
                <div class="kpi-label">미국 10년 국채금리 / TLT</div>
                <div class="kpi-val" style="color:var(--safe-green);">${liveMacro.us10y.toFixed(2)}% <span style="font-size:12px; color:var(--text-secondary);">/ $${liveMacro.tlt.toFixed(2)}</span></div>
                <div class="kpi-sub">5.0% 아래로 하향 안정 (안전자산 유입)</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">원/달러 환율 (USD/KRW)</div>
                <div class="kpi-val">${liveMacro.usdkrw.toFixed(1)}원</div>
                <div class="kpi-sub">1,330원대 안정 (외환 유출 징후 없음)</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">WTI 원유 선물 (CL=F)</div>
                <div class="kpi-val">$${liveMacro.wtiOil.toFixed(2)}</div>
                <div class="kpi-sub">$83선 안정 (인플레이션 부담 완화)</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-label">한은 기준금리 / 국고채 10Y</div>
                <div class="kpi-val">${liveMacro.krBase.toFixed(2)}% / ${liveMacro.kr10y.toFixed(2)}%</div>
                <div class="kpi-sub">11/27 금통위 기준금리 결정 대기</div>
              </div>
            </div>

            <div class="chart-box tnum">
              <div class="chart-legend">
                <span>● 미국 10년물 국채금리 추이 (%)</span>
                <span style="color:var(--up-red);">--- 5.00% 기술주 밸류 경계선</span>
              </div>
              <svg viewBox="0 0 ${w} ${h}" class="svg-chart">
                <line x1="${padX}" y1="${threshY.toFixed(1)}" x2="${w - padX}" y2="${threshY.toFixed(1)}" stroke="var(--up-red)" stroke-dasharray="4 3" stroke-width="1.2" />
                <text x="${padX + 4}" y="${(threshY - 5).toFixed(1)}" font-size="9" font-weight="800" fill="var(--up-red)">5.00% 밸류 경계선</text>
                <line x1="${padX}" y1="${botY}" x2="${w - padX}" y2="${botY}" stroke="var(--border-color)" stroke-width="1" />
                <polyline fill="none" stroke="var(--down-blue)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="${solidPts}" />
                <polyline fill="none" stroke="var(--safe-green)" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" points="${dashPts}" />
                ${nodesHtml}
              </svg>
            </div>
          </section>
        </div>

        ${renderBottomTabStepper('factcheck', '3. 사이클·LTA 진실', 'dram', '1. 시황·매수설계')}
      `;
    }

    // =========================================================================
    // 5. 무결점 3중 실시간 동기화 엔진
    // =========================================================================
    const viewTitles = {
      dram: "반도체 시황 및 차등 분할매수 리포트",
      overview5: "종목별 차등 분할매수 타점 및 근거",
      factcheck: "슈퍼사이클·LTA·전고점 객관적 팩트 판독",
      rates: "거시 안전판 및 메모리 실물 가격 모니터"
    };

    function showToast(msg) {
      const toast = document.getElementById("liveToast");
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3400);
    }

    function switchView(viewName, updateUrl = true) {
      if (viewName && viewName.startsWith("stock_")) {
        currentStockKey = viewName;
        currentView = "overview5";
      } else if (["dram", "rates", "overview5", "factcheck"].includes(viewName)) {
        currentView = viewName;
      } else {
        currentView = "dram";
      }

      recomputeAllDynamicMetrics();

      const titleEl = document.getElementById("headerTitle");
      if (titleEl) titleEl.textContent = viewTitles[currentView] || "반도체 리서치 리포트";

      const container = document.getElementById("viewContainer");
      if (currentView === "dram") container.innerHTML = renderDramView();
      else if (currentView === "rates") container.innerHTML = renderRatesView();
      else if (currentView === "overview5") container.innerHTML = renderOverview5View();
      else if (currentView === "factcheck") container.innerHTML = renderFactCheckView();

      document.querySelectorAll(".nav-tab").forEach(tab => tab.classList.remove("active"));
      document.getElementById("tab-" + currentView)?.classList.add("active");

      document.querySelectorAll(".dock-btn").forEach(btn => btn.classList.remove("active"));
      document.getElementById("dock-" + currentView)?.classList.add("active");

      window.scrollTo({ top: 0, behavior: "smooth" });

      if (updateUrl && window.history && window.history.replaceState) {
        const url = new URL(window.location.href);
        url.searchParams.set("view", currentView);
        window.history.replaceState({}, "", url.toString());
      }
    }

    window.selectDramKey = function(key) {
      currentDramKey = key;
      recomputeAllDynamicMetrics();
      const container = document.getElementById("viewContainer");
      if (container) container.innerHTML = renderRatesView();
    };

    window.selectStockKey = function(key) {
      currentStockKey = key;
      currentView = "overview5";
      recomputeAllDynamicMetrics();
      const container = document.getElementById("viewContainer");
      if (container) container.innerHTML = renderOverview5View();
      document.querySelectorAll(".nav-tab").forEach(tab => tab.classList.remove("active"));
      document.getElementById("tab-overview5")?.classList.add("active");
      document.querySelectorAll(".dock-btn").forEach(btn => btn.classList.remove("active"));
      document.getElementById("dock-overview5")?.classList.add("active");
      const detailEl = document.getElementById("stockDetailCard");
      if (detailEl) detailEl.scrollIntoView({ behavior: "smooth", block: "start" });
    };

    window.toggleDark = function() {
      const isDark = document.documentElement.classList.toggle("dark");
      const btn = document.getElementById("darkBtn");
      if (btn) btn.textContent = isDark ? "라이트" : "다크";
    };

    function applyRichStockDetail(stockKey, detail, rawPriceFallback, rawHighFallback) {
      const item = stockData[stockKey];
      if (!item) return;
      if (detail && typeof detail === "object") {
        if (typeof detail.price === "number" && detail.price > 0) item.rawCurr = detail.price;
        if (typeof detail.change_pct === "number") item.changePct = detail.change_pct;
        if (typeof detail.week_change_pct === "number") item.weekChangePct = detail.week_change_pct;
        if (typeof detail.high52w === "number" && detail.high52w > 0) {
          item.high52w = item.unit === "만" ? +(detail.high52w / 10000).toFixed(2) : +detail.high52w.toFixed(2);
        }
        if (typeof detail.low52w === "number" && detail.low52w > 0) {
          item.low52w = item.unit === "만" ? +(detail.low52w / 10000).toFixed(2) : +detail.low52w.toFixed(2);
        }
        if (Array.isArray(detail.recent_closes) && detail.recent_closes.length >= 4) {
          item.recentClosesRaw = detail.recent_closes;
        }
        if (Array.isArray(detail.recent_dates) && detail.recent_dates.length >= 4) {
          item.recentDates = detail.recent_dates;
        }
      } else {
        if (typeof rawPriceFallback === "number" && rawPriceFallback > 0) {
          item.rawCurr = rawPriceFallback;
        }
        if (typeof rawHighFallback === "number" && rawHighFallback > 0) {
          item.high52w = item.unit === "만" ? +(rawHighFallback / 10000).toFixed(2) : +rawHighFallback.toFixed(2);
        }
      }
    }

    function applyLivePayload(data) {
      if (!data || typeof data !== "object") return;

      const sp = data.dram || data.dram_spot;
      if (sp) {
        const keyMap = {
          ddr5_16g: sp.ddr5_16g,
          ddr4_16g: sp.ddr4_16g,
          ddr4_8g: sp.ddr4_8g,
          ddr5_mod: sp.ddr5_mod || sp.ddr5_16gb_module
        };
        Object.entries(keyMap).forEach(([k, item]) => {
          if (item && item.price) {
            const p = Number(Number(item.price).toFixed(2));
            dramSeries[k].price = p;
            dramSeries[k].pts[4] = p;
            if (item.change) dramSeries[k].change = item.change;
          }
        });
      }

      const mc = data.macro || {};
      if (mc.kospi) liveMacro.kospi = Number(mc.kospi);
      if (mc.kospi_change_pct !== undefined) liveMacro.kospiChg = Number(mc.kospi_change_pct);
      if (mc.kosdaq) liveMacro.kosdaq = Number(mc.kosdaq);
      if (mc.sox) liveMacro.sox = Number(mc.sox);
      if (mc.sox_change_pct !== undefined) liveMacro.soxChg = Number(mc.sox_change_pct);
      if (mc.nasdaq) liveMacro.nasdaq = Number(mc.nasdaq);
      if (mc.nasdaq_change_pct !== undefined) liveMacro.nasdaqChg = Number(mc.nasdaq_change_pct);
      if (mc.vix) liveMacro.vix = Number(mc.vix);
      if (mc.vix_change_pct !== undefined) liveMacro.vixChg = Number(mc.vix_change_pct);
      if (mc.us10y || data.us10y) liveMacro.us10y = Number(mc.us10y || data.us10y);
      if (mc.us10y_change_pct !== undefined) liveMacro.us10yChg = Number(mc.us10y_change_pct);
      if (Array.isArray(mc.us10y_recent) && mc.us10y_recent.length >= 4) liveMacro.us10yRecent = mc.us10y_recent;
      if (Array.isArray(mc.us10y_dates) && mc.us10y_dates.length >= 4) liveMacro.us10yDates = mc.us10y_dates;
      if (mc.tlt_price || data.tlt_price) liveMacro.tlt = Number(mc.tlt_price || data.tlt_price);
      if (mc.wti_oil || data.wti_oil) liveMacro.wtiOil = Number(mc.wti_oil || data.wti_oil);
      if (mc.usdkrw || data.usdkrw) liveMacro.usdkrw = Number(mc.usdkrw || data.usdkrw);

      const st = data.stocks || {};
      const h52 = data.high52w || {};
      const dt = data.stocks_detail || {};
      if (dt.NVDA && dt.NVDA.price) {
        liveMacro.nvda = Number(dt.NVDA.price);
        liveMacro.nvdaChg = Number(dt.NVDA.change_pct || 0);
      }

      const mapSym = {
        "005935.KS": "stock_005935",
        "005930.KS": "stock_005930",
        "353200.KS": "stock_353200",
        "240810.KQ": "stock_240810",
        "AMD": "stock_AMD",
        "CLS": "stock_CLS"
      };
      Object.entries(mapSym).forEach(([sym, sKey]) => {
        if (dt[sym] || st[sym]) {
          applyRichStockDetail(sKey, dt[sym], Number(st[sym]), Number(h52[sym]));
        }
      });

      if (data.live_news && typeof data.live_news === "object") {
        if (data.live_news.updated_at) liveNews.updatedAt = data.live_news.updated_at;
        if (Array.isArray(data.live_news.sector) && data.live_news.sector.length > 0) {
          liveNews.sector = data.live_news.sector;
        }
        if (data.live_news.stocks && typeof data.live_news.stocks === "object") {
          Object.entries(data.live_news.stocks).forEach(([sym, arr]) => {
            if (Array.isArray(arr) && arr.length > 0) {
              liveNews.stocks[sym] = arr;
            }
          });
        }
      }

      recomputeAllDynamicMetrics();
    }

    function getRealtimeMarketStatusText() {
      const now = new Date();
      const wd = now.getDay();
      const hm = now.getHours() * 60 + now.getMinutes();
      const daysKr = ["일", "월", "화", "수", "목", "금", "토"];
      const wdKr = daysKr[wd];
      if (wd === 0 || wd === 6) return `주말(${wdKr}) · 직전 거래일 종가 반영`;
      if (hm >= 9 * 60 && hm < 15 * 60 + 30) return `평일(${wdKr}) 국내 정규장 실시간`;
      return `평일(${wdKr}) 글로벌 시세 실시간 연동`;
    }

    function formatNowKstFull() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      return `${y}.${m}.${d} ${hh}:${mm}:${ss}`;
    }

    function formatNowKstShort() {
      const now = new Date();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      return `${m}/${d} ${hh}:${mm}:${ss}`;
    }

    function updateLiveClock() {
      const tEl = document.getElementById("liveTimeText");
      if (tEl) {
        tEl.innerHTML = `<span style="color:var(--safe-green); font-weight:700;">LIVE</span> ${formatNowKstFull()} · ${getRealtimeMarketStatusText()}`;
      }
      const cdEl = document.getElementById("nextRefreshCountdown");
      if (cdEl) {
        countdownSec = countdownSec > 1 ? countdownSec - 1 : 30;
        cdEl.textContent = `자동갱신 ${countdownSec}초`;
      }
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 3500) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: ctrl.signal });
      } finally {
        clearTimeout(id);
      }
    }

    async function fetchDirectBrowserYahooQuotes() {
      const syms = [
        "005935.KS", "005930.KS", "353200.KS", "240810.KQ", "AMD", "CLS",
        "^KS11", "^SOX", "^VIX", "NVDA", "^TNX", "CL=F", "KRW=X", "TLT"
      ];
      const mapSym = {
        "005935.KS": "stock_005935",
        "005930.KS": "stock_005930",
        "353200.KS": "stock_353200",
        "240810.KQ": "stock_240810",
        "AMD": "stock_AMD",
        "CLS": "stock_CLS"
      };
      let updatedCount = 0;

      await Promise.all(syms.map(async (sym) => {
        const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=10d&_=${Date.now()}`;
        const proxyUrls = [
          `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
          `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
          `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
        ];
        for (const pUrl of proxyUrls) {
          try {
            const r = await fetchWithTimeout(pUrl, { cache: "no-store" }, 3500);
            if (!r.ok) continue;
            const j = await r.json();
            const res = j?.chart?.result?.[0];
            if (!res) continue;
            const meta = res.meta || {};
            const tsList = res.timestamp || [];
            const closesRaw = res.indicators?.quote?.[0]?.close || [];
            const isKrw = sym.endsWith(".KS") || sym.endsWith(".KQ");

            const pairs = [];
            for (let i = 0; i < tsList.length; i++) {
              const c = closesRaw[i];
              if (typeof c === "number" && c > 0) {
                const dt = new Date((tsList[i] + 9 * 3600) * 1000);
                pairs.push([`${dt.getUTCMonth() + 1}/${dt.getUTCDate()}`, isKrw ? Math.round(c) : Number(c.toFixed(2))]);
              }
            }
            const p = typeof meta.regularMarketPrice === "number"
              ? (isKrw ? Math.round(meta.regularMarketPrice) : Number(meta.regularMarketPrice.toFixed(2)))
              : (pairs.length ? pairs[pairs.length - 1][1] : null);
            if (!p) continue;

            if (pairs.length) pairs[pairs.length - 1][1] = p;
            const recent = pairs.slice(-5);
            const rDates = recent.map(x => x[0]);
            const rCloses = recent.map(x => x[1]);
            const prev = rCloses.length >= 2 ? rCloses[rCloses.length - 2] : (meta.chartPreviousClose || p);
            const chgPct = prev ? Number((((p - prev) / prev) * 100).toFixed(2)) : 0;
            const wkBase = rCloses.length ? rCloses[0] : prev;
            const wkPct = wkBase ? Number((((p - wkBase) / wkBase) * 100).toFixed(2)) : 0;

            if (mapSym[sym]) {
              applyRichStockDetail(mapSym[sym], {
                price: p,
                prev_close: prev,
                change_pct: chgPct,
                week_change_pct: wkPct,
                high52w: meta.fiftyTwoWeekHigh,
                low52w: meta.fiftyTwoWeekLow,
                recent_dates: rDates,
                recent_closes: rCloses
              });
              updatedCount++;
            } else if (sym === "^KS11") {
              liveMacro.kospi = Number(p.toFixed(2));
              liveMacro.kospiChg = chgPct;
              updatedCount++;
            } else if (sym === "^SOX") {
              liveMacro.sox = Number(p.toFixed(2));
              liveMacro.soxChg = chgPct;
              updatedCount++;
            } else if (sym === "^VIX") {
              liveMacro.vix = Number(p.toFixed(2));
              liveMacro.vixChg = chgPct;
              updatedCount++;
            } else if (sym === "NVDA") {
              liveMacro.nvda = Number(p.toFixed(2));
              liveMacro.nvdaChg = chgPct;
              updatedCount++;
            } else if (sym === "^TNX") {
              liveMacro.us10y = Number(p.toFixed(2));
              liveMacro.us10yChg = chgPct;
              if (rCloses.length >= 4) liveMacro.us10yRecent = rCloses;
              if (rDates.length >= 4) liveMacro.us10yDates = rDates;
              updatedCount++;
            } else if (sym === "CL=F") {
              liveMacro.wtiOil = Number(p.toFixed(2));
              liveMacro.wtiChg = chgPct;
              updatedCount++;
            } else if (sym === "KRW=X") {
              liveMacro.usdkrw = Number(p.toFixed(1));
              liveMacro.usdkrwChg = chgPct;
              updatedCount++;
            } else if (sym === "TLT") {
              liveMacro.tlt = Number(p.toFixed(2));
              liveMacro.tltChg = chgPct;
              updatedCount++;
            }
            break;
          } catch (_) {}
        }
      }));
      return updatedCount;
    }

    async function refreshLivePrices(manual = false) {
      const btn = document.getElementById("refreshBtn");
      const badgeEl = document.getElementById("syncSourceBadge");
      if (btn && manual) {
        btn.textContent = "갱신중...";
        btn.disabled = true;
      }

      countdownSec = 30;
      let payload = null;

      const urlsToTry = [
        `data/latest_briefing.json?t=${Date.now()}`,
        `https://raw.githubusercontent.com/dnrzoqs-byte/memory-briefing/main/data/latest_briefing.json?t=${Date.now()}`,
        `https://cdn.jsdelivr.net/gh/dnrzoqs-byte/memory-briefing@main/data/latest_briefing.json?t=${Date.now()}`
      ];
      if (!location.hostname.endsWith("github.io")) {
        urlsToTry.unshift(`/api/briefing?t=${Date.now()}`);
      }

      for (const u of urlsToTry) {
        try {
          const r = await fetchWithTimeout(u, { cache: "no-store" }, 2800);
          if (r.ok) {
            const candidate = await r.json();
            if (candidate && (candidate.stocks || candidate.dram || candidate.dram_spot)) {
              payload = candidate;
              break;
            }
          }
        } catch (_) {}
      }

      if (payload) applyLivePayload(payload);

      let directCount = 0;
      if (manual) {
        try {
          directCount = await fetchDirectBrowserYahooQuotes();
        } catch (_) {}
      }

      recomputeAllDynamicMetrics();
      const container = document.getElementById("viewContainer");
      if (currentView === "dram") container.innerHTML = renderDramView();
      else if (currentView === "rates") container.innerHTML = renderRatesView();
      else if (currentView === "overview5") container.innerHTML = renderOverview5View();
      else if (currentView === "factcheck") container.innerHTML = renderFactCheckView();
      updateLiveClock();

      const stampEl = document.getElementById("lastDataStamp");
      const curTime = formatNowKstShort();
      if (stampEl) stampEl.textContent = `${curTime} 최신 동기화 완료`;

      if (badgeEl) {
        badgeEl.textContent = directCount > 0 ? `거래소 직결 (${directCount}개)` : "Claude Opus × TDS 리서치 엔진";
      }

      if (manual) {
        showToast(`최신 동기화 완료 · 삼전우 탐색 ${stockData.stock_005935.splitPlan.wExplore}% · AMD 정찰 ${stockData.stock_AMD.splitPlan.wExplore}%`);
      }

      if (btn && manual) {
        btn.textContent = "갱신 완료";
        btn.disabled = false;
        setTimeout(() => { btn.textContent = "실시간 갱신"; }, 1200);
      }
    }

    (function initImmediate() {
      if (window.__INITIAL_BRIEFING_PAYLOAD__) {
        applyLivePayload(window.__INITIAL_BRIEFING_PAYLOAD__);
      }
      recomputeAllDynamicMetrics();
      const params = new URLSearchParams(window.location.search);
      switchView(params.get("view") || "dram", false);
      updateLiveClock();
      setInterval(updateLiveClock, 1000);
      setTimeout(() => { refreshLivePrices(false); }, 50);
      setInterval(() => {
        if (!document.hidden) refreshLivePrices(false);
      }, 30000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshLivePrices(false);
      });
    })();
  </script>
