/*__EMBEDDED_RESEARCH_START__*/window.__RESEARCH__ = {"version":6,"as_of":"2026-11-26","as_of_label":"2026년 11월 26일 아침 기준(11/25 국내 마감, 미국 11/25 마감 반영)","note":"공시와 보도로 확인한 사실, 기관의 전망, 이 페이지의 판단을 나눠 표시합니다. 종목별 판단은 매일 변수로 다시 계산하는 규칙 판단이며, 주문과 책임은 본인에게 있습니다.","stance":{"label":"보유 유지, 추가는 일정을 넘긴 뒤","headline":"6종목은 결국 한 질문에 묶여 있습니다. ==빅테크가 2027년에도 AI 투자를 늘리는가==. 답이 나오는 1월 말까지는 날마다 변수를 보고 정한 가격에서만 움직입니다.","points":[{"k":"fact","t":"11월 25일 코스피가 6.16% 내린 4,697.51로 마감했습니다. 삼성전자 -9.87%, SK하이닉스 -11.05%이고, 외국인이 유가증권시장에서 1.9조 원을 순매도했습니다. 장 초반 매도 사이드카가 발동됐습니다. ==전날 6.3% 오른 몫을 하루 만에 모두 돌려줬습니다==.","src":["etoday_1125","news1_1125"]},{"k":"report","t":"보도는 전날 밤 미국 반도체지수 -7.88%, AI 투자 수익성과 추가 관세 우려, 메모리 공급 과잉 우려를 이유로 들었습니다. 삼성전자와 SK하이닉스의 공매도도 크게 늘었습니다.","src":["etoday_1125","news1_1125"]},{"k":"fact","t":"삼성전자 3분기 영업이익 107.4조, SK하이닉스 83.3조로 분기 사상 최대입니다. 11월 1~20일 반도체 수출은 1년 전보다 294% 늘었습니다. ==이익은 최대인데 주가는 고점의 절반 안팎==인 장입니다.","src":["sec_q3","hynix_q3","export_1120"]},{"k":"forecast","t":"증권사 평균 전망은 삼성전자 4분기 영업이익을 129조로, 3분기보다 더 늘어난다고 봅니다. 반면 범용 D램 계약가 상승률은 내년 하반기 0~5%로 줄고 2028년 중반 하락 전환이 거론됩니다.","src":["cns_sec","tf_4q","tf_roadshow"]},{"k":"view","t":"시장은 이익이 꺾이는 때를 먼저 가격에 넣고 있습니다. 남은 질문은 실제 하강이 그보다 깊으냐이고, 답은 월말 D램 계약가, 12/18 마이크론 실적, 1월 말 빅테크 투자 계획에서 나옵니다. 그 전까지는 ==한 번에 사지 않고 정한 가격에서 나눠 사는 것==이 원칙입니다."}],"do":["==12월 31일까지 삼성전자우를 보유==해 4분기 배당 권리를 챙깁니다.","남은 현금은 세 번 이상 나누고, 가격이 아니라 조건이 맞을 때 씁니다. 첫 조건은 ==12월 10일 FOMC 통과==, 다음은 1월 초 삼성전자 잠정실적, 마지막은 1월 말 빅테크 투자 계획입니다.","AMD와 셀레스티카는 원화 강세에 따른 환차손을 함께 계산합니다."],"dont":["신용이나 미수 같은 레버리지는 쓰지 않습니다. 반도체지수가 하루 10% 넘게 움직인 날이 이번 달에만 여러 번입니다(11/5, 11/20, 11/23).","급등한 날 따라 사거나 급락한 날 던지지 않습니다. 이런 장에서는 하루의 움직임이 다음 날 쉽게 뒤집힙니다.","증권사 목표가를 매도 기준으로 그대로 쓰지 않습니다. 같은 회사 목표가가 2주 사이 30~40% 바뀌었습니다."],"kakao":"6종목 모두 빅테크 AI 투자에 묶여 있음. 보유 유지, 추가는 FOMC와 1월 실적 확인 뒤 나눠서. 레버리지 금지."},"scenarios":[{"id":"bull","name":"강세","cond":"빅테크 2027년 투자 25% 이상 증가 확인, HBM4 가격 기가비트당 3달러 이상 확정, 연준 인상이 한 번으로 끝남","result":"메모리 이익이 2027년 내내 늘고 2028년 하락 우려가 뒤로 밀리며 재평가","watch":"1월 말~2월 초 빅테크 실적, 12/10 FOMC 점도표"},{"id":"base","name":"기본","cond":"빅테크 투자 15~25% 증가, 계약가 상승률이 전망 경로대로 둔화","result":"실적은 좋지만 주가는 넓은 박스권. ==배당과 자사주가 아래를 받침==","watch":"월말 계약가, 12/1 수출, 삼성 1월 말 이사회","weight":true},{"id":"bear","name":"약세","cond":"빅테크 투자 동결이나 감소, 엔비디아 회계 조사 확대, 연준 50bp 인상","result":"==현물가가 먼저 꺾이고== 계약가 전망이 내려가며 주가 추가 하락","watch":"DDR5 현물 4주 변화, 하이일드 채권, 엔비디아 고객사 발언"}],"events":[{"d":"11/25","k":"fact","title":"코스피 -6.16%, 외국인 1.9조 순매도","body":"삼성전자 -9.87%, SK하이닉스 -11.05%로 전날 상승분을 모두 반납했습니다. 보도는 미국 반도체 급락, AI 투자 수익성과 관세 우려, 메모리 공급 과잉 우려를 이유로 들었습니다.","src":["etoday_1125","news1_1125"]},{"d":"11/24","k":"fact","title":"미국 반도체주 반락, 엔비디아 의회 조사 우려","body":"전날 급등 뒤 미국 장중 엔비디아 7%대, AMD와 마이크론은 10% 안팎 내렸습니다. 보도는 엔비디아를 둘러싼 의회 조사 우려를 이유로 들었습니다. 장 마감 수치는 시세 화면에서 확인합니다.","src":["chips_1124","amd_1124"]},{"d":"11/24","k":"fact","title":"코스피 +6.32%, 5,006.03","body":"삼성전자 +6.7%, SK하이닉스 +6.7%, 원익IPS +9.1%, 대덕전자 +5.1%. 젠슨 황 복귀와 전날 미국 반도체 급등이 반영됐습니다. 저녁 시간외 거래에서 삼성전자는 다시 3%대 내렸습니다."},{"d":"11/23","k":"fact","title":"엔비디아, 젠슨 황 CEO 복귀 결정","body":"이사회가 만장일치로 사임 11일 만의 복귀를 결정했습니다. 미국 장 초반 엔비디아는 27~30% 올랐고 반도체주가 함께 반등했습니다(장중 보도 기준). 경영 공백 우려는 줄었지만 SEC 회계 조사 보도는 아직 정리되지 않았습니다.","src":["nvda_back","nvda_back2"]},{"d":"11/23","k":"fact","title":"11월 1~20일 수출 774억 달러, 반도체 385억 달러","body":"전체 수출은 1년 전보다 101.5%, 반도체는 294.4% 늘었습니다. 반도체 비중은 49.7%입니다. 올해 누적 수출은 처음으로 1조 달러를 넘었습니다.","src":["export_1120"]},{"d":"11/22","k":"fact","title":"골드만삭스, 삼성전자·SK하이닉스 목표가 하향","body":"삼성전자 50만→35만 원, SK하이닉스 350만→200만 원. 매수 의견은 유지했습니다. 2028년 범용 D램 가격 전망을 -5%에서 -19%로 낮췄고, HBM 시장은 2027년 2,000억 달러로 올려 잡았습니다.","src":["gs_cut","gs_cut2"]},{"d":"11/20","k":"fact","title":"엔비디아 회계 조사 보도, SOX 하루 -10.73%","body":"로이터가 미 증권거래위원회(SEC)의 엔비디아 회계 조사를 보도했습니다. 조사 범위는 알려지지 않았습니다. 엔비디아는 약 14% 내려 52주 신저가를 기록했고, SOX는 8,408.59로 6월 고점 대비 42.5% 하락했습니다.","src":["nvda_sec","sox_bears"]},{"d":"11/20","k":"fact","title":"코스피 -5.21%, 4,869.96","body":"삼성전자 -7.01%, SK하이닉스 -5.92%. 6월 고점 이후 하락률은 44%라는 로이터 인용 보도가 있습니다.","src":["kospi
