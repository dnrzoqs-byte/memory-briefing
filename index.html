<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>반도체 4대 팩트 &amp; 매수·매도 밸류 터미널 (Claude Opus × TDS)</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <style>
    /* =====================================================================
       Toss Design System (TDS) × Claude Opus 안드로이드 모바일 최적화 (v10.5)
       1. 안드로이드 폰트 부스팅 방지: -webkit-text-size-adjust: 100%
       2. 360px~412px(갤럭시 S/폴드) 기준 버튼 오버플로우 원천 차단 (min-width: 0)
       3. 모든 터치 버튼 40~48dp 규격 및 네이티브 터치 피드백(scale 0.97) 적용
       4. 어절 보존(word-break: keep-all) + 수치 줄바꿈 방지(.num)
       ===================================================================== */
    :root {
      --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", Roboto, system-ui, sans-serif;
      --tracking-display: -0.025em;
      --tracking-title: -0.02em;
      --tracking-body: -0.01em;
      --tracking-caption: 0.005em;

      /* 세련된 쿨 슬레이트 & 딥 인크 컬러 시스템 */
      --bg-page: #F3F5F8;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --bg-elevated: #EEF2F6;
      --bg-accent: #EFF4FF;

      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #8492A6;

      --border-color: #E2E8F0;
      --border-subtle: #F1F5F9;

      /* 채도를 정제한 프라이빗 뱅킹 시맨틱 컬러 */
      --up-red: #E11D48;
      --up-red-soft: rgba(225, 29, 72, 0.07);
      --down-blue: #2563EB;
      --down-blue-soft: rgba(37, 99, 235, 0.08);
      --safe-green: #0D9488;
      --safe-green-soft: rgba(13, 148, 136, 0.08);
      --warn-amber: #B45309;
      --warn-amber-soft: rgba(180, 83, 9, 0.08);
      --purple-accent: #4F46E5;
      --purple-soft: rgba(79, 70, 229, 0.08);
      --brand-ink: #1E293B;

      --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.03), 0 12px 32px -12px rgba(15, 23, 42, 0.06);
    }

    html.dark {
      --bg-page: #0B0F17;
      --bg-surface: #131A26;
      --bg-subtle: #1B2434;
      --bg-elevated: #243044;
      --bg-accent: #1B2C4E;

      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #7E8C9F;

      --border-color: #232E42;
      --border-subtle: #1A2333;

      --up-red: #FB7185;
      --up-red-soft: rgba(251, 113, 133, 0.14);
      --down-blue: #60A5FA;
      --down-blue-soft: rgba(96, 165, 250, 0.15);
      --safe-green: #2DD4BF;
      --safe-green-soft: rgba(45, 212, 191, 0.14);
      --warn-amber: #FBBF24;
      --warn-amber-soft: rgba(251, 191, 36, 0.14);
      --purple-accent: #818CF8;
      --purple-soft: rgba(129, 140, 248, 0.15);
      --brand-ink: #3B82F6;

      --shadow-card: 0 8px 28px rgba(0, 0, 0, 0.5);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      word-break: keep-all;
      line-break: strict;
      overflow-wrap: break-word;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.56;
      letter-spacing: var(--tracking-body);
      font-weight: 400;
    }

    button {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: none;
      font-family: inherit;
      color: inherit;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* 숫자·단위 전용 클래스: 중간 줄바꿈 금지 + 세로 자릿수 정렬 */
    .num, .tnum {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      letter-spacing: -0.005em;
    }

    .nowrap {
      white-space: nowrap;
    }

    .app-shell {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 84px;
      overflow-x: hidden;
    }

    /* =====================================================================
       상단 고정 헤더 (안드로이드 360px 화면에서 버튼 찌그러짐 완전 방지)
       ===================================================================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
    }

    html.dark .app-header {
      background-color: rgba(23, 26, 33, 0.95);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 8px;
      gap: 10px;
    }

    .header-left {
      min-width: 0;
      flex: 1;
    }

    .header-eyebrow {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--safe-green);
      display: inline-block;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: var(--tracking-display);
      line-height: 1.28;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-refresh {
      height: 34px;
      padding: 0 13px;
      border-radius: 10px;
      background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    html.dark .btn-refresh {
      background: linear-gradient(180deg, #3B82F6 0%, #2563EB 100%);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    .btn-refresh:active {
      transform: scale(0.96);
      opacity: 0.88;
    }

    .btn-dark {
      height: 34px;
      padding: 0 10px;
      border-radius: 10px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      flex-shrink: 0;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }

    .btn-dark:active {
      transform: scale(0.96);
      background-color: var(--bg-elevated);
    }

    .sync-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 16px 8px;
      font-size: 11px;
      color: var(--text-muted);
      gap: 8px;
    }

    .sync-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
      overflow: hidden;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 10.5px;
      background-color: var(--bg-accent);
      color: var(--down-blue);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* =====================================================================
       상단 네비게이션 탭 (4글자 축약 라벨로 320~360px 안드로이드 완벽 대응)
       ===================================================================== */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      padding: 0 8px;
      background-color: var(--bg-surface);
    }

    .nav-tab {
      height: 42px;
      padding: 0 2px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 2.5px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
      letter-spacing: -0.015em;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .nav-tab.active {
      color: var(--text-primary);
      border-bottom-color: var(--text-primary);
      font-weight: 800;
    }

    /* =====================================================================
       하단 고정 독 (안드로이드 네이티브 바텀 탭 규격)
       ===================================================================== */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      background-color: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      z-index: 60;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    }

    html.dark .bottom-dock {
      background-color: rgba(23, 26, 33, 0.97);
    }

    .dock-btn {
      min-height: 46px;
      padding: 4px 2px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      white-space: nowrap;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }

    .dock-btn:active {
      transform: scale(0.95);
      background-color: var(--bg-subtle);
    }

    .dock-btn.active {
      color: var(--down-blue);
      font-weight: 800;
    }

    .dock-icon { font-size: 16px; line-height: 1; }
    .dock-label { font-size: 11px; font-weight: 700; letter-spacing: -0.01em; }

    /* 본문 영역 */
    .view-body {
      flex: 1;
      padding: 14px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 섹션 헤더 */
    .section-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 2px 4px 0;
      gap: 6px;
    }

    .section-head-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 21px;
      padding: 0 8px;
      border-radius: 6px;
      background-color: var(--brand-ink);
      color: #FFFFFF;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: var(--tracking-title);
      color: var(--text-primary);
    }

    .section-source {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: var(--tracking-caption);
      white-space: nowrap;
    }

    /* 카드 공통 */
    .tds-card {
      background-color: var(--bg-surface);
      border: 1px solid rgba(15, 23, 42, 0.04);
      border-radius: 20px;
      padding: 18px 16px;
      box-shadow: var(--shadow-card);
    }

    html.dark .tds-card {
      border-color: rgba(255, 255, 255, 0.05);
    }

    .card-headline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: var(--tracking-title);
      line-height: 1.38;
    }

    .card-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 3px;
      line-height: 1.45;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      padding: 0 9px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* =====================================================================
       실시간 6대 지표 그리드 (2×3 배치 · 안드로이드 360px 폭 완벽 최적화)
       ===================================================================== */
    .macro-grid-2x3 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .macro-tile {
      background-color: var(--bg-subtle);
      border-radius: 14px;
      padding: 12px 13px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .mt-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      min-width: 0;
    }

    .mt-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mt-chg {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .mt-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.22;
      margin-top: 2px;
    }

    .mt-fact {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 4대 팩트 요약 행 */
    .fact-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .fact-row {
      background-color: var(--bg-subtle);
      border-radius: 14px;
      padding: 14px 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .fact-row-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    .fact-axis {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .fact-src-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      background-color: var(--bg-surface);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .fact-body {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.56;
      text-align: left;
    }

    .fact-body strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    /* =====================================================================
       6종목 한눈 요약 카드 리스트 (터치 반응형)
       ===================================================================== */
    .stock-summary-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stock-summary-item {
      background-color: var(--bg-subtle);
      border-radius: 16px;
      padding: 15px;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }

    .stock-summary-item:active {
      transform: scale(0.985);
      background-color: var(--bg-elevated);
    }

    .ssi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .ssi-name-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .ssi-name {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .ssi-percentile {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background-color: var(--bg-accent);
      color: var(--down-blue);
      white-space: nowrap;
    }

    .ssi-price-wrap {
      text-align: right;
      flex-shrink: 0;
    }

    .ssi-price {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .ssi-chg {
      font-size: 12px;
      font-weight: 700;
      margin-left: 4px;
    }

    /* 10년 바닥 ↔ 현재가 ↔ 3차 매도가 스펙트럼 게이지 바 (절제된 모노크롬 트랙 + 딥 인디고 그라데이션) */
    .spectrum-wrap {
      margin: 8px 0 10px;
    }

    .spectrum-track {
      position: relative;
      height: 7px;
      border-radius: 999px;
      background-color: var(--bg-elevated);
      margin: 6px 0;
    }

    .spectrum-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #0D9488 0%, #2563EB 100%);
    }

    .spectrum-dot {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: var(--down-blue);
      border: 3px solid var(--bg-surface);
      box-shadow: 0 1px 5px rgba(37, 99, 235, 0.45);
      transform: translate(-50%, -50%);
    }

    .spectrum-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* 매수구간 · 1차매도 · 2차매도 · 3차매도 (모바일에서도 절대 안 깨지는 2×2 서피스 박스 그리드) */
    .target-strip-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }

    .ts-box {
      background-color: var(--bg-surface);
      border-radius: 11px;
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .ts-box-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .ts-lbl {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .ts-sub {
      font-size: 10.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .ts-val {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 1px;
    }

    /* =====================================================================
       서브 탭 세그먼트 버튼 (6종목 선택 / DRAM 4품목 선택 — 토스 네이티브 알약 버튼)
       ===================================================================== */
    .seg-grid-3x2 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      background-color: var(--bg-subtle);
      padding: 6px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .seg-grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      background-color: var(--bg-subtle);
      padding: 6px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    .seg-btn {
      min-height: 40px;
      padding: 6px 4px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
      min-width: 0;
      width: 100%;
      transition: transform 0.12s ease, background-color 0.12s ease, box-shadow 0.12s ease;
    }

    .seg-btn:active {
      transform: scale(0.96);
    }

    .seg-btn.active {
      background-color: var(--bg-surface);
      color: var(--down-blue);
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    /* 종목 상세 헤더 */
    .stock-detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 14px;
    }

    .sd-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: var(--tracking-display);
      color: var(--text-primary);
    }

    .sd-code {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 5px;
    }

    .sd-price-box {
      text-align: right;
      flex-shrink: 0;
    }

    .sd-price {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    /* 매수·매도·손절 정밀 박스 */
    .trade-plan-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 14px 0;
    }

    .plan-box {
      background-color: var(--bg-subtle);
      border-radius: 16px;
      padding: 15px;
    }

    .plan-box-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 10px;
      gap: 6px;
    }

    .plan-box-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .plan-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .plan-row {
      background-color: var(--bg-surface);
      border-radius: 12px;
      padding: 12px 13px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .plan-row.highlight-buy {
      box-shadow: inset 0 0 0 1.5px var(--safe-green);
    }

    .plan-row.highlight-sell {
      box-shadow: inset 0 0 0 1.5px var(--down-blue);
    }

    .pr-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pr-stage {
      font-size: 12.5px;
      font-weight: 800;
      white-space: nowrap;
    }

    .pr-price {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
      text-align: right;
    }

    .pr-desc {
      font-size: 12px;
      font-weight: 450;
      color: var(--text-secondary);
      line-height: 1.52;
    }

    .pr-desc strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    /* 차트 영역 */
    .chart-box {
      background-color: var(--bg-subtle);
      border-radius: 16px;
      padding: 13px 10px 8px;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      padding: 0 4px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .svg-chart {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 장기 사이클 로드맵 타임라인 */
    .roadmap-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .roadmap-card {
      background-color: var(--bg-subtle);
      border-radius: 15px;
      padding: 14px 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .roadmap-card.active-q {
      background-color: var(--bg-accent);
      box-shadow: inset 0 0 0 1.5px var(--down-blue);
    }

    .rm-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    .rm-q {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .rm-action-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .rm-body {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .rm-body strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    /* =====================================================================
       종목 간 이동 & 하단 탭 이동 버튼 (안드로이드 48dp 대칭형 캡슐 버튼)
       ===================================================================== */
    .dual-nav-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .nav-action-btn {
      min-height: 46px;
      padding: 0 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 750;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-width: 0;
      width: 100%;
      background-color: var(--bg-subtle);
      color: var(--text-primary);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .nav-action-btn:active {
      transform: scale(0.97);
    }

    .nav-action-btn.surface-card {
      background-color: var(--bg-surface);
      box-shadow: var(--shadow-card);
    }

    .nav-action-btn.primary {
      background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    html.dark .nav-action-btn.primary {
      background: linear-gradient(180deg, #3B82F6 0%, #2563EB 100%);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .nav-action-btn.accent-soft {
      background-color: var(--bg-accent);
      color: var(--down-blue);
    }

    .nav-btn-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-toast {
      position: fixed;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: rgba(25, 31, 40, 0.94);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>

    function renderLineSvg(pts, labels, forecastStartIdx, unitPrefix = "$", unitSuffix = "") {
      const w = 460, h = 152, padX = 34, topY = 26, botY = 116;
      const minV = Math.min(...pts) * 0.90;
      const maxV = Math.max(...pts) * 1.08;
      const range = maxV - minV || 1;
      const stepX = (w - padX * 2) / (pts.length - 1);

      const coords = pts.map((v, i) => ({
        x: padX + i * stepX,
        y: botY - ((v - minV) / range) * (botY - topY),
        v,
        label: labels[i] || ""
      }));

      const solidPts = coords.slice(0, forecastStartIdx + 1).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const dashPts = coords.slice(forecastStartIdx).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const areaPts = `${coords[0].x.toFixed(1)},${botY} ` + coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ") + ` ${coords[coords.length - 1].x.toFixed(1)},${botY}`;

      let nodesHtml = "";
      coords.forEach((c, idx) => {
        const isForecast = idx > forecastStartIdx;
        const isCurrent = idx === forecastStartIdx;
        const dotColor = isCurrent ? "var(--up-red)" : (isForecast ? "var(--safe-green)" : "var(--down-blue)");
        const r = isCurrent ? 5 : 3.6;
        const valStr = `${unitPrefix}${Number.isInteger(c.v) ? c.v : c.v.toFixed(1)}${unitSuffix}`;
        const yOffset = idx % 2 === 0 ? -9 : -12;

        nodesHtml += `
          <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${r}" fill="${dotColor}" stroke="var(--bg-surface)" stroke-width="1.6" />

              <div class="macro-tile">
                <div class="mt-top">
                  <span class="mt-label">한국 기준 / 국고 10년</span>
                </div>
                <div class="mt-val num">${liveMacro.krBase.toFixed(2)}% / ${liveMacro.kr10y.toFixed(2)}%</div>
                <div class="mt-fact">신용 담보비율(140%) 유예</div>
              </div>
            </div>

            <div class="chart-box">
              <div class="chart-legend">
                <span>● 파란 실선: 미 10년물 금리 추이 (%)</span>
                <span style="color:var(--safe-green);">● 초록 점선: 연말 안정화 경로</span>
              </div>
              ${renderLineSvg(ratePts, rateDates, 4, "", "%")}
            </div>
          </section>
        </div>

        ${renderBottomTabStepper('factcheck', '팩트·장기뷰', 'dram', '시황·현황')}
      `;
    }

    // =========================================================================
    // 5. 네비게이션 및 실시간 데이터 동기화
    // =========================================================================
    function switchView(viewName, scrollTop = true) {
      currentView = viewName;
      ["dram", "overview5", "factcheck", "rates"].forEach(v => {
        const t = document.getElementById(`tab-${v}`);
        const d = document.getElementById(`dock-${v}`);
        if (t) t.classList.toggle("active", v === viewName);
        if (d) d.classList.toggle("active", v === viewName);
      });

      const container = document.getElementById("viewContainer");
      if (viewName === "dram") container.innerHTML = renderDramView();
      else if (viewName === "overview5") container.innerHTML = renderOverview5View();
      else if (viewName === "factcheck") container.innerHTML = renderFactCheckView();
      else if (viewName === "rates") container.innerHTML = renderRatesView();

      if (scrollTop) window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function selectDramKey(k) {
      currentDramKey = k;
      switchView("rates", false);
    }

    function selectStockKey(k) {
      currentStockKey = k;
      switchView("overview5", false);
      const card = document.getElementById("stockDetailCard");
      if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function toggleDark() {
      const isDark = document.documentElement.classList.toggle("dark");
      const btn = document.getElementById("darkBtn");
      if (btn) btn.textContent = isDark ? "라이트" : "다크";
    }

    function showToast(msg) {
      const t = document.getElementById("liveToast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2600);
    }

    function applyRichStockDetail(sKey, detailObj, fallbackPrice, fallbackHigh52) {
      const target = stockData[sKey];
      if (!target) return;
      const isKrw = target.unit === "만";
      const rawP = (detailObj && Number(detailObj.price) > 0) ? Number(detailObj.price) : Number(fallbackPrice);
      if (rawP > 0) target.rawCurr = rawP;

      if (detailObj) {
        if (typeof detailObj.change_pct === "number") target.changePct = detailObj.change_pct;
        if (typeof detailObj.week_change_pct === "number") target.weekChangePct = detailObj.week_change_pct;
        if (Number(detailObj.high52w) > 0) {
          target.high52w = isKrw ? +(Number(detailObj.high52w) / 10000).toFixed(2) : +Number(detailObj.high52w).toFixed(2);
        }
        if (Array.isArray(detailObj.recent_closes) && detailObj.recent_closes.length >= 4) {
          target.recentClosesRaw = detailObj.recent_closes;
        }
        if (Array.isArray(detailObj.recent_dates) && detailObj.recent_dates.length >= 4) {
          target.recentDates = detailObj.recent_dates;
        }
      } else if (Number(fallbackHigh52) > 0) {
        target.high52w = isKrw ? +(Number(fallbackHigh52) / 10000).toFixed(2) : +Number(fallbackHigh52).toFixed(2);
      }
    }

    function applyLivePayload(data) {
      if (!data || typeof data !== "object") return;

      const dSpot = data.dram || data.dram_spot;
      if (dSpot) {
        const keyMap = {
          ddr5_16g: dSpot.ddr5_16g,
          ddr4_16g: dSpot.ddr4_16g,
          ddr4_8g: dSpot.ddr4_8g,
          ddr5_mod: dSpot.ddr5_mod || dSpot.ddr5_16g_mod
        };
        Object.entries(keyMap).forEach(([k, item]) => {
          if (item && item.price) {
            const p = Number(Number(item.price).toFixed(2));
            dramSeries[k].price = p;
            dramSeries[k].pts[4] = p;
            if (item.change) dramSeries[k].change = item.change;
          }
        });
      }

      const mc = data.macro || {};
      if (mc.kospi) liveMacro.kospi = Number(mc.kospi);
      if (mc.kospi_change_pct !== undefined) liveMacro.kospiChg = Number(mc.kospi_change_pct);
      if (mc.kosdaq) liveMacro.kosdaq = Number(mc.kosdaq);
      if (mc.sox) liveMacro.sox = Number(mc.sox);
      if (mc.sox_change_pct !== undefined) liveMacro.soxChg = Number(mc.sox_change_pct);
      if (mc.nasdaq) liveMacro.nasdaq = Number(mc.nasdaq);
      if (mc.nasdaq_change_pct !== undefined) liveMacro.nasdaqChg = Number(mc.nasdaq_change_pct);
      if (mc.vix) liveMacro.vix = Number(mc.vix);
      if (mc.vix_change_pct !== undefined) liveMacro.vixChg = Number(mc.vix_change_pct);
      if (mc.us10y || data.us10y) liveMacro.us10y = Number(mc.us10y || data.us10y);
      if (mc.us10y_change_pct !== undefined) liveMacro.us10yChg = Number(mc.us10y_change_pct);
      if (Array.isArray(mc.us10y_recent) && mc.us10y_recent.length >= 4) liveMacro.us10yRecent = mc.us10y_recent;
      if (Array.isArray(mc.us10y_dates) && mc.us10y_dates.length >= 4) liveMacro.us10yDates = mc.us10y_dates;
      if (mc.tlt_price || data.tlt_price) liveMacro.tlt = Number(mc.tlt_price || data.tlt_price);
      if (mc.tlt_price_change_pct !== undefined) liveMacro.tltChg = Number(mc.tlt_price_change_pct);
      if (mc.wti_oil || data.wti_oil) liveMacro.wtiOil = Number(mc.wti_oil || data.wti_oil);
      if (mc.wti_oil_change_pct !== undefined) liveMacro.wtiChg = Number(mc.wti_oil_change_pct);
      if (mc.usdkrw || data.usdkrw) liveMacro.usdkrw = Number(mc.usdkrw || data.usdkrw);
      if (mc.usdkrw_change_pct !== undefined) liveMacro.usdkrwChg = Number(mc.usdkrw_change_pct);

      const st = data.stocks || {};
      const h52 = data.high52w || {};
      const dt = data.stocks_detail || {};
      if (dt.NVDA && dt.NVDA.price) {
        liveMacro.nvda = Number(dt.NVDA.price);
        liveMacro.nvdaChg = Number(dt.NVDA.change_pct || 0);
      }

      const mapSym = {
        "005935.KS": "stock_005935",
        "005930.KS": "stock_005930",
        "353200.KS": "stock_353200",
        "240810.KQ": "stock_240810",
        "AMD": "stock_AMD",
        "CLS": "stock_CLS"
      };
      Object.entries(mapSym).forEach(([sym, sKey]) => {
        if (dt[sym] || st[sym]) {
          applyRichStockDetail(sKey, dt[sym], Number(st[sym]), Number(h52[sym]));
        }
      });

      if (data.live_news && typeof data.live_news === "object") {
        if (data.live_news.updated_at) liveNews.updatedAt = data.live_news.updated_at;
        if (Array.isArray(data.live_news.sector) && data.live_news.sector.length > 0) {
          liveNews.sector = data.live_news.sector;
        }
        if (data.live_news.stocks && typeof data.live_news.stocks === "object") {
          Object.entries(data.live_news.stocks).forEach(([sym, arr]) => {
            if (Array.isArray(arr) && arr.length > 0) {
              liveNews.stocks[sym] = arr;
            }
          });
        }
      }

      recomputeAllDynamicMetrics();
    }

    function getRealtimeMarketStatusText() {
      const now = new Date();
      const wd = now.getDay();
      const hm = now.getHours() * 60 + now.getMinutes();
      const daysKr = ["일", "월", "화", "수", "목", "금", "토"];
      const wdKr = daysKr[wd];
      if (wd === 0 || wd === 6) return `주말(${wdKr}) · 직전 종가 반영`;
      if (hm >= 9 * 60 && hm < 15 * 60 + 30) return `평일(${wdKr}) 정규장 실시간`;
      return `평일(${wdKr}) 글로벌 시세 연동`;
    }

    function formatNowKstShort() {
      const now = new Date();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      return `${m}/${d} ${hh}:${mm}:${ss}`;
    }

    function updateLiveClock() {
      const tEl = document.getElementById("liveTimeText");
      if (tEl) {
        tEl.innerHTML = `<span style="color:var(--safe-green); font-weight:700;">LIVE</span> <span class="num">${formatNowKstShort()}</span> · ${getRealtimeMarketStatusText()}`;
      }
      const cdEl = document.getElementById("nextRefreshCountdown");
      if (cdEl) {
        countdownSec = countdownSec > 1 ? countdownSec - 1 : 30;
        cdEl.textContent = `${countdownSec}초 후 갱신`;
      }
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 3500) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: ctrl.signal });
      } finally {
        clearTimeout(id);
      }
    }

    async function fetchDirectBrowserYahooQuotes() {
      const syms = [
        "005935.KS", "005930.KS", "353200.KS", "240810.KQ", "AMD", "CLS",
        "^KS11", "^SOX", "^VIX", "NVDA", "^TNX", "CL=F", "KRW=X", "TLT"
      ];
      const mapSym = {
        "005935.KS": "stock_005935",
        "005930.KS": "stock_005930",
        "353200.KS": "stock_353200",
        "240810.KQ": "stock_240810",
        "AMD": "stock_AMD",
        "CLS": "stock_CLS"
      };
      let updatedCount = 0;

      await Promise.all(syms.map(async (sym) => {
        const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=10d&_=${Date.now()}`;
        const proxyUrls = [
          `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
          `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
          `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
        ];
        for (const pUrl of proxyUrls) {
          try {
            const r = await fetchWithTimeout(pUrl, { cache: "no-store" }, 3500);
            if (!r.ok) continue;
            const j = await r.json();
            const res = j?.chart?.result?.[0];
            if (!res) continue;
            const meta = res.meta || {};
            const tsList = res.timestamp || [];
            const closesRaw = res.indicators?.quote?.[0]?.close || [];
            const isKrw = sym.endsWith(".KS") || sym.endsWith(".KQ");

            const pairs = [];
            for (let i = 0; i < tsList.length; i++) {
              const c = closesRaw[i];
              if (typeof c === "number" && c > 0) {
                const dt = new Date((tsList[i] + 9 * 3600) * 1000);
                pairs.push([`${dt.getUTCMonth() + 1}/${dt.getUTCDate()}`, isKrw ? Math.round(c) : Number(c.toFixed(2))]);
              }
            }
            const p = typeof meta.regularMarketPrice === "number"
              ? (isKrw ? Math.round(meta.regularMarketPrice) : Number(meta.regularMarketPrice.toFixed(2)))
              : (pairs.length ? pairs[pairs.length - 1][1] : null);
            if (!p) continue;

            if (pairs.length) pairs[pairs.length - 1][1] = p;
            const recent = pairs.slice(-5);
            const rDates = recent.map(x => x[0]);
            const rCloses = recent.map(x => x[1]);
            const prev = rCloses.length >= 2 ? rCloses[rCloses.length - 2] : (meta.chartPreviousClose || p);
            const chgPct = prev ? Number((((p - prev) / prev) * 100).toFixed(2)) : 0;
            const wkBase = rCloses.length ? rCloses[0] : prev;
            const wkPct = wkBase ? Number((((p - wkBase) / wkBase) * 100).toFixed(2)) : 0;

            if (mapSym[sym]) {
              applyRichStockDetail(mapSym[sym], {
                price: p,
                prev_close: prev,
                change_pct: chgPct,
                week_change_pct: wkPct,
                high52w: meta.fiftyTwoWeekHigh,
                low52w: meta.fiftyTwoWeekLow,
                recent_dates: rDates,
                recent_closes: rCloses
              });
              updatedCount++;
            } else if (sym === "^KS11") {
              liveMacro.kospi = Number(p.toFixed(2));
              liveMacro.kospiChg = chgPct;
              updatedCount++;
            } else if (sym === "^SOX") {
              liveMacro.sox = Number(p.toFixed(2));
              liveMacro.soxChg = chgPct;
              updatedCount++;
            } else if (sym === "^VIX") {
              liveMacro.vix = Number(p.toFixed(2));
              liveMacro.vixChg = chgPct;
              updatedCount++;
            } else if (sym === "NVDA") {
              liveMacro.nvda = Number(p.toFixed(2));
              liveMacro.nvdaChg = chgPct;
              updatedCount++;
            } else if (sym === "^TNX") {
              liveMacro.us10y = Number(p.toFixed(2));
              liveMacro.us10yChg = chgPct;
              if (rCloses.length >= 4) liveMacro.us10yRecent = rCloses;
              if (rDates.length >= 4) liveMacro.us10yDates = rDates;
              updatedCount++;
            } else if (sym === "CL=F") {
              liveMacro.wtiOil = Number(p.toFixed(2));
              liveMacro.wtiChg = chgPct;
              updatedCount++;
            } else if (sym === "KRW=X") {
              liveMacro.usdkrw = Number(p.toFixed(1));
              liveMacro.usdkrwChg = chgPct;
              updatedCount++;
            } else if (sym === "TLT") {
              liveMacro.tlt = Number(p.toFixed(2));
              liveMacro.tltChg = chgPct;
              updatedCount++;
            }
            break;
          } catch (_) {}
        }
      }));
      return updatedCount;
    }

    async function refreshLivePrices(manual = false) {
      const btn = document.getElementById("refreshBtn");
      const badgeEl = document.getElementById("syncSourceBadge");
      if (btn && manual) {
        btn.textContent = "갱신중";
        btn.disabled = true;
      }

      countdownSec = 30;
      let payload = null;

      const urlsToTry = [
        `data/latest_briefing.json?t=${Date.now()}`,
        `https://raw.githubusercontent.com/dnrzoqs-byte/memory-briefing/main/data/latest_briefing.json?t=${Date.now()}`,
        `https://cdn.jsdelivr.net/gh/dnrzoqs-byte/memory-briefing@main/data/latest_briefing.json?t=${Date.now()}`
      ];
      if (!location.hostname.endsWith("github.io")) {
        urlsToTry.unshift(`/api/briefing?t=${Date.now()}`);
      }

      for (const u of urlsToTry) {
        try {
          const r = await fetchWithTimeout(u, { cache: "no-store" }, 2800);
          if (r.ok) {
            const candidate = await r.json();
            if (candidate && (candidate.stocks || candidate.dram || candidate.dram_spot)) {
              payload = candidate;
              break;
            }
          }
        } catch (_) {}
      }

      if (payload) applyLivePayload(payload);

      let directCount = 0;
      if (manual) {
        try {
          directCount = await fetchDirectBrowserYahooQuotes();
        } catch (_) {}
      }

      recomputeAllDynamicMetrics();
      const container = document.getElementById("viewContainer");
      if (currentView === "dram") container.innerHTML = renderDramView();
      else if (currentView === "rates") container.innerHTML = renderRatesView();
      else if (currentView === "overview5") container.innerHTML = renderOverview5View();
      else if (currentView === "factcheck") container.innerHTML = renderFactCheckView();
      updateLiveClock();

      const stampEl = document.getElementById("lastDataStamp");
      const curTime = formatNowKstShort();
      if (stampEl) stampEl.textContent = `${curTime} 동기화`;

      if (badgeEl) {
        badgeEl.textContent = directCount > 0 ? `직결 (${directCount}개)` : "기관 4대 팩트";
      }

      if (manual) {
        showToast(`최신 데이터 동기화 완료 (${curTime})`);
      }

      if (btn && manual) {
        btn.textContent = "완료";
        btn.disabled = false;
        setTimeout(() => { btn.textContent = "시세 갱신"; }, 1200);
      }
    }

    (function initImmediate() {
      if (window.__INITIAL_BRIEFING_PAYLOAD__) {
        applyLivePayload(window.__INITIAL_BRIEFING_PAYLOAD__);
      }
      recomputeAllDynamicMetrics();
      const params = new URLSearchParams(window.location.search);
      switchView(params.get("view") || "dram", false);
      updateLiveClock();
      setInterval(updateLiveClock, 1000);
      setTimeout(() => { refreshLivePrices(false); }, 50);
      setInterval(() => {
        if (!document.hidden) refreshLivePrices(false);
      }, 30000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshLivePrices(false);
      });
    })();
  </script>
</body>
