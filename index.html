<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>AI·반도체 퀀트 레짐 판독기 v7.0 (Antigravity × Claude Code)</title>
  <!-- Pretendard Variable & Standard 이중 CDN 로드 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <style>
    :root {
      --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      --bg-page: #F2F4F8;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --bg-elevated: #F1F5F9;
      --bg-accent: #EFF6FF;
      --text-primary: #111827;
      --text-secondary: #374151;
      --text-muted: #6B7280;
      --border-color: #E5E7EB;
      --border-subtle: #F1F5F9;
      --up-red: #E11D48;
      --up-red-soft: rgba(225, 29, 72, 0.10);
      --down-blue: #2563EB;
      --down-blue-soft: rgba(37, 99, 235, 0.10);
      --safe-green: #059669;
      --safe-green-soft: rgba(5, 150, 105, 0.11);
      --warn-amber: #D97706;
      --warn-amber-soft: rgba(217, 119, 6, 0.12);
      --purple-accent: #7C3AED;
      --purple-soft: rgba(124, 58, 237, 0.10);
      --shadow-bento: 0 2px 12px -2px rgba(17, 24, 39, 0.06), 0 1px 3px -1px rgba(17, 24, 39, 0.04);
    }

    html.dark {
      --bg-page: #0B0F17;
      --bg-surface: #131B2E;
      --bg-subtle: #1A243B;
      --bg-elevated: #222F4C;
      --bg-accent: #172554;
      --text-primary: #F9FAFB;
      --text-secondary: #D1D5DB;
      --text-muted: #9CA3AF;
      --border-color: #23304A;
      --border-subtle: #1C273E;
      --up-red: #FB7185;
      --up-red-soft: rgba(251, 113, 133, 0.16);
      --down-blue: #60A5FA;
      --down-blue-soft: rgba(96, 165, 250, 0.16);
      --safe-green: #34D399;
      --safe-green-soft: rgba(52, 211, 153, 0.16);
      --warn-amber: #FBBF24;
      --warn-amber-soft: rgba(251, 191, 36, 0.16);
      --purple-accent: #A78BFA;
      --purple-soft: rgba(167, 139, 250, 0.16);
      --shadow-bento: 0 4px 20px -2px rgba(0, 0, 0, 0.50);
    }

    /* 전 요소 Pretendard 타이포그래피 강제 상속 */
    *, *::before, *::after, html, body, button, input, select, textarea, table, th, td, svg, text {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans) !important;
      letter-spacing: -0.026em;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.44;
    }

    .tnum {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .app-shell {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 78px;
    }

    /* 상단 고정 헤더 */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
    }

    html.dark .app-header {
      background-color: rgba(19, 27, 46, 0.92);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px 7px;
      gap: 8px;
    }

    .header-title-wrap {
      min-width: 0;
      flex: 1;
    }

    .header-eyebrow {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--safe-green);
      box-shadow: 0 0 0 3px var(--safe-green-soft);
      display: inline-block;
      transition: transform 0.25s ease;
    }

    .header-title {
      font-size: 16.5px;
      font-weight: 850;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-refresh {
      appearance: none;
      border: 1px solid var(--down-blue);
      background-color: var(--down-blue);
      color: #FFFFFF;
      font-size: 11.5px;
      font-weight: 800;
      padding: 7px 12px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.28);
    }

    .btn-refresh:active {
      transform: scale(0.95);
    }

    .btn-refresh:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .btn-dark {
      appearance: none;
      border: 1px solid var(--border-color);
      background-color: var(--bg-subtle);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 9px;
      cursor: pointer;
    }

    .sync-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 14px 6px;
      background-color: var(--bg-subtle);
      border-top: 1px solid var(--border-subtle);
      font-size: 10.5px;
      color: var(--text-secondary);
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 10px;
      background-color: var(--safe-green-soft);
      color: var(--safe-green);
    }

    /* 상단 4대 탭 */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-surface);
    }

    .nav-tab {
      appearance: none;
      border: none;
      background: transparent;
      padding: 9px 2px 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2.5px solid transparent;
      transition: all 0.15s ease;
      text-align: center;
      white-space: nowrap;
    }

    .nav-tab.active {
      color: var(--down-blue);
      border-bottom-color: var(--down-blue);
      font-weight: 850;
      background-color: var(--bg-subtle);
    }

    /* 하단 고정 독 (Bottom Dock) */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1.5px solid var(--border-color);
      box-shadow: 0 -4px 18px rgba(15, 23, 42, 0.08);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 60;
      padding: 5px 8px calc(5px + env(safe-area-inset-bottom, 0px));
    }

    html.dark .bottom-dock {
      background-color: rgba(19, 27, 46, 0.95);
    }

    .dock-btn {
      appearance: none;
      border: none;
      background: transparent;
      padding: 5px 2px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .dock-btn.active {
      color: var(--down-blue);
      background-color: var(--down-blue-soft);
      font-weight: 850;
    }

    .dock-icon {
      font-size: 15px;
      line-height: 1;
    }

    .dock-label {
      font-size: 10px;
      font-weight: 800;
    }

    .view-body {
      flex: 1;
      padding: 11px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    @keyframes tickFlash {
      0% { box-shadow: 0 0 0 2px var(--down-blue); }
      100% { box-shadow: var(--shadow-bento); }
    }

    .card-refreshed {
      animation: tickFlash 0.6s ease-out;
    }

    /* =========================================================
       토스·블룸버그 스타일 벤토 그리드 (Bento Grid) 시스템
       ========================================================= */
    .bento-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow-bento);
    }

    .bento-hero {
      background: linear-gradient(155deg, var(--bg-surface) 0%, var(--bg-subtle) 100%);
      border: 1.5px solid var(--border-color);
      border-radius: 18px;
      padding: 15px;
      box-shadow: var(--shadow-bento);
    }

    .regime-gate-bar {
      border-radius: 12px;
      padding: 10px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 850;
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 7px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 850;
      color: var(--text-primary);
      line-height: 1.34;
    }

    /* 벤토 2x3 모니터링 타일 */
    .bento-monitor-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin: 11px 0;
    }

    .bm-tile {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 3px;
    }

    .bm-tile.alert-red {
      background-color: var(--up-red-soft);
      border-color: rgba(225, 29, 72, 0.28);
    }

    .bm-tile.alert-green {
      background-color: var(--safe-green-soft);
      border-color: rgba(5, 150, 105, 0.28);
    }

    .bm-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
    }

    .bm-val {
      font-size: 14.5px;
      font-weight: 900;
      color: var(--text-primary);
      line-height: 1.15;
    }

    .bm-sub {
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 교차확인(Cross-Check) 진단 매트릭스 */
    .crosscheck-box {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 13px;
      padding: 11px 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .cc-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      line-height: 1.42;
    }

    .cc-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 850;
      padding: 2.5px 7px;
      border-radius: 6px;
      min-width: 72px;
      text-align: center;
      margin-top: 1px;
    }

    /* 6종목 벤토 그리드 (2열 카드 + 미니 스파크라인) */
    .bento-stock-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .bs-card {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 13px;
      padding: 11px;
      cursor: pointer;
      transition: all 0.14s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .bs-card:hover {
      border-color: var(--down-blue);
      background-color: var(--bg-accent);
    }

    .bs-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 4px;
    }

    .bs-name {
      font-size: 13px;
      font-weight: 850;
      color: var(--text-primary);
    }

    .bs-price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
    }

    .bs-price {
      font-size: 15.5px;
      font-weight: 900;
      color: var(--text-primary);
    }

    .bs-chg {
      font-size: 11px;
      font-weight: 850;
    }

    .bs-support {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-secondary);
      background-color: var(--bg-surface);
      padding: 4px 7px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    /* 서브 탭 그리드 */
    .seg-grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
      background-color: var(--bg-subtle);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .seg-grid-3x2 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      background-color: var(--bg-subtle);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .seg-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      padding: 7px 4px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      text-align: center;
      cursor: pointer;
    }

    .seg-btn.active {
      background-color: var(--bg-surface);
      color: var(--down-blue);
      border-color: var(--down-blue);
      font-weight: 850;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .action-pill {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 850;
      padding: 2.5px 7px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .stock-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .stock-name {
      font-size: 16.5px;
      font-weight: 850;
      color: var(--text-primary);
    }

    .stock-code {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .stock-curr-wrap {
      text-align: right;
    }

    .stock-curr {
      font-size: 19px;
      font-weight: 900;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .stock-chg-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 4px;
    }

    .chg-pill {
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 850;
    }

    .chg-up {
      background-color: var(--up-red-soft);
      color: var(--up-red);
    }

    .chg-down {
      background-color: var(--down-blue-soft);
      color: var(--down-blue);
    }

    .target-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }

    .target-cell {
      border-radius: 11px;
      padding: 8px 7px;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-subtle);
      text-align: center;
    }

    .target-cell.floor {
      background-color: var(--safe-green-soft);
      border-color: rgba(16, 185, 129, 0.32);
    }

    .target-cell.t1 {
      background-color: var(--down-blue-soft);
      border-color: rgba(37, 99, 235, 0.32);
    }

    .target-cell.t2 {
      background-color: var(--up-red-soft);
      border-color: rgba(225, 29, 72, 0.32);
    }

    .tc-label {
      font-size: 10px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .tc-val {
      font-size: 13px;
      font-weight: 900;
    }

    .tc-upside {
      font-size: 9.5px;
      font-weight: 800;
      margin-top: 2px;
    }

    .band-gauge-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 11px;
      padding: 9px 11px;
      margin-bottom: 10px;
    }

    .band-gauge-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .band-bar-track {
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #10B981 0%, #3B82F6 55%, #EF4444 100%);
      position: relative;
      margin: 4px 0;
    }

    .band-bar-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #FFFFFF;
      border: 3px solid var(--text-primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .chart-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 9px 7px 5px;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 5px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .svg-chart {
      width: 100%;
      height: auto;
      display: block;
    }

    .kpi-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 10px;
    }

    .kpi-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 11px;
      padding: 9px 11px;
      min-width: 0;
    }

    .kpi-label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .kpi-val {
      font-size: 15px;
      font-weight: 900;
      color: var(--text-primary);
    }

    .kpi-sub {
      font-size: 10.5px;
      font-weight: 700;
      margin-top: 2px;
      color: var(--text-secondary);
    }

    /* 인과관계 스텝퍼 */
    .causal-flow {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 7px;
    }

    .causal-step {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 11px;
      padding: 9px 11px;
      font-size: 12px;
      line-height: 1.44;
    }

    .step-num {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 900;
      padding: 2.5px 7px;
      border-radius: 5px;
      background-color: var(--down-blue);
      color: #FFFFFF;
      margin-top: 1px;
    }

    .pros-cons-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .pc-box {
      border-radius: 11px;
      padding: 9px 10px;
      font-size: 11.5px;
      line-height: 1.42;
    }

    /* 탭 하단 컨텍스트 이동 버튼 */
    .tab-footer-nav {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 8px;
      margin-top: 4px;
    }

    .footer-nav-btn {
      appearance: none;
      border: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      padding: 12px 13px;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-bento);
    }

    .footer-nav-btn.primary {
      background-color: var(--down-blue);
      border-color: var(--down-blue);
      color: #FFFFFF;
    }

    .live-toast {
      position: fixed;
      bottom: 82px;
      left: 50%;

    // 다중 앵커 클러스터링 기반 1차/2차 지지선 자동 산출 함수
    function computeDynamicSupportCluster(st) {
      const p = st.rawCurr;
      const isKrw = st.unit === "만";
      // 최근 5일 일평균 변동폭(ATR 근사치)
      const rc = Array.isArray(st.recentClosesRaw) && st.recentClosesRaw.length >= 2 ? st.recentClosesRaw : [p];
      let sumDiff = 0;
      for (let i = 1; i < rc.length; i++) {
        sumDiff += Math.abs(rc[i] - rc[i - 1]);
      }
      const atr = rc.length > 1 ? (sumDiff / (rc.length - 1)) : (p * 0.04);

      // 라운드 넘버 스냅 (현재가 바로 아래 의미 있는 마디 가격)
      let step = isKrw ? (p >= 150000 ? 10000 : 5000) : (p >= 300 ? 20 : 10);
      let roundSupport1 = Math.floor(p / step) * step;
      if ((p - roundSupport1) / p < 0.012) roundSupport1 -= step;
      let atrSupport2 = Math.round((p - 1.5 * atr) / (step / 2)) * (step / 2);

      // 52주 최저가 하방 클램프
      const minFloorRaw = isKrw ? st.low52w * 10000 : st.low52w;
      if (minFloorRaw > 0) {
        roundSupport1 = Math.max(roundSupport1, Math.round(minFloorRaw));
        atrSupport2 = Math.max(atrSupport2, Math.round(minFloorRaw * 0.96));
      }

      const fmt = (val) => isKrw ? `${(val / 10000).toFixed(1)}만(${val.toLocaleString()}원)` : `$${val.toFixed(0)}`;
      const fmtShort = (val) => isKrw ? `${(val / 10000).toFixed(1)}만` : `$${val.toFixed(0)}`;

      const distToSup1Pct = +(((p - roundSupport1) / roundSupport1) * 100).toFixed(1);
      return {
        sup1Raw: roundSupport1,
        sup2Raw: Math.min(roundSupport1 - (step / 2), atrSupport2),
        sup1Label: fmt(roundSupport1),
        sup1Short: fmtShort(roundSupport1),
        sup2Short: fmtShort(Math.min(roundSupport1 - (step / 2), atrSupport2)),
        distToSup1Pct
      };
    }

    // =========================================================================
    // 3. 미니 스파크라인 & 메인 SVG 차트 렌더러
    // =========================================================================
    function renderSparklineSvg(closes, isUp) {
      if (!Array.isArray(closes) || closes.length < 2) return "";
      const w = 78, h = 24, pad = 3;
      const minV = Math.min(...closes);
      const maxV = Math.max(...closes);
      const range = (maxV - minV) || 1;
      const stepX = (w - pad * 2) / (closes.length - 1);
      const pts = closes.map((v, i) => {
        const x = (pad + i * stepX).toFixed(1);
        const y = (h - pad - ((v - minV) / range) * (h - pad * 2)).toFixed(1);
        return `${x},${y}`;
      }).join(" ");
      const strokeColor = isUp ? "var(--up-red)" : "var(--down-blue)";
      return `
        <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible;">
          <polyline fill="none" stroke="${strokeColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${pts}" />
        </svg>
      `;
    }

    function renderLineSvg(pts, labels, forecastStartIdx, unitPrefix = "$", unitSuffix = "") {
      const w = 440, h = 146, padX = 34, topY = 24, botY = 112;
      const minV = Math.min(...pts) * 0.91;
      const maxV = Math.max(...pts) * 1.07;
      const range = maxV - minV || 1;
      const stepX = (w - padX * 2) / (pts.length - 1);

      const coords = pts.map((v, i) => ({
        x: padX + i * stepX,
        y: botY - ((v - minV) / range) * (botY - topY),
        v,
        label: labels[i] || ""
      }));

      const solidPts = coords.slice(0, forecastStartIdx + 1).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const dashPts = coords.slice(forecastStartIdx).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const areaPts = `${coords[0].x.toFixed(1)},${botY} ` + coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ") + ` ${coords[coords.length - 1].x.toFixed(1)},${botY}`;

      let nodesHtml = "";
      coords.forEach((c, idx) => {
        const isForecast = idx > forecastStartIdx;
        const isCurrent = idx === forecastStartIdx;
        const dotColor = isCurrent ? "var(--up-red)" : (isForecast ? "var(--safe-green)" : "var(--down-blue)");
        const r = isCurrent ? 5 : 3.8;
        const valStr = `${unitPrefix}${Number.isInteger(c.v) ? c.v : c.v.toFixed(2)}${unitSuffix}`;
        const yOffset = idx % 2 === 0 ? -9 : -11;

        nodesHtml += `
          <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${r}" fill="${dotColor}" stroke="var(--bg-surface)" stroke-width="1.6" />
          <text x="${c.x.toFixed(1)}" y="${(c.y + yOffset).toFixed(1)}" text-anchor="middle" font-size="${isCurrent ? '10.5' : '9.5'}" font-weight="800" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-primary)'}">${valStr}</text>
          <text x="${c.x.toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="9.5" font-weight="${isCurrent ? '800' : '600'}" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-muted)'}">${c.label}</text>
        `;
      });

      return `
        <svg viewBox="0 0 ${w} ${h}" class="svg-chart">
          <defs>
            <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--down-blue)" stop-opacity="0.16"/>
              <stop offset="100%" stop-color="var(--down-blue)" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <line x1="${padX}" y1="${topY}" x2="${w - padX}" y2="${topY}" stroke="var(--border-color)" stroke-dasharray="3 3" stroke-width="0.8" />
          <line x1="${padX}" y1="${(topY + botY) / 2}" x2="${w - padX}" y2="${(topY + botY) / 2}" stroke="var(--border-color)" stroke-dasharray="3 3" stroke-width="0.8" />
          <line x1="${padX}" y1="${botY}" x2="${w - padX}" y2="${botY}" stroke="var(--border-color)" stroke-width="1" />
          <polygon points="${areaPts}" fill="url(#chartGrad)" />
          <polyline fill="none" stroke="var(--down-blue)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="${solidPts}" />
          ${forecastStartIdx < coords.length - 1 ? `<polyline fill="none" stroke="var(--safe-green)" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" points="${dashPts}" />` : ""}
          ${nodesHtml}
        </svg>
      `;
    }

          <button class="footer-nav-btn" onclick="switchView('${prevKey}')">

            <span>${prevLabel}</span>

        ${renderBottomTabStepper('dram', '🧠 시황·레짐판독', 'factcheck', '🔍 인과·증시대책')}

    // [화면 3] 🔍 젠슨 황 사퇴 × 삼성전자 인과관계 & 국내 증시 안정 대책 판독

          <h2 class="card-title">왜 엔비디아 리더십 충격이 중기적으로 삼성전자에 기회가 되는가?</h2>

              <span class="step-num" style="background:var(--safe-green);">2단계 · 기회①</span>

            <div class="causal-step">
              <span class="step-num" style="background:var(--safe-green);">3단계 · 기회②</span>
              <div>
                <strong>엔비디아 새 경영진(콜레트 크레스 임시 CEO)의 '공급사 이원화·원가 절감'</strong><br/>
                재무통(CFO 출신)인 새 경영진은 하이닉스 독점에 따른 높은 HBM 단가를 낮추기 위해 <strong>차세대 HBM3E 12단 및 HBM4에서 삼성전자 채택 비중을 높여 공급망을 이원화할 유인</strong>이 커졌습니다.
              </div>
            </div>
          </div>

          <div class="pros-cons-grid">
            <div class="pc-box" style="background:var(--safe-green-soft); border:1px solid rgba(5,150,105,0.3);">
              <strong style="color:var(--safe-green);">🟢 중기 기회 요인 (득)</strong><br/>
              • 빅테크 탈엔비디아(AMD·ASIC) 수혜 및 엔비디아의 HBM 벤더 이원화 가속<br/>
              • 삼성전자 현 주가(${sMain.currLabel})는 역사적 저점 PBR 1.0배 도달

            <div class="pc-box" style="background:var(--up-red-soft); border:1px solid rgba(225,29,72,0.3);">
              <strong style="color:var(--up-red);">🔴 단기 충격 요인 (실)</strong><br/>
              • AI 투자 피크아웃 우려 및 미국 기술주(SOX ${liveMacro.soxChg.toFixed(1)}%) 급락으로 <strong>단기 외국인 패닉셀에 동반 노출</strong>
            </div>

                코스피 급락으로 매도 사이드카가 발동되자, 개인 신용계좌 강제 청산(깡통계좌 반대매매)이 연쇄 투매를 부르는 악순환을 막기 위해 <strong>담보비율 유지 의무를 3개월간 한시 유예</strong>했습니다. 기계적 반대매매 폭탄을 완화하는 핵심 안전판입니다.

              </div>
            </div>

              <div>

                증안펀드 즉각 투입에 대해서는 신중론이 맞서고 있으므로, 정책 대책은 '추가 폭락 방패'로 이해해야 합니다. 진정한 추세 반등 시그널은 <strong>① VIX 공포지수의 25 이하 하향 안정과 ② 필라델피아 반도체지수(SOX)의 진정</strong>입니다.
              </div>
            </div>
          </div>
        </section>

        ${renderBottomTabStepper('overview5', '🎯 6종목·지지선', 'rates', '🏦 거시·메모리')}
      `;
    }

    // [화면 4] 🏦 거시(금리·환율·유가) & 💾 메모리 실물(DRAMeXchange) 모니터
    function renderRatesView() {
      const d = dramSeries[currentDramKey] || dramSeries.ddr5_16g;
      const tabKeys = Object.keys(dramSeries);

      const ratePts = Array.isArray(liveMacro.us10yRecent) && liveMacro.us10yRecent.length >= 4
        ? [...liveMacro.us10yRecent.slice(-4), liveMacro.us10y, 4.85, 4.70]
        : [5.10, 5.07, 5.05, 4.95, liveMacro.us10y, 4.85, 4.70];
      const rateDates = Array.isArray(liveMacro.us10yDates) && liveMacro.us10yDates.length >= 4
        ? [...liveMacro.us10yDates.slice(-4), "현재", "다음주", "연말"]
        : ["11/17", "11/18", "11/19", "11/20", "현재", "다음주", "연말"];

      const w = 440, h = 146, padX = 34, topY = 24, botY = 112;
      const minV = 4.40, maxV = 5.45;
      const range = maxV - minV;
      const stepX = (w - padX * 2) / (ratePts.length - 1);

      const coords = ratePts.map((v, i) => ({
        x: padX + i * stepX,
        y: botY - ((v - minV) / range) * (botY - topY),
        v,
        label: rateDates[i]
      }));

      const threshY = botY - ((5.00 - minV) / range) * (botY - topY);
      const solidPts = coords.slice(0, 5).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const dashPts = coords.slice(4).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");

      let nodesHtml = "";
      coords.forEach((c, idx) => {
        const isCurrent = idx === 4;
        const isForecast = idx > 4;
        const dotColor = isCurrent ? "var(--up-red)" : (isForecast ? "var(--safe-green)" : "var(--down-blue)");
        nodesHtml += `
          <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${isCurrent ? 5 : 3.8}" fill="${dotColor}" stroke="var(--bg-surface)" stroke-width="1.6" />
          <text x="${c.x.toFixed(1)}" y="${(c.y - 9).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-primary)'}">${c.v.toFixed(2)}%</text>
          <text x="${c.x.toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="9.5" font-weight="${isCurrent ? '800' : '600'}" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-muted)'}">${c.label}</text>
        `;
      });

      const isBelow5 = liveMacro.us10y < 5.0;

      return `
        <!-- [1] 🏦 한·미 금리 · 유가 · 환율 실시간 모니터 -->
        <section class="bento-card">
          <span class="section-tag" style="background:var(--safe-green-soft); color:var(--safe-green);">
            ${isBelow5 ? `🟢 거시 쾌청: 미 10Y 금리 ${liveMacro.us10y.toFixed(2)}%(5% 하회!) · 환율(${liveMacro.usdkrw.toFixed(1)}원)·유가($${liveMacro.wtiOil.toFixed(2)}) 모두 안정` : `🟠 거시 모니터: 미 10Y 금리 ${liveMacro.us10y.toFixed(2)}% · 환율 ${liveMacro.usdkrw.toFixed(1)}원`}
          </span>

          <div class="kpi-grid-2 tnum" style="margin-top:4px;">
            <div class="kpi-box" style="background:var(--safe-green-soft); border-color:rgba(16,185,129,0.28);">
              <div class="kpi-label" style="color:var(--safe-green);">🇺🇸 미 10년 금리 / TLT</div>
              <div class="kpi-val" style="color:var(--safe-green);">${liveMacro.us10y.toFixed(2)}% <span style="font-size:11.5px; color:var(--text-secondary);">/ $${liveMacro.tlt.toFixed(2)}</span></div>
              <div class="kpi-sub">${isBelow5 ? '5.0% 아래로 하락 안정 (TLT 반등!)' : '5.0% 경계선 테스트'}</div>
            </div>
            <div class="kpi-box" style="background:var(--safe-green-soft); border-color:rgba(16,185,129,0.28);">
              <div class="kpi-label" style="color:var(--safe-green);">💱 원/달러 환율</div>
              <div class="kpi-val" style="color:var(--safe-green);">${liveMacro.usdkrw.toFixed(1)}원</div>
              <div class="kpi-sub">코스피 급락에도 1,330원대 안정</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-label">🛢️ WTI 유가 (CL=F)</div>
              <div class="kpi-val">$${liveMacro.wtiOil.toFixed(2)}</div>
              <div class="kpi-sub">$83선 하향 안정 (비용·인플레 완화)</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-label">🇰🇷 한은 기준 / 국고 10Y</div>
              <div class="kpi-val">${liveMacro.krBase.toFixed(2)}% / ${liveMacro.kr10y.toFixed(2)}%</div>
              <div class="kpi-sub">11/27 금통위 기준금리 결정 대기</div>
            </div>
          </div>

          <div class="chart-box tnum">
            <div class="chart-legend">
              <span>● 미국 10년물 국채금리 (%)</span>
              <span style="color:var(--up-red);">--- 5.00% 밸류 경계선</span>
            </div>
            <svg viewBox="0 0 ${w} ${h}" class="svg-chart">
              <line x1="${padX}" y1="${threshY.toFixed(1)}" x2="${w - padX}" y2="${threshY.toFixed(1)}" stroke="var(--up-red)" stroke-dasharray="4 3" stroke-width="1.2" />
              <text x="${padX + 4}" y="${(threshY - 5).toFixed(1)}" font-size="9" font-weight="800" fill="var(--up-red)">5.00% 밸류 경계선</text>
              <line x1="${padX}" y1="${botY}" x2="${w - padX}" y2="${botY}" stroke="var(--border-color)" stroke-width="1" />
              <polyline fill="none" stroke="var(--down-blue)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="${solidPts}" />
              <polyline fill="none" stroke="var(--safe-green)" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" points="${dashPts}" />
              ${nodesHtml}
            </svg>
          </div>
        </section>

        <!-- [2] 💾 DRAMeXchange 메모리 실물 가격 모니터 -->
        <section class="bento-card">
          <span class="section-tag" style="background:var(--down-blue-soft); color:var(--down-blue);">💾 실물 영수증 · DRAMeXchange 현물 &amp; 고정계약가</span>
          <div class="seg-grid-2x2" style="margin-top:4px;">
            ${tabKeys.map(k => `
              <button onclick="selectDramKey('${k}')" class="seg-btn ${k === currentDramKey ? 'active' : ''}">
                ${dramSeries[k].shortTab}
              </button>
            `).join("")}
          </div>

          <div class="kpi-grid-2 tnum">
            <div class="kpi-box">
              <div class="kpi-label">실시간 현물가 (Spot)</div>
              <div class="kpi-val" style="color:var(--down-blue);">$${d.price.toFixed(2)}</div>
              <div class="kpi-sub">${d.changeText}</div>
            </div>
            <div class="kpi-box" style="background:var(--up-red-soft); border-color:rgba(225,29,72,0.25);">
              <div class="kpi-label" style="color:var(--up-red);">분기 고정계약가 (실적 직결)</div>
              <div class="kpi-val" style="color:var(--up-red); font-size:13px;">${d.contractFact}</div>
              <div class="kpi-sub">다음주 예측: ${d.spotForecast}</div>
            </div>
          </div>

          <div class="chart-box tnum">
            <div class="chart-legend">
              <span>● 파란 실선: 최근 6개월 실거래</span>
              <span style="color:var(--safe-green);">● 초록 점선: 연말 궤적</span>
            </div>
            ${renderLineSvg(d.pts, d.labels, 4, "$", "")}
          </div>
        </section>

        ${renderBottomTabStepper('factcheck', '🔍 인과·증시대책', 'dram', '🧠 시황·레짐판독')}
      `;
    }

    // =========================================================================
    // 5. 무결점 3중 실시간 동기화 엔진 (내장 스냅샷 + JSON + 브라우저 직접 거래소/RSS 조회)
    // =========================================================================
    const viewTitles = {
      dram: "🧠 퀀트 레짐 판독 & 시황 모니터",
      overview5: "🎯 6종목 자동 지지선 & 3단계 목표가",
      factcheck: "🔍 젠슨황 인과해부 & 국내 증시대책",
      rates: "🏦 거시(금리·환율) & 메모리 실물"
    };

    function showToast(msg) {
      const toast = document.getElementById("liveToast");
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3400);
    }

    function switchView(viewName, updateUrl = true) {
      if (viewName && viewName.startsWith("stock_")) {
        currentStockKey = viewName;
        currentView = "overview5";
      } else if (["dram", "rates", "overview5", "factcheck"].includes(viewName)) {
        currentView = viewName;
      } else {
        currentView = "dram";
      }

      recomputeAllDynamicMetrics();

      const titleEl = document.getElementById("headerTitle");
      if (titleEl) titleEl.textContent = viewTitles[currentView] || "퀀트 레짐 판독기";

      const container = document.getElementById("viewContainer");
      if (currentView === "dram") container.innerHTML = renderDramView();
      else if (currentView === "rates") container.innerHTML = renderRatesView();
      else if (currentView === "overview5") container.innerHTML = renderOverview5View();
      else if (currentView === "factcheck") container.innerHTML = renderFactCheckView();

      document.querySelectorAll(".nav-tab").forEach(tab => tab.classList.remove("active"));
      document.getElementById("tab-" + currentView)?.classList.add("active");

      document.querySelectorAll(".dock-btn").forEach(btn => btn.classList.remove("active"));
      document.getElementById("dock-" + currentView)?.classList.add("active");

      window.scrollTo({ top: 0, behavior: "smooth" });

      if (updateUrl && window.history && window.history.replaceState) {
        const url = new URL(window.location.href);
        url.searchParams.set("view", currentView);
        window.history.replaceState({}, "", url.toString());
      }
    }

    window.selectDramKey = function(key) {
      currentDramKey = key;
      recomputeAllDynamicMetrics();
      const container = document.getElementById("viewContainer");
      if (container) container.innerHTML = renderRatesView();
    };

    window.selectStockKey = function(key) {
      currentStockKey = key;
      currentView = "overview5";
      recomputeAllDynamicMetrics();
      const container = document.getElementById("viewContainer");
      if (container) container.innerHTML = renderOverview5View();
      document.querySelectorAll(".nav-tab").forEach(tab => tab.classList.remove("active"));
      document.getElementById("tab-overview5")?.classList.add("active");
      document.querySelectorAll(".dock-btn").forEach(btn => btn.classList.remove("active"));
      document.getElementById("dock-overview5")?.classList.add("active");
      const detailEl = document.getElementById("stockDetailCard");
      if (detailEl) detailEl.scrollIntoView({ behavior: "smooth", block: "start" });
    };

    window.toggleDark = function() {
      const isDark = document.documentElement.classList.toggle("dark");
      const btn = document.getElementById("darkBtn");
      if (btn) btn.textContent = isDark ? "라이트" : "다크";
    };

    function applyRichStockDetail(stockKey, detail, rawPriceFallback, rawHighFallback) {
      const item = stockData[stockKey];
      if (!item) return;
      if (detail && typeof detail === "object") {
        if (typeof detail.price === "number" && detail.price > 0) item.rawCurr = detail.price;
        if (typeof detail.change_pct === "number") item.changePct = detail.change_pct;
        if (typeof detail.week_change_pct === "number") item.weekChangePct = detail.week_change_pct;
        if (typeof detail.high52w === "number" && detail.high52w > 0) {
          item.high52w = item.unit === "만" ? +(detail.high52w / 10000).toFixed(2) : +detail.high52w.toFixed(2);
        }
        if (typeof detail.low52w === "number" && detail.low52w > 0) {
          item.low52w = item.unit === "만" ? +(detail.low52w / 10000).toFixed(2) : +detail.low52w.toFixed(2);
        }
        if (Array.isArray(detail.recent_closes) && detail.recent_closes.length >= 4) {
          item.recentClosesRaw = detail.recent_closes;
        }
        if (Array.isArray(detail.recent_dates) && detail.recent_dates.length >= 4) {
          item.recentDates = detail.recent_dates;
        }
      } else {
        if (typeof rawPriceFallback === "number" && rawPriceFallback > 0) {
          item.rawCurr = rawPriceFallback;
          if (Array.isArray(item.recentClosesRaw) && item.recentClosesRaw.length > 0) {
            item.recentClosesRaw[item.recentClosesRaw.length - 1] = rawPriceFallback;
          }
        }
        if (typeof rawHighFallback === "number" && rawHighFallback > 0) {
          item.high52w = item.unit === "만" ? +(rawHighFallback / 10000).toFixed(2) : +rawHighFallback.toFixed(2);
        }
      }
    }

    function applyLivePayload(data) {
      if (!data || typeof data !== "object") return;

      const sp = data.dram || data.dram_spot;
      if (sp) {
        const keyMap = {
          ddr5_16g: sp.ddr5_16g,
          ddr4_16g: sp.ddr4_16g,
          ddr4_8g: sp.ddr4_8g,
          ddr5_mod: sp.ddr5_mod || sp.ddr5_16gb_module
        };
        Object.entries(keyMap).forEach(([k, item]) => {
          if (item && item.price) {
            const p = Number(Number(item.price).toFixed(2));
            dramSeries[k].price = p;
            dramSeries[k].pts[4] = p;
            if (item.high) dramSeries[k].high = Number(item.high);
            if (item.low) dramSeries[k].low = Number(item.low);
            if (item.change) {
              dramSeries[k].change = item.change;
              const base6m = dramSeries[k].pts[0] || p;
              const sixMChg = (((p - base6m) / base6m) * 100).toFixed(1);
              dramSeries[k].changeText = `현물 ${item.change} · 6개월 +${sixMChg}%`;
            }
          }
        });
      }

      const mc = data.macro || {};
      if (mc.kospi) liveMacro.kospi = Number(mc.kospi);
      if (mc.kospi_change_pct !== undefined) liveMacro.kospiChg = Number(mc.kospi_change_pct);
      if (mc.kosdaq) liveMacro.kosdaq = Number(mc.kosdaq);
      if (mc.kosdaq_change_pct !== undefined) liveMacro.kosdaqChg = Number(mc.kosdaq_change_pct);
      if (mc.sox) liveMacro.sox = Number(mc.sox);
      if (mc.sox_change_pct !== undefined) liveMacro.soxChg = Number(mc.sox_change_pct);
      if (mc.nasdaq) liveMacro.nasdaq = Number(mc.nasdaq);
      if (mc.nasdaq_change_pct !== undefined) liveMacro.nasdaqChg = Number(mc.nasdaq_change_pct);
      if (mc.vix) liveMacro.vix = Number(mc.vix);
      if (mc.vix_change_pct !== undefined) liveMacro.vixChg = Number(mc.vix_change_pct);
      if (mc.us10y || data.us10y) liveMacro.us10y = Number(mc.us10y || data.us10y);
      if (mc.us10y_change_pct !== undefined) liveMacro.us10yChg = Number(mc.us10y_change_pct);
      if (Array.isArray(mc.us10y_recent) && mc.us10y_recent.length >= 4) liveMacro.us10yRecent = mc.us10y_recent;
      if (Array.isArray(mc.us10y_dates) && mc.us10y_dates.length >= 4) liveMacro.us10yDates = mc.us10y_dates;
      if (mc.us2y || data.us2y) liveMacro.us2y = Number(mc.us2y || data.us2y);
      if (mc.tlt_price || data.tlt_price) liveMacro.tlt = Number(mc.tlt_price || data.tlt_price);
      if (mc.wti_oil || data.wti_oil) liveMacro.wtiOil = Number(mc.wti_oil || data.wti_oil);
      if (mc.usdkrw || data.usdkrw) liveMacro.usdkrw = Number(mc.usdkrw || data.usdkrw);
      if (mc.kr_base || data.kr_base) liveMacro.krBase = Number(mc.kr_base || data.kr_base);
      if (mc.kr_10y || data.kr_10y) liveMacro.kr10y = Number(mc.kr_10y || data.kr_10y);

      const st = data.stocks || {};
      const h52 = data.high52w || {};
      const dt = data.stocks_detail || {};
      if (dt.NVDA && dt.NVDA.price) {
        liveMacro.nvda = Number(dt.NVDA.price);
        liveMacro.nvdaChg = Number(dt.NVDA.change_pct || 0);
      }
      if (dt.MU && dt.MU.price) {
        liveMacro.mu = Number(dt.MU.price);
        liveMacro.muChg = Number(dt.MU.change_pct || 0);
      }

      const mapSym = {
        "005935.KS": "stock_005935",
        "005930.KS": "stock_005930",
        "353200.KS": "stock_353200",
        "240810.KQ": "stock_240810",
        "AMD": "stock_AMD",
        "CLS": "stock_CLS"
      };
      Object.entries(mapSym).forEach(([sym, sKey]) => {
        if (dt[sym] || st[sym]) {
          applyRichStockDetail(sKey, dt[sym], Number(st[sym]), Number(h52[sym]));
        }
      });

      if (data.live_news && typeof data.live_news === "object") {
        if (data.live_news.updated_at) liveNews.updatedAt = data.live_news.updated_at;
        if (Array.isArray(data.live_news.sector) && data.live_news.sector.length > 0) {
          liveNews.sector = data.live_news.sector;
        }
        if (data.live_news.stocks && typeof data.live_news.stocks === "object") {
          Object.entries(data.live_news.stocks).forEach(([sym, arr]) => {
            if (Array.isArray(arr) && arr.length > 0) {
              liveNews.stocks[sym] = arr;
            }
          });
        }
      }

      recomputeAllDynamicMetrics();
    }

    function getRealtimeMarketStatusText() {
      const now = new Date();
      const wd = now.getDay();
      const hm = now.getHours() * 60 + now.getMinutes();
      const daysKr = ["일", "월", "화", "수", "목", "금", "토"];
      const wdKr = daysKr[wd];
      if (wd === 0 || wd === 6) return `주말(${wdKr}) · 직전장 종가 & 실시간 뉴스 반영`;
      if (hm >= 9 * 60 && hm < 15 * 60 + 30) return `평일(${wdKr}) 국내 정규장 실시간 가동중`;
      if (hm < 9 * 60) return `평일(${wdKr}) 미국장 마감 · 국내 개장전`;
      return `평일(${wdKr}) 국내 마감 · 글로벌 실시간 연동`;
    }

    function formatNowKstFull() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      return `${y}.${m}.${d} ${hh}:${mm}:${ss}`;
    }

    function formatNowKstShort() {
      const now = new Date();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      return `${m}/${d} ${hh}:${mm}:${ss}`;
    }

    function updateLiveClock() {
      const tEl = document.getElementById("liveTimeText");
      if (tEl) {
        tEl.innerHTML = `<span style="color:var(--safe-green); font-weight:800;">LIVE</span> ${formatNowKstFull()} · ${getRealtimeMarketStatusText()}`;
      }
      const cdEl = document.getElementById("nextRefreshCountdown");
      if (cdEl) {
        countdownSec = countdownSec > 1 ? countdownSec - 1 : 30;
        cdEl.textContent = `자동갱신 ${countdownSec}초`;
      }
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 3500) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: ctrl.signal });
      } finally {
        clearTimeout(id);
      }
    }

    async function fetchDirectBrowserNewsRSS() {
      const queries = [
        { q: "코스피 삼성전자 반도체 when:5d", tag: "국내증시·반도체", target: "sector" },
        { q: "엔비디아 삼성전자 HBM when:5d", tag: "AI·HBM", target: "005930.KS" },
        { q: "대덕전자 기판 반도체 when:7d", tag: "기판 수급", target: "353200.KS" },
        { q: "원익IPS 반도체 장비 when:7d", tag: "장비 실적", target: "240810.KQ" }
      ];
      let newsFetched = 0;
      const newSector = [];

      await Promise.all(queries.map(async (item) => {
        const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(item.q)}&hl=ko&gl=KR&ceid=KR:ko&_=${Date.now()}`;
        const proxyUrls = [
          `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`,
          `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(rssUrl)}`
        ];
        for (const pUrl of proxyUrls) {
          try {
            const r = await fetchWithTimeout(pUrl, { cache: "no-store" }, 3500);
            if (!r.ok) continue;
            const xmlText = await r.text();
            const doc = new DOMParser().parseFromString(xmlText, "text/xml");
            const nodes = Array.from(doc.querySelectorAll("item")).slice(0, 3);
            if (!nodes.length) continue;

            const parsed = nodes.map(node => {
              let title = node.querySelector("title")?.textContent || "";
              const link = node.querySelector("link")?.textContent || "#";
              const pubDate = node.querySelector("pubDate")?.textContent || "";
              const source = node.querySelector("source")?.textContent || "뉴스";
              if (title.includes(" - ")) title = title.split(" - ").slice(0, -1).join(" - ").trim();
              return { tag: item.tag, title, source, pubDate: pubDate.slice(5, 16), link };
            });

            if (item.target === "sector") {
              newSector.push(...parsed);
            } else {
              liveNews.stocks[item.target] = parsed;
              if (item.target === "005930.KS") liveNews.stocks["005935.KS"] = parsed;
              newSector.push(parsed[0]);
            }
            newsFetched += parsed.length;
            break;
          } catch (_) {}
        }
      }));

      if (newSector.length >= 2) {
        liveNews.sector = newSector.slice(0, 4);
        liveNews.updatedAt = `${formatNowKstShort()} 실시간 RSS`;
      }
      return newsFetched;
    }

    async function fetchDirectBrowserYahooQuotes() {
      const syms = [
        "005935.KS", "005930.KS", "353200.KS", "240810.KQ", "AMD", "CLS",
        "^KS11", "^SOX", "^VIX", "NVDA", "^TNX", "CL=F", "KRW=X", "TLT"
      ];
      const mapSym = {
        "005935.KS": "stock_005935",
        "005930.KS": "stock_005930",
        "353200.KS": "stock_353200",
        "240810.KQ": "stock_240810",
        "AMD": "stock_AMD",
        "CLS": "stock_CLS"
      };
      let updatedCount = 0;

      await Promise.all(syms.map(async (sym) => {
        const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=10d&_=${Date.now()}`;
        const proxyUrls = [
          `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
          `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
          `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
        ];
        for (const pUrl of proxyUrls) {
          try {
            const r = await fetchWithTimeout(pUrl, { cache: "no-store" }, 3500);
            if (!r.ok) continue;
            const j = await r.json();
            const res = j?.chart?.result?.[0];
            if (!res) continue;
            const meta = res.meta || {};
            const tsList = res.timestamp || [];
            const closesRaw = res.indicators?.quote?.[0]?.close || [];
            const isKrw = sym.endsWith(".KS") || sym.endsWith(".KQ");

            const pairs = [];
            for (let i = 0; i < tsList.length; i++) {
              const c = closesRaw[i];
              if (typeof c === "number" && c > 0) {
                const dt = new Date((tsList[i] + 9 * 3600) * 1000);
                pairs.push([`${dt.getUTCMonth() + 1}/${dt.getUTCDate()}`, isKrw ? Math.round(c) : Number(c.toFixed(2))]);
              }
            }
            const p = typeof meta.regularMarketPrice === "number"
              ? (isKrw ? Math.round(meta.regularMarketPrice) : Number(meta.regularMarketPrice.toFixed(2)))
              : (pairs.length ? pairs[pairs.length - 1][1] : null);
            if (!p) continue;

            if (pairs.length) pairs[pairs.length - 1][1] = p;
            const recent = pairs.slice(-5);
            const rDates = recent.map(x => x[0]);
            const rCloses = recent.map(x => x[1]);
            const prev = rCloses.length >= 2 ? rCloses[rCloses.length - 2] : (meta.chartPreviousClose || p);
            const chgPct = prev ? Number((((p - prev) / prev) * 100).toFixed(2)) : 0;
            const wkBase = rCloses.length ? rCloses[0] : prev;
            const wkPct = wkBase ? Number((((p - wkBase) / wkBase) * 100).toFixed(2)) : 0;

            if (mapSym[sym]) {
              applyRichStockDetail(mapSym[sym], {
                price: p,
                prev_close: prev,
                change_pct: chgPct,
                week_change_pct: wkPct,
                high52w: meta.fiftyTwoWeekHigh,
                low52w: meta.fiftyTwoWeekLow,
                recent_dates: rDates,
                recent_closes: rCloses
              });
              updatedCount++;
            } else if (sym === "^KS11") {
              liveMacro.kospi = Number(p.toFixed(2));
              liveMacro.kospiChg = chgPct;
              updatedCount++;
            } else if (sym === "^SOX") {
              liveMacro.sox = Number(p.toFixed(2));
              liveMacro.soxChg = chgPct;
              updatedCount++;
            } else if (sym === "^VIX") {
              liveMacro.vix = Number(p.toFixed(2));
              liveMacro.vixChg = chgPct;
              updatedCount++;
            } else if (sym === "NVDA") {
              liveMacro.nvda = Number(p.toFixed(2));
              liveMacro.nvdaChg = chgPct;
              updatedCount++;
            } else if (sym === "^TNX") {
              liveMacro.us10y = Number(p.toFixed(2));
              liveMacro.us10yChg = chgPct;
              if (rCloses.length >= 4) liveMacro.us10yRecent = rCloses;
              if (rDates.length >= 4) liveMacro.us10yDates = rDates;
              updatedCount++;
            } else if (sym === "CL=F") {
              liveMacro.wtiOil = Number(p.toFixed(2));
              liveMacro.wtiChg = chgPct;
              updatedCount++;
            } else if (sym === "KRW=X") {
              liveMacro.usdkrw = Number(p.toFixed(1));
              liveMacro.usdkrwChg = chgPct;
              updatedCount++;
            } else if (sym === "TLT") {
              liveMacro.tlt = Number(p.toFixed(2));
              liveMacro.tltChg = chgPct;
              updatedCount++;
            }
            break;
          } catch (_) {}
        }
      }));
      return updatedCount;
    }

    async function refreshLivePrices(manual = false) {
      const btn = document.getElementById("refreshBtn");
      const badgeEl = document.getElementById("syncSourceBadge");
      if (btn && manual) {
        btn.textContent = "⏳ 실시간 판독중";
        btn.disabled = true;
      }
      if (badgeEl && manual) {
        badgeEl.textContent = "🔄 거래소·뉴스 실시간 재계산중...";
      }

      countdownSec = 30;
      let payload = null;

      const urlsToTry = [
        `data/latest_briefing.json?t=${Date.now()}`,
        `https://raw.githubusercontent.com/dnrzoqs-byte/memory-briefing/main/data/latest_briefing.json?t=${Date.now()}`,
        `https://cdn.jsdelivr.net/gh/dnrzoqs-byte/memory-briefing@main/data/latest_briefing.json?t=${Date.now()}`
      ];
      if (!location.hostname.endsWith("github.io")) {
        urlsToTry.unshift(`/api/briefing?t=${Date.now()}`);
      }

      for (const u of urlsToTry) {
        try {
          const r = await fetchWithTimeout(u, { cache: "no-store" }, 2800);
          if (r.ok) {
            const candidate = await r.json();
            if (candidate && (candidate.stocks || candidate.dram || candidate.dram_spot)) {
              payload = candidate;
              break;
            }
          }
        } catch (_) {}
      }

      if (payload) applyLivePayload(payload);

      // 수동 갱신 시 브라우저에서 직접 Yahoo Finance & Google News RSS 동시 쿼리
      let directCount = 0;
      let newsCount = 0;
      if (manual) {
        try {
          const [qCnt, nCnt] = await Promise.all([
            fetchDirectBrowserYahooQuotes(),
            fetchDirectBrowserNewsRSS()
          ]);
          directCount = qCnt;
          newsCount = nCnt;
        } catch (_) {}
      }

      recomputeAllDynamicMetrics();
      const container = document.getElementById("viewContainer");
      if (currentView === "dram") container.innerHTML = renderDramView();
      else if (currentView === "rates") container.innerHTML = renderRatesView();
      else if (currentView === "overview5") container.innerHTML = renderOverview5View();
      else if (currentView === "factcheck") container.innerHTML = renderFactCheckView();
      updateLiveClock();

      const stampEl = document.getElementById("lastDataStamp");
      const curTime = formatNowKstShort();
      if (stampEl) {
        const srcTime = payload?.updated_at ? ` (데이터: ${payload.updated_at.slice(5)})` : "";
        stampEl.textContent = `${curTime} 판독 완료${srcTime}`;
      }

      if (badgeEl) {
        badgeEl.textContent = (directCount > 0 || newsCount > 0)
          ? `🟢 거래소·뉴스 직접 연동 (${directCount}개)`
          : "🟢 Antigravity × Claude 퀀트엔진";
      }

      if (manual) {
        document.querySelectorAll(".bento-card, .bento-hero, .regime-gate-bar").forEach(c => {
          c.classList.remove("card-refreshed");
          void c.offsetWidth;
          c.classList.add("card-refreshed");
        });
        showToast(`✅ [${curTime} 최신 판독] 코스피 ${liveMacro.kospi.toFixed(0)}(${liveMacro.kospiChg.toFixed(1)}%) · VIX ${liveMacro.vix.toFixed(1)} · 삼전우 ${stockData.stock_005935.currLabel}`);
      }

      if (btn && manual) {
        btn.textContent = "✅ 판독완료";
        btn.disabled = false;
        setTimeout(() => { btn.textContent = "🔄 실시간 갱신"; }, 1200);
      }
    }

    (function initImmediate() {
      // 1단계: HTML 내부에 자동 주입된 최신 스냅샷 즉시 적용 (0.00초)
      if (window.__INITIAL_BRIEFING_PAYLOAD__) {
        applyLivePayload(window.__INITIAL_BRIEFING_PAYLOAD__);
      }
      recomputeAllDynamicMetrics();
      const params = new URLSearchParams(window.location.search);
      switchView(params.get("view") || "dram", false);
      updateLiveClock();
      setInterval(updateLiveClock, 1000);
      // 2단계: 서버/GitHub Raw 최신 JSON 즉시 동기화
      setTimeout(() => { refreshLivePrices(false); }, 50);
      setInterval(() => {
        if (!document.hidden) refreshLivePrices(false);
      }, 30000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshLivePrices(false);
      });
    })();
  </script>
