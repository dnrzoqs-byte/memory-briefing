<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>AI·반도체 객관적 인사이트 판독기 v6.0</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg-page: #EEF2F6;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --bg-accent: #EFF6FF;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --border-subtle: #F1F5F9;
      --up-red: #DC2626;
      --up-red-soft: rgba(220, 38, 38, 0.10);
      --down-blue: #2563EB;
      --down-blue-soft: rgba(37, 99, 235, 0.10);
      --safe-green: #059669;
      --safe-green-soft: rgba(5, 150, 105, 0.11);
      --warn-amber: #D97706;
      --warn-amber-soft: rgba(217, 119, 6, 0.12);
      --purple-accent: #7C3AED;
      --purple-soft: rgba(124, 58, 237, 0.10);
      --shadow-card: 0 2px 10px -2px rgba(15, 23, 42, 0.06), 0 1px 3px -1px rgba(15, 23, 42, 0.04);
    }

    html.dark {
      --bg-page: #090D16;
      --bg-surface: #111827;
      --bg-subtle: #1E293B;
      --bg-accent: #172554;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --border-color: #1F2937;
      --border-subtle: #1E293B;
      --up-red: #F87171;
      --up-red-soft: rgba(248, 113, 113, 0.15);
      --down-blue: #60A5FA;
      --down-blue-soft: rgba(96, 165, 250, 0.15);
      --safe-green: #34D399;
      --safe-green-soft: rgba(52, 211, 153, 0.15);
      --warn-amber: #FBBF24;
      --warn-amber-soft: rgba(251, 191, 36, 0.15);
      --purple-accent: #A78BFA;
      --purple-soft: rgba(167, 139, 250, 0.15);
      --shadow-card: 0 4px 14px -2px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.42;
      -webkit-font-smoothing: antialiased;
    }

    .tnum {
      font-variant-numeric: tabular-nums;
    }

    .app-shell {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 72px; /* 하단 고정 독(Bottom Dock) 여백 */
    }

    /* 상단 고정 헤더 */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 13px 6px;
      gap: 8px;
    }

    .header-title-wrap {
      min-width: 0;
      flex: 1;
    }

    .header-eyebrow {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--safe-green);
      box-shadow: 0 0 0 3px var(--safe-green-soft);
      display: inline-block;
      transition: transform 0.25s ease;
    }

    .header-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .btn-refresh {
      appearance: none;
      border: 1px solid var(--down-blue);
      background-color: var(--down-blue);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 800;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }

    .btn-refresh:active {
      transform: scale(0.96);
    }

    .btn-refresh:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .btn-dark {
      appearance: none;
      border: 1px solid var(--border-color);
      background-color: var(--bg-subtle);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 9px;
      border-radius: 8px;
      cursor: pointer;
    }

    .sync-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 13px 5px;
      background-color: var(--bg-subtle);
      border-top: 1px solid var(--border-subtle);
      font-size: 10px;
      color: var(--text-secondary);
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1.5px 6px;
      border-radius: 5px;
      font-weight: 800;
      font-size: 9.5px;
      background-color: var(--safe-green-soft);
      color: var(--safe-green);
    }

    /* 상단 4대 탭 */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-surface);
    }

    .nav-tab {
      appearance: none;
      border: none;
      background: transparent;
      padding: 8px 2px 7px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2.5px solid transparent;
      transition: all 0.15s ease;
      text-align: center;
      white-space: nowrap;
    }

    .nav-tab.active {
      color: var(--down-blue);
      border-bottom-color: var(--down-blue);
      font-weight: 800;
      background-color: var(--bg-subtle);
    }

    /* ★ 하단 고정 네비게이션 독 (Bottom Navigation Dock) */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 560px;
      background-color: var(--bg-surface);
      border-top: 1.5px solid var(--border-color);
      box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.08);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 60;
      padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px));
    }

    .dock-btn {
      appearance: none;
      border: none;
      background: transparent;
      padding: 5px 2px;
      border-radius: 8px;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .dock-btn.active {
      color: var(--down-blue);
      background-color: var(--down-blue-soft);
      font-weight: 800;
    }

    .dock-icon {
      font-size: 15px;
      line-height: 1;
    }

    .dock-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    /* 탭 하단 컨텍스트 이동 버튼 (In-Page Stepper) */
    .tab-footer-nav {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 8px;
      margin-top: 4px;
    }

    .footer-nav-btn {
      appearance: none;
      border: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      padding: 11px 12px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-card);
      transition: transform 0.12s ease;
    }

    .footer-nav-btn.primary {
      background-color: var(--down-blue);
      border-color: var(--down-blue);
      color: #FFFFFF;
    }

    .footer-nav-btn:active {
      transform: scale(0.98);
    }

    .view-body {
      flex: 1;
      padding: 10px 11px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @keyframes cardFlash {
      0% { box-shadow: 0 0 0 2px var(--down-blue); }
      100% { box-shadow: var(--shadow-card); }
    }

    .card-refreshed {
      animation: cardFlash 0.8s ease-out;
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 13px;
      box-shadow: var(--shadow-card);
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 800;
      padding: 2.5px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.32;
      letter-spacing: -0.01em;
    }

    /* =========================================================
       실시간 시장 국면 배너 & 종합 인사이트 판독 히어로 카드
       ========================================================= */
    .regime-banner {
      border-radius: 12px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 800;
    }

    .verdict-hero {
      background: linear-gradient(145deg, var(--bg-surface) 0%, var(--bg-accent) 100%);
      border: 1.5px solid rgba(37, 99, 235, 0.32);
      border-radius: 15px;
      padding: 13px;
      box-shadow: var(--shadow-card);
    }

    .verdict-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 11px;
      margin-bottom: 11px;
    }

    .score-circle {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .score-inner {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-color: var(--bg-surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.05;
    }

    .score-num {
      font-size: 18px;
      font-weight: 900;
    }

    .score-unit {
      font-size: 9px;
      font-weight: 800;
      color: var(--text-muted);
    }

    .verdict-headline-box {
      flex: 1;
      min-width: 0;
    }

    .verdict-main-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 99px;
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    .verdict-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.32;
    }

    .verdict-sub {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    /* 6대 객관적 모니터링 지표 그리드 (3x2) */
    .monitor-grid-6 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }

    .mon-cell {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 7px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mon-label {
      font-size: 9.5px;
      font-weight: 800;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mon-val {
      font-size: 13px;
      font-weight: 900;
      color: var(--text-primary);
    }

    .mon-sub {
      font-size: 9.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 5대 요소 바 */
    .factor-bars {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 11px;
      padding: 9px 10px;
      margin-bottom: 9px;
    }

    .factor-row {
      display: grid;
      grid-template-columns: 88px 1fr 122px;
      align-items: center;
      gap: 7px;
      font-size: 10.5px;
    }

    .factor-name {
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .factor-track {
      height: 6.5px;
      border-radius: 99px;
      background-color: var(--bg-subtle);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    .factor-fill {
      height: 100%;
      border-radius: 99px;
    }

    .factor-status {
      text-align: right;
      font-weight: 800;
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 3줄 핵심 결론 칩 */
    .verdict-3chips {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
    }

    .v-chip {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 9px;
      padding: 7px 9px;
      font-size: 11.5px;
      color: var(--text-primary);
    }

    .v-chip-tag {
      flex-shrink: 0;
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
      margin-top: 1px;
    }

    /* 인과관계 스텝퍼 (1단계 -> 2단계 -> 3단계) */
    .causal-flow {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .causal-step {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11.5px;
    }

    .step-num {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 5px;
      background-color: var(--down-blue);
      color: #FFFFFF;
      margin-top: 1px;
    }

    /* 찬반/득실 밸런스 박스 */
    .pros-cons-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-top: 7px;
    }

    .pc-box {
      border-radius: 10px;
      padding: 8px 9px;
      font-size: 11px;
      line-height: 1.4;
    }

    /* 서브 탭 그리드 */
    .seg-grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
      background-color: var(--bg-subtle);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 9px;
    }

    .seg-grid-3x2 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      background-color: var(--bg-subtle);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 9px;
    }

    .seg-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      padding: 7px 4px;
      border-radius: 7px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      text-align: center;
      cursor: pointer;
    }

    .seg-btn.active {
      background-color: var(--bg-surface);
      color: var(--down-blue);
      border-color: var(--down-blue);
      font-weight: 800;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .kpi-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 9px;
    }

    .kpi-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 10px;
      min-width: 0;
    }

    .kpi-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .kpi-val {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .kpi-sub {
      font-size: 10px;
      font-weight: 700;
      margin-top: 2px;
      color: var(--text-secondary);
    }

    .chart-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 11px;
      padding: 8px 6px 4px;
      overflow: hidden;
    }

    .chart-legend {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .svg-chart {
      width: 100%;
      height: auto;
      display: block;
    }

    .action-pill {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
      white-space: nowrap;
    }

    /* 6종목 스코어보드 테이블 */
    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .matrix-table th {
      text-align: left;
      padding: 6px 4px;
      font-size: 9.5px;
      font-weight: 800;
      color: var(--text-muted);
      border-bottom: 1.5px solid var(--border-color);
      background-color: var(--bg-subtle);
    }

    .matrix-table td {
      padding: 7px 4px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }

    .matrix-row {
      cursor: pointer;
    }

    .matrix-row.selected-row {
      background-color: var(--bg-accent);
    }

    /* 종목 상세 카드 */
    .stock-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
    }

    .stock-name {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .stock-code {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .stock-curr-wrap {
      text-align: right;
    }

    .stock-curr {
      font-size: 18px;
      font-weight: 900;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .stock-chg-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 3px;
    }

    .chg-pill {
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 9.5px;
      font-weight: 800;
    }

    .chg-up {
      background-color: var(--up-red-soft);
      color: var(--up-red);
    }

    .chg-down {
      background-color: var(--down-blue-soft);
      color: var(--down-blue);
    }

    .stock-key-chips {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
      margin-bottom: 9px;
    }

    .sk-chip {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 7px 9px;
      font-size: 11px;
      line-height: 1.38;
    }

    .sk-badge {
      flex-shrink: 0;
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      min-width: 56px;
      text-align: center;
      margin-top: 1px;
    }

    .band-gauge-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 9px;
    }

    .band-gauge-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .band-bar-track {
      height: 7px;
      border-radius: 999px;
      background: linear-gradient(90deg, #10B981 0%, #3B82F6 55%, #EF4444 100%);
      position: relative;
      margin: 4px 0;
    }

    .band-bar-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 13px;
      height: 13px;

    function renderLineSvg(pts, labels, forecastStartIdx, unitPrefix = "$", unitSuffix = "") {
      const w = 440, h = 144, padX = 34, topY = 24, botY = 110;
      const minV = Math.min(...pts) * 0.91;
      const maxV = Math.max(...pts) * 1.07;
      const range = maxV - minV || 1;
      const stepX = (w - padX * 2) / (pts.length - 1);

      const coords = pts.map((v, i) => ({
        x: padX + i * stepX,
        y: botY - ((v - minV) / range) * (botY - topY),
        v,
        label: labels[i] || ""
      }));

      const solidPts = coords.slice(0, forecastStartIdx + 1).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const dashPts = coords.slice(forecastStartIdx).map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const areaPts = `${coords[0].x.toFixed(1)},${botY} ` + coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ") + ` ${coords[coords.length - 1].x.toFixed(1)},${botY}`;

      let nodesHtml = "";
      coords.forEach((c, idx) => {
        const isForecast = idx > forecastStartIdx;
        const isCurrent = idx === forecastStartIdx;
        const dotColor = isCurrent ? "var(--up-red)" : (isForecast ? "var(--safe-green)" : "var(--down-blue)");
        const r = isCurrent ? 5 : 3.8;
        const valStr = `${unitPrefix}${Number.isInteger(c.v) ? c.v : c.v.toFixed(2)}${unitSuffix}`;
        const yOffset = idx % 2 === 0 ? -9 : -11;

        nodesHtml += `
          <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${r}" fill="${dotColor}" stroke="var(--bg-surface)" stroke-width="1.6" />
          <text x="${c.x.toFixed(1)}" y="${(c.y + yOffset).toFixed(1)}" text-anchor="middle" font-size="${isCurrent ? '10.5' : '9.5'}" font-weight="800" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-primary)'}">${valStr}</text>
          <text x="${c.x.toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="9.5" font-weight="${isCurrent ? '800' : '600'}" fill="${isCurrent ? 'var(--up-red)' : 'var(--text-muted)'}">${c.label}</text>
        `;
      });

      return `
        <svg viewBox="0 0 ${w} ${h}" class="svg-chart">
          <defs>
            <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--down-blue)" stop-opacity="0.16"/>
              <stop offset="100%" stop-color="var(--down-blue)" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <line x1="${padX}" y1="${topY}" x2="${w - padX}" y2="${topY}" stroke="var(--border-color)" stroke-dasharray="3 3" stroke-width="0.8" />
          <line x1="${padX}" y1="${(topY + botY) / 2}" x2="${w - padX}" y2="${(topY + botY) / 2}" stroke="var(--border-color)" stroke-dasharray="3 3" stroke-width="0.8" />
          <line x1="${padX}" y1="${botY}" x2="${w - padX}" y2="${botY}" stroke="var(--border-color)" stroke-width="1" />
          <polygon points="${areaPts}" fill="url(#chartGrad)" />
          <polyline fill="none" stroke="var(--down-blue)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="${solidPts}" />
          ${forecastStartIdx < coords.length - 1 ? `<polyline fill="none" stroke="var(--safe-green)" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" points="${dashPts}" />` : ""}
          ${nodesHtml}
        </svg>
      `;
    }

    function applyRichStockDetail(stockKey, detail, rawPriceFallback, rawHighFallback) {

          item.high52w = item.unit === "만" ? +(detail.high52w / 10000).toFixed(2) : +detail.high52w.toFixed(2);

          item.low52w = item.unit === "만" ? +(detail.low52w / 10000).toFixed(2) : +detail.low52w.toFixed(2);

          item.recentClosesRaw = detail.recent_closes;
        }
        if (Array.isArray(detail.recent_dates) && detail.recent_dates.length >= 4) {
          item.recentDates = detail.recent_dates;
        }
      } else {
        if (typeof rawPriceFallback === "number" && rawPriceFallback > 0) {
          item.rawCurr = rawPriceFallback;

    function getRealtimeMarketStatusText() {
      const now = new Date();

      if (wd === 0 || wd === 6) return `주말(${wdKr}) · 최신 종가 & 뉴스 반영`;
      if (hm >= 9 * 60 && hm < 15 * 60 + 30) return `평일(${wdKr}) 국내 정규장 실시간 가동중`;
      if (hm < 9 * 60) return `평일(${wdKr}) 미국장 마감 직후 · 국내 개장전`;
      return `평일(${wdKr}) 국내 마감 · 미국장 실시간 연동`;
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 2800) {
      const ctrl = new AbortController();

      } finally {
        clearTimeout(id);
      }
    }

    async function fetchDirectBrowserNewsRSS() {
      const queries = [
        { q: "엔비디아 실적 삼성전자 반도체", tag: "엔비디아·AI", target: "sector" },
        { q: "코스피 5000 금융당국 증시 안정 밸류업", tag: "국내증시 대책", target: "sector" },
        { q: "삼성전자 HBM 모딘 반도체", tag: "삼성 HBM", target: "005930.KS" },
        { q: "대덕전자 기판 반도체", tag: "기판 수급", target: "353200.KS" },
        { q: "원익IPS 영업이익 반도체", tag: "장비 실적", target: "240810.KQ" }
      ];
      let newsFetched = 0;
      const newSector = [];

      await Promise.all(queries.map(async (item) => {
        const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(item.q)}&hl=ko&gl=KR&ceid=KR:ko&_=${Date.now()}`;
        const proxyUrls = [
          `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`,
          `https://corsproxy.io/?${encodeURIComponent(rssUrl)}`
        ];
        for (const pUrl of proxyUrls) {
          try {
            const r = await fetchWithTimeout(pUrl, { cache: "no-store" }, 2800);
            if (!r.ok) continue;
            const xmlText = await r.text();
            const doc = new DOMParser().parseFromString(xmlText, "text/xml");
            const nodes = Array.from(doc.querySelectorAll("item")).slice(0, 2);
            if (!nodes.length) continue;

            const parsed = nodes.map(node => {
              let title = node.querySelector("title")?.textContent || "";
              const link = node.querySelector("link")?.textContent || "#";
              const source = node.querySelector("source")?.textContent || "뉴스";
              if (title.includes(" - ")) title = title.split(" - ").slice(0, -1).join(" - ").trim();
              return { tag: item.tag, title, source, link };
            });

            if (item.target === "sector") {
              newSector.push(...parsed);
            } else {
              liveNews.stocks[item.target] = parsed;
              if (item.target === "005930.KS") liveNews.stocks["005935.KS"] = parsed;
              newSector.push(parsed[0]);
            }
            newsFetched += parsed.length;
            break;
          } catch (_) {}
        }
      }));

      if (newSector.length >= 2) {
        liveNews.sector = newSector.slice(0, 4);
        liveNews.updatedAt = `${formatNowKstShort()} 실시간 RSS`;
      }
      return newsFetched;
    }

    // 브라우저에서 직접 15개 핵심 티커(6종목 + KOSPI/SOX/VIX/TNX/WTI/KRW/NVDA) 실시간 조회
    async function fetchDirectBrowserYahooQuotes() {
      const syms = [
        "005935.KS", "005930.KS", "353200.KS", "240810.KQ", "AMD", "CLS",
        "^KS11", "^SOX", "^VIX", "NVDA", "^TNX", "CL=F", "KRW=X", "TLT"
      ];
      const mapSym = {
        "005935.KS": "stock_005935",
        "005930.KS": "stock_005930",
        "353200.KS": "stock_353200",
        "240810.KQ": "stock_240810",
        "AMD": "stock_AMD",
        "CLS": "stock_CLS"
      };
      let updatedCount = 0;

      await Promise.all(syms.map(async (sym) => {
        const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=10d&_=${Date.now()}`;
        const proxyUrls = [
          `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
        ];
        for (const pUrl of proxyUrls) {
          try {
            const r = await fetchWithTimeout(pUrl, { cache: "no-store" }, 2600);
            if (!r.ok) continue;
            const j = await r.json();
            const res = j?.chart?.result?.[0];
            if (!res) continue;
            const meta = res.meta || {};
            const tsList = res.timestamp || [];
            const closesRaw = res.indicators?.quote?.[0]?.close || [];
            const isKrw = sym.endsWith(".KS") || sym.endsWith(".KQ");

            const pairs = [];
            for (let i = 0; i < tsList.length; i++) {
              const c = closesRaw[i];
              if (typeof c === "number" && c > 0) {
                const dt = new Date((tsList[i] + 9 * 3600) * 1000);
                pairs.push([`${dt.getUTCMonth() + 1}/${dt.getUTCDate()}`, isKrw ? Math.round(c) : Number(c.toFixed(2))]);
              }
            }
            const p = typeof meta.regularMarketPrice === "number"
              ? (isKrw ? Math.round(meta.regularMarketPrice) : Number(meta.regularMarketPrice.toFixed(2)))
              : (pairs.length ? pairs[pairs.length - 1][1] : null);
            if (!p) continue;

            if (pairs.length) pairs[pairs.length - 1][1] = p;
            const recent = pairs.slice(-5);
            const rDates = recent.map(x => x[0]);
            const rCloses = recent.map(x => x[1]);
            const prev = rCloses.length >= 2 ? rCloses[rCloses.length - 2] : (meta.chartPreviousClose || p);
            const chgPct = prev ? Number((((p - prev) / prev) * 100).toFixed(2)) : 0;
            const wkBase = rCloses.length ? rCloses[0] : prev;
            const wkPct = wkBase ? Number((((p - wkBase) / wkBase) * 100).toFixed(2)) : 0;

            if (mapSym[sym]) {
              applyRichStockDetail(mapSym[sym], {
                price: p,
                prev_close: prev,
                change_pct: chgPct,
                week_change_pct: wkPct,
                high52w: meta.fiftyTwoWeekHigh,
                low52w: meta.fiftyTwoWeekLow,
                recent_dates: rDates,
                recent_closes: rCloses
              });
              updatedCount++;
            } else if (sym === "^KS11") {
              liveMacro.kospi = Number(p.toFixed(2));
              liveMacro.kospiChg = chgPct;
              updatedCount++;
            } else if (sym === "^SOX") {
              liveMacro.sox = Number(p.toFixed(2));
              liveMacro.soxChg = chgPct;
              updatedCount++;
            } else if (sym === "^VIX") {
              liveMacro.vix = Number(p.toFixed(2));
              liveMacro.vixChg = chgPct;
              updatedCount++;
            } else if (sym === "NVDA") {
              liveMacro.nvda = Number(p.toFixed(2));
              liveMacro.nvdaChg = chgPct;
              updatedCount++;
            } else if (sym === "^TNX") {
              liveMacro.us10y = Number(p.toFixed(2));
              liveMacro.us10yChg = chgPct;
              if (rCloses.length >= 4) liveMacro.us10yRecent = rCloses;
              if (rDates.length >= 4) liveMacro.us10yDates = rDates;
              updatedCount++;
            } else if (sym === "CL=F") {
              liveMacro.wtiOil = Number(p.toFixed(2));
              liveMacro.wtiChg = chgPct;
              updatedCount++;
            } else if (sym === "KRW=X") {
              liveMacro.usdkrw = Number(p.toFixed(1));
              liveMacro.usdkrwChg = chgPct;
              updatedCount++;
            } else if (sym === "TLT") {
              liveMacro.tlt = Number(p.toFixed(2));
              liveMacro.tltChg = chgPct;
              updatedCount++;
            }
            break;
          } catch (_) {}
        }
      }));
      return updatedCount;
    }

    async function refreshLivePrices(manual = false) {
      const btn = document.getElementById("refreshBtn");

      countdownSec = 30;
      let payload = null;

      const urlsToTry = [
        `data/latest_briefing.json?t=${Date.now()}`,
        `https://raw.githubusercontent.com/dnrzoqs-byte/memory-briefing/main/data/latest_briefing.json?t=${Date.now()}`,
        `https://cdn.jsdelivr.net/gh/dnrzoqs-byte/memory-briefing@main/data/latest_briefing.json?t=${Date.now()}`
      ];
      if (!location.hostname.endsWith("github.io")) {
        urlsToTry.unshift(`/api/briefing?t=${Date.now()}`);
      }

      for (const u of urlsToTry) {
        try {
          const r = await fetchWithTimeout(u, { cache: "no-store" }, 2200);
          if (r.ok) {
            const candidate = await r.json();
            if (candidate && (candidate.stocks || candidate.dram || candidate.dram_spot)) {
              payload = candidate;
              break;
            }
          }
        } catch (_) {}
      }

      if (payload) applyLivePayload(payload);

      let directCount = 0;
      let newsCount = 0;
      if (manual) {
        try {
          const [qCnt, nCnt] = await Promise.all([
            fetchDirectBrowserYahooQuotes(),
            fetchDirectBrowserNewsRSS()
          ]);
          directCount = qCnt;
          newsCount = nCnt;
        } catch (_) {}
      }

      recomputeAllDynamicMetrics();
      const container = document.getElementById("viewContainer");
      if (currentView === "dram") container.innerHTML = renderDramView();
      else if (currentView === "rates") container.innerHTML = renderRatesView();
      else if (currentView === "overview5") container.innerHTML = renderOverview5View();
      else if (currentView === "factcheck") container.innerHTML = renderFactCheckView();
      updateLiveClock();

      if (badgeEl) {
        badgeEl.textContent = (directCount > 0 || newsCount > 0)
          ? `🟢 ${directCount}개 지표·뉴스 직접 연동됨`
          : "🟢 15개 지표·뉴스 실시간 연동";
      }
      const stampEl = document.getElementById("lastDataStamp");
      const curTime = formatNowKstShort();
      if (stampEl) stampEl.textContent = `${curTime} 시점 기준 판독 완료`;

      if (manual) {
        document.querySelectorAll(".card, .verdict-hero, .regime-banner").forEach(c => {
          c.classList.remove("card-refreshed");
          void c.offsetWidth;
          c.classList.add("card-refreshed");
        });
        showToast(`✅ [${curTime} 최신 판독] 코스피 ${liveMacro.kospi.toFixed(0)} · VIX ${liveMacro.vix.toFixed(1)} · 삼전우 ${stockData.stock_005935.currLabel} · 삼전 ${stockData.stock_005930.currLabel}`);
      }

      if (btn && manual) {
        btn.textContent = "✅ 판독완료";
        btn.disabled = false;
        setTimeout(() => { btn.textContent = "🔄 실시간 갱신"; }, 1200);
      }
    }

    (function initImmediate() {
      recomputeAllDynamicMetrics();
      const params = new URLSearchParams(window.location.search);
      switchView(params.get("view") || "dram", false);
      updateLiveClock();
      setInterval(updateLiveClock, 1000);
      setTimeout(() => { refreshLivePrices(false); }, 60);
      setInterval(() => {
        if (!document.hidden) refreshLivePrices(false);
      }, 30000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshLivePrices(false);
      });
    })();
  </script>
</body>
</html>
