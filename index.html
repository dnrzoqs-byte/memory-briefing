        x: padX + (i * (w - padX * 2)) / (pts.length - 1),
        y: botY - ((v - minV) / (maxV - minV)) * (botY - topY),
        v,
        label: labels[i]
      }));

      const actual = coords.slice(0, forecastStartIdx + 1);
      const forecast = coords.slice(forecastStartIdx);

          <path d="${areaD}" fill="#DC2626" fill-opacity="0.08" />
          <path d="${actualPath}" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="${forecastPath}" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" />
          ${coords.map((c, idx) => {
            const isForecast = idx > forecastStartIdx;

            const formattedVal = unitPrefix === "$" && c.v >= 100

          <div style="display:flex; flex-direction:column; gap:10px;" class="tnum">
            ${list.map(it => {
              const nowPct = Math.round((it.curr / it.hype) * 100);
              const t1Pct = Math.round((it.target1 / it.hype) * 100);
              const t2Pct = Math.round((it.target2 / it.hype) * 100);
              return `
                <div class="aligned-row">
                  <div class="row-header-flex">
                    <span style="font-size:14px; font-weight:800;">${it.name} <span style="font-size:12px; color:var(--down-blue);">(${it.currLabel})</span></span>
                    <span style="font-size:11px; font-weight:700; color:var(--text-secondary);">52주 최고 ${it.high52w}${it.unit} <span style="color:var(--text-muted); text-decoration:line-through;">(증권사최고 ${it.hypeLabel})</span></span>
                  </div>

                  <div style="position:relative; width:100%; height:10px; border-radius:999px; background:var(--border-color); overflow:hidden; margin:8px 0;">
                    <div style="position:absolute; top:0; left:0; height:100%; width:${t2Pct}%; background:var(--up-red); opacity:0.38; border-radius:999px;"></div>
                    <div style="position:absolute; top:0; left:0; height:100%; width:${t1Pct}%; background:var(--safe-green); border-radius:999px;"></div>
                    <div style="position:absolute; top:0; left:0; height:100%; width:${nowPct}%; background:var(--down-blue); border-radius:999px;"></div>
                  </div>

                  <div class="target-3col">
                    <div>
                      <div class="target-cell-label">■ 현재가 (낙폭)</div>
                      <div class="target-cell-val" style="color:var(--down-blue);">${it.curr}${it.unit} (${it.drawdown})</div>
                    </div>
                    <div>
                      <div class="target-cell-label">■ 1단계 적정가</div>
                      <div class="target-cell-val" style="color:var(--safe-green);">${it.target1Label}</div>
                    </div>
                    <div>
                      <div class="target-cell-label">■ 2단계 컨센서스</div>
                      <div class="target-cell-val" style="color:var(--up-red);">${it.target2Label}</div>
                    </div>
                  </div>
                </div>
              `;
            }).join("")}
          </div>

          <div class="insight-box" style="margin-top:12px;">
            <div class="insight-list">
              <div class="insight-item">
                <span class="insight-key">데이터 기준</span>
                <span>기계적인 비율이 아니라 <strong>실제 분기 영업이익·EPS 공시 팩트와 10년 역사적 PER·PBR 배수</strong>로 산출했습니다. 금리(미 10년 4.86%·한은 3.0%)가 현재처럼 높을 때는 <strong>1단계 펀더멘털 적정가(가능성 75~80%)</strong>를 기준점으로 삼고, 유가·금리가 하향 안정화되면 <strong>2단계 컨센서스·전고점 회복권(가능성 45~55%)</strong>까지 수익을 극대화하세요.</span>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    // =========================================================================
    // 5. 화면 전환 및 실시간 거래소(52주 최고가 포함) · Git 자동 동기화 엔진
    // =========================================================================
    const viewTitles = {
      dram: "🔮 메모리 가격 팩트 (DRAM·HBM4·eSSD)",
      rates: "🏦 한·미 금리 · 유가 · 부동산 유동성",
      overview5: "🎯 6종목 공시 팩트 & 목표가 (CLS 포함)",
      factcheck: "⚖️ 52주 최고가 · 컨센서스 · 적정가 비교"
    };

    function switchView(viewName, updateUrl = true) {
      if (viewName.startsWith("stock_")) {
        currentStockKey = viewName;
        currentView = "overview5";
      } else if (["dram", "rates", "overview5", "factcheck"].includes(viewName)) {
        currentView = viewName;
      } else {
        currentView = "dram";
      }

      const titleEl = document.getElementById("headerTitle");
      if (titleEl) titleEl.textContent = viewTitles[currentView] || "메모리 · 6종목 팩트 리포트";

      const container = document.getElementById("viewContainer");
      if (currentView === "dram") container.innerHTML = renderDramView();
      else if (currentView === "rates") container.innerHTML = renderRatesView();
      else if (currentView === "overview5") container.innerHTML = renderOverview5View();
      else if (currentView === "factcheck") container.innerHTML = renderFactCheckView();

      if (updateUrl && window.history && window.history.replaceState) {
        const url = new URL(window.location.href);
        url.searchParams.set("view", currentView);
        window.history.replaceState({}, "", url.toString());
      }
    }

    window.selectDramKey = function(key) {
      currentDramKey = key;
      switchView("dram", false);
    };

    window.selectStockKey = function(key) {
      currentStockKey = key;
      switchView("overview5", false);
      const detailEl = document.getElementById("stockDetailCard");
      if (detailEl) detailEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    };

    window.toggleDark = function() {
      const isDark = document.documentElement.classList.toggle("dark");
      const btn = document.getElementById("darkBtn");
      if (btn) btn.textContent = isDark ? "라이트" : "다크";
    };

    function updateStockMetrics(stockKey, rawPrice, rawHigh52w) {
      const item = stockData[stockKey];
      if (!item || typeof rawPrice !== "number") return;
      if (item.unit === "만") {
        item.curr = +(rawPrice / 10000).toFixed(2);
        item.currLabel = Math.round(rawPrice).toLocaleString() + "원";
        if (typeof rawHigh52w === "number" && rawHigh52w > 0) {
          item.high52w = +(rawHigh52w / 10000).toFixed(2);
        }
      } else {
        item.curr = +rawPrice.toFixed(2);
        item.currLabel = "$" + rawPrice.toFixed(2);
        if (typeof rawHigh52w === "number" && rawHigh52w > 0) {
          item.high52w = +rawHigh52w.toFixed(2);
        }
      }
      item.history[4] = item.curr;
      if (item.high52w > 0) {
        const dd = ((item.curr - item.high52w) / item.high52w) * 100;
        item.drawdown = (dd >= 0 ? "+" : "") + dd.toFixed(1) + "%";
      }
    }

    function applyLivePayload(data) {
      if (!data) return;
      if (data.ddr5_price) {
        dramSeries.ddr5_16g.price = Number(data.ddr5_price);
        dramSeries.ddr5_16g.pts[4] = Number(data.ddr5_price);
      }
      if (data.ddr4_16g_price) {
        dramSeries.ddr4_16g.price = Number(data.ddr4_16g_price);
        dramSeries.ddr4_16g.pts[4] = Number(data.ddr4_16g_price);
      }
      if (data.us10y) liveMacro.us10y = Number(data.us10y);
      if (data.us2y) liveMacro.us2y = Number(data.us2y);
      if (data.tlt_price) liveMacro.tlt = Number(data.tlt_price);
      if (data.wti_oil) liveMacro.wtiOil = Number(data.wti_oil);
      if (data.usdkrw) liveMacro.usdkrw = Number(data.usdkrw);
      if (Array.isArray(data.dynamic_issues) && data.dynamic_issues.length > 0) {
        dynamicIssues = data.dynamic_issues;
      }
      if (data.stocks) {
        const st = data.stocks;
        const h52 = data.high52w || {};
        if (st["005935.KS"]) updateStockMetrics("stock_005935", Number(st["005935.KS"]), Number(h52["005935.KS"]));
        if (st["005930.KS"]) updateStockMetrics("stock_005930", Number(st["005930.KS"]), Number(h52["005930.KS"]));
        if (st["353200.KS"]) updateStockMetrics("stock_353200", Number(st["353200.KS"]), Number(h52["353200.KS"]));
        if (st["240810.KQ"]) updateStockMetrics("stock_240810", Number(st["240810.KQ"]), Number(h52["240810.KQ"]));
        if (st["AMD"]) updateStockMetrics("stock_AMD", Number(st["AMD"]), Number(h52["AMD"]));
        if (st["CLS"]) updateStockMetrics("stock_CLS", Number(st["CLS"]), Number(h52["CLS"]));
      }
      const tEl = document.getElementById("liveTimeText");
      const ts = data.timestamp || data.updated_at;
      if (tEl && ts) {
        tEl.textContent = `실시간 팩트 기준: ${ts}`;
      }
    }

    async function refreshLivePrices(manual = false) {
      const btn = document.getElementById("refreshBtn");
      if (btn && manual) btn.textContent = "⏳ 갱신중";

      let updated = false;

      try {
        const r = await fetch(`/api/briefing?t=${Date.now()}`, { cache: "no-store" });
        if (r.ok) {
          const d = await r.json();
          applyLivePayload(d);
          updated = true;
        }
      } catch (_) {}

      if (!updated) {
        try {
          const ghUrl = `https://api.github.com/repos/dnrzoqs-byte/memory-briefing/contents/data/latest_briefing.json?t=${Date.now()}`;
          const rGh = await fetch(ghUrl, {
            cache: "no-store",
            headers: { "Accept": "application/vnd.github.raw+json" }
          });
          if (rGh.ok) {
            const dGh = await rGh.json();
            applyLivePayload(dGh);
            updated = true;
          }
        } catch (_) {}
      }

      // 거래소 API에서 실시간 현재가 + 실제 52주 최고가(fiftyTwoWeekHigh)를 함께 조회
      try {
        const syms = ["005935.KS", "005930.KS", "353200.KS", "240810.KQ", "AMD", "CLS", "CL=F", "^TNX", "TLT"];
        const liveQuotes = {};
        const liveHighs = {};
        await Promise.all(
          syms.map(async (sym) => {
            const yUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?interval=1d&range=5d`;
            const pUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(yUrl)}&t=${Date.now()}`;
            const r = await fetch(pUrl, { cache: "no-store" });
            if (r.ok) {
              const j = await r.json();
              const meta = j?.chart?.result?.[0]?.meta;
              if (typeof meta?.regularMarketPrice === "number") liveQuotes[sym] = meta.regularMarketPrice;
              if (typeof meta?.fiftyTwoWeekHigh === "number") liveHighs[sym] = meta.fiftyTwoWeekHigh;
            }
          })
        );
        const nowKst = new Date(Date.now() + 9 * 3600 * 1000).toISOString().replace("T", " ").slice(0, 16) + " KST";
        const patch = { stocks: {}, high52w: liveHighs, timestamp: nowKst };
        ["005935.KS", "005930.KS", "353200.KS", "240810.KQ", "AMD", "CLS"].forEach(k => {
          if (liveQuotes[k]) patch.stocks[k] = liveQuotes[k];
        });
        if (liveQuotes["CL=F"]) patch.wti_oil = liveQuotes["CL=F"];
        if (liveQuotes["^TNX"]) patch.us10y = liveQuotes["^TNX"];
        if (liveQuotes["TLT"]) patch.tlt_price = liveQuotes["TLT"];
        if (Object.keys(patch.stocks).length > 0 || patch.wti_oil || patch.us10y) {
          applyLivePayload(patch);
        }
      } catch (_) {}

      switchView(currentView, false);

      if (btn && manual) {
        btn.textContent = "✅ 완료";
        setTimeout(() => { btn.textContent = "🔄 갱신"; }, 1800);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const requestedView = params.get("view") || "dram";
      switchView(requestedView, false);
      refreshLivePrices(false);
    });
  </script>
</body>
</html>
